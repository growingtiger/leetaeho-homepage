<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>케이스 노트 · 청담장튼튼내과동물병원</title>
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1514" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f4; --surface:#fcfdfc; --sunken:#eaeeec; --ink:#152120; --ink-2:#3f4e4c; --ink-3:#5c6a68;
  --line:#d9e0dd; --line-2:#e6ebe9; --accent:#0d5f56; --accent-ink:#f2faf8; --accent-wash:#e1eeeb; --accent-line:#b5d3cc;
  --band:rgba(13,95,86,.09); --scrim:rgba(14,22,21,.38);
  --shadow:0 1px 2px rgba(21,33,32,.05),0 10px 30px -12px rgba(21,33,32,.14);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hh:60px; --nav:64px; --r:14px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#151d1c; --sunken:#1c2625; --ink:#e4ebe9; --ink-2:#b1bfbc; --ink-3:#8b9a97;
  --line:#26312f; --line-2:#1f2927; --accent:#63bcad; --accent-ink:#0b1514; --accent-wash:#16302c; --accent-line:#2c4c46;
  --band:rgba(99,188,173,.12); --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#151d1c; --sunken:#1c2625; --ink:#e4ebe9; --ink-2:#b1bfbc; --ink-3:#8b9a97;
  --line:#26312f; --line-2:#1f2927; --accent:#63bcad; --accent-ink:#0b1514; --accent-wash:#16302c; --accent-line:#2c4c46;
  --band:rgba(99,188,173,.12); --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
@media(min-width:768px){body{padding-bottom:0}}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
@media(min-width:768px){.wrap{padding-inline:28px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 머리 */
.strip{font-size:13px;color:var(--ink-3);line-height:1.5;padding-top:10px;padding-bottom:2px}
.strip b{font-weight:500;color:var(--ink-2)}
.strip .demo{display:block}
@media(min-width:768px){.strip .demo{display:inline}.strip .demo::before{content:" · "}}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.lined{border-bottom-color:var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:var(--hh)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:-.01em;background:none;border:0;padding:0;min-height:44px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:17px;height:17px;stroke-width:2}
.toptabs{display:none;margin-left:auto;gap:4px}
@media(min-width:768px){.toptabs{display:flex}}
.toptabs button{border:0;background:none;padding:0 14px;min-height:40px;border-radius:999px;font-size:15px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.toptabs button svg{width:18px;height:18px}
.toptabs button:hover{color:var(--ink);background:var(--sunken)}
.toptabs button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:768px){.botnav{display:none}}
.botnav button{border:0;background:none;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink-3);letter-spacing:.01em}
.botnav button[aria-current="page"]{color:var(--accent)}
.botnav button[aria-current="page"] svg{stroke-width:2}

main{padding:12px 0 56px;min-height:70vh}
@media(min-width:768px){main{padding-top:24px}}
.foot{display:none;border-top:1px solid var(--line);padding:18px 0 30px;font-size:13px;color:var(--ink-3)}
@media(min-width:768px){.foot{display:block}}

/* 공통 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;color:var(--ink);transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.quiet{background:none;border-color:transparent;color:var(--ink-2);padding:0 10px}
.btn.quiet:hover{color:var(--ink);background:var(--sunken)}
.btn.danger{color:#a3392c}
:root[data-theme="dark"] .btn.danger{color:#e8907f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.danger{color:#e8907f}}
.btn.block{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-3)}
.h-page{font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.lede{color:var(--ink-2);margin-top:6px;max-width:60ch}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:60;box-shadow:var(--shadow)}
@media(min-width:768px){.toast{bottom:28px}}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pill{display:inline-flex;align-items:center;font-size:13px;line-height:1;padding:6px 10px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.pill.on{background:var(--accent-wash);color:var(--accent)}
.flag{font-weight:600;color:var(--accent);white-space:nowrap}

/* 목록 */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:20px;height:20px}
.search input{width:100%;height:50px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:0 14px 0 44px;font-size:16px}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
@media(min-width:768px){.chips{margin-inline:0;padding-inline:0;flex-wrap:wrap}}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip small{font-size:12.5px;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.listmeta{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;font-size:14px;color:var(--ink-3)}
.cases{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cases li+li{border-top:1px solid var(--line-2)}
.crow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;padding:15px 16px 14px;cursor:pointer;transition:background .15s}
.crow:hover{background:color-mix(in srgb,var(--sunken) 55%,transparent)}
.crow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.crow[aria-current="true"]{background:var(--accent-wash)}
.crow .dx{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.4}
.crow .st{font-size:13px;color:var(--ink-3);padding-top:3px;text-align:right}
.crow .pt{grid-column:1/-1;font-size:15px;color:var(--ink-2)}
.crow .kv{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;color:var(--ink-2)}
.crow .kv svg{flex:none}
.crow .kv .when{margin-left:auto;color:var(--ink-3);font-size:13px}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.listhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.split{display:block}
@media(min-width:1024px){
  .split{display:grid;grid-template-columns:380px minmax(0,1fr);gap:36px;align-items:start}
  .pane-l{position:sticky;top:calc(var(--hh) + 12px);max-height:calc(100dvh - var(--hh) - 24px);overflow:auto;padding:2px 4px 24px 2px;scrollbar-width:thin}
  .pane-r{min-width:0}
  .split .crow .kv .when{display:none}
  .pane-l .chips{flex-wrap:nowrap;margin-inline:-2px;padding:0 2px 4px;mask-image:linear-gradient(90deg,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
}
.pickhint{display:none}
@media(min-width:1024px){.pickhint{display:grid;place-items:center;min-height:60vh;border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-3);text-align:center;padding:24px}}

/* 상세 */
.back{display:inline-flex;align-items:center;gap:4px;margin:0 0 6px -10px}
@media(min-width:1024px){.split .back{display:none}}
.who{font-size:15px;color:var(--ink-2)}
.who .fic{font-size:12.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:1px}
.dxh{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.28;margin-top:4px}
@media(min-width:768px){.dxh{font-size:30px}}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.make{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.make p{font-size:14px;color:var(--ink-3);margin-bottom:10px}
.make .more{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.make .more .btn{padding:0 8px;font-size:14.5px}
.make .btn.pri{min-height:52px;font-size:16px}
@media(min-width:768px){.make{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.make p{flex-basis:100%}.make .btn.pri{width:auto;padding:0 22px}.make .more{display:flex;margin:0;gap:10px}.make .more .btn{min-height:52px;padding:0 16px;font-size:15px}}
.sec{margin-top:32px}
.sec>h2{font-size:18px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec>h2 small{font-size:13px;font-weight:400;color:var(--ink-3)}
.trend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 8px}
.trend .chips{margin:0 -14px 6px;padding:0 14px 2px}
@media(min-width:768px){.trend .chips{margin-inline:0;padding-inline:0}}
.trend .chip{min-height:38px;font-size:14.5px}
.trend .now{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:8px 2px 0}
.trend .now b{font-size:28px;font-weight:600;letter-spacing:-.02em}
.trend .now span{color:var(--ink-2);font-size:15px}
.trend svg.ch{display:block;width:100%;height:auto;margin-top:4px}
.trend .cap{font-size:13px;color:var(--ink-3);padding:4px 2px 6px;line-height:1.5}
.labs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.labs details+details{border-top:1px solid var(--line-2)}
.labs summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;cursor:pointer;font-weight:500}
.labs summary::-webkit-details-marker{display:none}
.labs summary .muted{font-weight:400;font-size:14px;margin-left:auto}
.labs summary svg{width:18px;height:18px;color:var(--ink-3);transition:transform .2s}
.labs details[open] summary svg{transform:rotate(90deg)}
.lt{width:100%;border-collapse:collapse;font-size:15px}
.lt td{padding:9px 16px;border-top:1px solid var(--line-2);vertical-align:baseline}
.lt td.n{color:var(--ink-2)}
.lt td.v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lt td.v small{color:var(--ink-3);font-size:12.5px;margin-left:3px}
.lt td.r{color:var(--ink-3);font-size:13px;text-align:right;white-space:nowrap;width:1%}
@media(max-width:420px){.lt td{padding-inline:12px}.lt td.r{display:none}}
.find{list-style:none;margin:0;padding:0}
.find li{padding:12px 16px;border-top:1px solid var(--line-2)}
.find li:first-child{border-top:0}
.find b{font-weight:500;display:block}
.find span{color:var(--ink-2);font-size:15px}
.find time{font-size:13px;color:var(--ink-3);margin-left:6px;font-weight:400}
.prose{color:var(--ink);max-width:62ch}
.prose ul,.prose ol{margin:0;padding-left:20px}
.prose li+li{margin-top:4px}
.cols{display:grid;gap:28px}
@media(min-width:768px){.cols{grid-template-columns:1fr 1fr;gap:36px}}
.cols h3{font-size:15px;font-weight:600;margin-bottom:8px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 18px 22px}
.tl li::before{content:"";position:absolute;left:4px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tl li::after{content:"";position:absolute;left:7px;top:22px;bottom:2px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl time{display:block;font-size:13.5px;color:var(--ink-3)}
.next{display:flex;gap:14px;align-items:center;background:var(--accent-wash);border-radius:var(--r);padding:14px 16px}
.next .d{font-size:22px;font-weight:600;color:var(--accent);letter-spacing:-.02em;white-space:nowrap}
.next p{font-size:15px;color:var(--ink-2)}
.edrow{display:flex;justify-content:flex-end;margin-top:28px;gap:8px}

/* 검사별 */
.tgrid{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tgrid li+li{border-top:1px solid var(--line-2)}
.trow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;width:100%;padding:14px 16px;cursor:pointer}
.trow:hover{background:color-mix(in srgb,var(--sunken) 55%,transparent)}
.trow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.trow .a{font-weight:600}
.trow .b{grid-column:1;font-size:14.5px;color:var(--ink-2)}
.trow .c{grid-row:1/3;grid-column:2;text-align:right;font-variant-numeric:tabular-nums}
.trow .c b{display:block;font-size:19px;font-weight:600;letter-spacing:-.01em}
.trow .c small{font-size:13px;color:var(--ink-3)}
.trow .s{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-3);margin-top:4px}
.tsum{display:flex;gap:10px 22px;flex-wrap:wrap;margin:16px 0 12px;font-size:14px;color:var(--ink-2)}
.tsum b{font-weight:600;color:var(--ink)}

/* 재진 */
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.vrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:62px 1fr;gap:4px 14px}
.vrow .dd{grid-row:1/4;text-align:center;border-right:1px solid var(--line-2);padding-right:12px}
.vrow .dd b{display:block;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.vrow .dd span{display:block}
.vrow .dd span{font-size:13px;color:var(--ink-3)}
.vrow .dd em{display:block;font-style:normal;font-size:12.5px;margin-top:4px;color:var(--accent);font-weight:600}
.vrow .nm{font-weight:600}
.vrow .nm button{all:unset;cursor:pointer;border-bottom:1px solid var(--line)}
.vrow .nm button:focus-visible{outline:2px solid var(--accent)}
.vrow .nt{font-size:15px;color:var(--ink-2)}
.vrow .ac{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.vrow.past{opacity:.6}
.grp{font-size:14px;color:var(--ink-3);margin:22px 0 8px}

/* 보관 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 20px;max-width:680px}
.panel+.panel{margin-top:12px}
.panel h2{font-size:17px;font-weight:600;margin-bottom:4px}
.panel p{color:var(--ink-2);font-size:15px;margin-bottom:14px}
.panel .row{display:flex;gap:8px;flex-wrap:wrap}
.note-local{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);background:var(--accent-wash);border-radius:var(--r-sm);padding:12px 14px;margin:16px 0;max-width:680px}
.note-local svg{color:var(--accent);margin-top:1px;width:20px;height:20px}

/* 편집 */
.form{max-width:760px}
.fs{border:0;margin:0;padding:22px 0 6px;border-top:1px solid var(--line);min-width:0}
.fs:first-of-type{border-top:0;padding-top:8px}
.fs legend{font-size:17px;font-weight:600;padding:0 0 12px;float:left;width:100%}
.fs legend+*{clear:both}
.f{display:grid;gap:6px;margin-bottom:14px;min-width:0}
.f label{font-size:14px;color:var(--ink-2);font-weight:500}
.f .hint{font-size:13px;color:var(--ink-3)}
.in{width:100%;min-width:0;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;font-size:16px}
textarea.in{min-height:96px;resize:vertical;line-height:1.6}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.g2{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}
.g3{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}
@media(min-width:720px){.g3{grid-template-columns:repeat(3,1fr)}}
.er{display:grid;gap:8px;padding:12px;background:var(--sunken);border-radius:var(--r-sm);margin-bottom:8px;grid-template-columns:1fr 1fr}
.er .full{grid-column:1/-1}
.er .x{justify-self:end;grid-column:1/-1}
.er.lab{grid-template-columns:1fr 92px 44px;grid-template-areas:"k k k" "d v x";padding:10px}
.er.lab [data-k=k]{grid-area:k}.er.lab [data-k=d]{grid-area:d}.er.lab [data-k=v]{grid-area:v}.er.lab .x{grid-area:x;width:44px;padding:0;justify-self:stretch}
@media(min-width:720px){.er.lab{grid-template-columns:160px 1fr 140px 44px;grid-template-areas:"d k v x"}
  .er.fd{grid-template-columns:160px 170px 1fr}.er.fd .full{grid-column:auto}.er.fd .wide{grid-column:1/-1}
  .er.lg{grid-template-columns:160px 1fr auto}.er.lg .full{grid-column:auto}.er.lg .x{grid-column:auto}}

var db;
function load(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&Array.isArray(d.cases))return d;}}catch(e){}return sample();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast("이 기기에서는 저장이 막혀 있습니다");}}
db=load();if(!db.contact)db.contact=CONTACT_DEFAULT;

/* ---------- 도구 ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function lines(s){return String(s||"").split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);}
function dt(d){var p=String(d||"").split("-");return p.length<3?null:new Date(+p[0],+p[1]-1,+p[2]);}
function fmtDate(d){var p=String(d||"").split("-");return p.length<3?String(d||""):p[0]+". "+(+p[1])+". "+(+p[2])+".";}
function md(d){var p=String(d||"").split("-");return p.length<3?"":(+p[1])+"."+(+p[2]);}
function korDate(d){var p=String(d||"").split("-");return p.length<3?String(d||""):(+p[1])+"월 "+(+p[2])+"일";}
var WD=["일","월","화","수","목","금","토"];
function wd(d){var x=dt(d);return x?WD[x.getDay()]:"";}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dday(d){var a=dt(today()),b=dt(d);if(!a||!b)return null;return Math.round((b-a)/864e5);}
function byId(id){for(var i=0;i<db.cases.length;i++)if(db.cases[i].id===id)return db.cases[i];return null;}
function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function spc(c){return c.species==="고양이"?"cat":"dog";}
function ref(k,c){var a=A[k];return a&&a.ref?a.ref[spc(c)]||null:null;}
function fmtV(k,v){if(v==null||v==="")return "";var a=A[k];if(!a)return String(v);var t=Number(v).toFixed(a.dp);if(a.dp>1)t=t.replace(/0$/,"");return t;}
function refText(k,c){var a=A[k];if(!a)return "";if(a.rt&&a.rt[spc(c)])return a.rt[spc(c)];var r=ref(k,c);return r?fmtV(k,r[0])+"~"+fmtV(k,r[1]):"";}
/* 기준값이 단계로 나뉘는 항목: 정상 / 경계(B) / 높음(H) */
var TH={
  SBP:{f:function(v){return v>=160?"H":v>=140?"B":"";},B:"고혈압 전 단계",H:"고혈압",Bs:function(){return "고혈압 전 단계(140~159)에 해당합니다";},Hs:function(){return "고혈압 기준(160 이상)에 해당합니다";}},
  CPL:{f:function(v){return v>=400?"H":v>200?"B":"";},B:"판단 보류",H:"췌장염 부합",Bs:function(){return "판단 보류 구간(201~399)이라 2~3주 뒤 다시 확인합니다";},Hs:function(){return "췌장염에 부합하는 수치(400 이상)입니다";}},
  UPCR:{f:function(v,c){var h=spc(c)==="cat"?0.4:0.5;return v>h?"H":v>=0.2?"B":"";},B:"경계 단백뇨",H:"단백뇨",
    Bs:function(c){return "경계 단백뇨 구간(0.2~"+(spc(c)==="cat"?"0.4":"0.5")+")에 해당합니다";},Hs:function(c){return "단백뇨 기준("+(spc(c)==="cat"?"0.4":"0.5")+" 초과)보다 높습니다";}}
};
function flag(k,c,v){if(v==null)return "";if(TH[k])return TH[k].f(v,c);var r=ref(k,c);if(!r)return "";if(v>r[1])return "H";if(v<r[0])return "L";return "";}
function flagLabel(f,k){if(!f)return "";if(TH[k])return TH[k][f]||"";return f==="H"?"높음":"낮음";}
function flagWord(f,k){if(!f)return "";return (f==="H"?"↑ ":f==="L"?"↓ ":"")+flagLabel(f,k);}
function flagMark(f){return f==="H"?"↑":f==="L"?"↓":f==="B"?"경계":"";}
function rng(k){return TH[k]?"정상 기준":"참고 범위";}
function su(k){var u=A[k]&&A[k].u;return u?(u==="%"?"":" ")+u:"";}
function dayStr(d){var w=wd(d);return korDate(d)+(w?"("+w+")":"");}
function series(c,k){return (c.labs||[]).filter(function(l){return l.v&&l.v[k]!=null&&l.v[k]!=="";}).sort(function(a,b){return a.d.localeCompare(b.d);}).map(function(l){return {d:l.d,v:+l.v[k]};});}
function keysOf(c){
  var have={};(c.labs||[]).forEach(function(l){Object.keys(l.v||{}).forEach(function(k){if(A[k])have[k]=(have[k]||0)+1;});});
  var ks=(c.keys||[]).filter(function(k){return have[k];});
  if(!ks.length)ks=Object.keys(have).sort(function(a,b){return have[b]-have[a];}).slice(0,3);
  return ks;

function jong(w){w=String(w||"").replace(/\([^)]*\)\s*$/,"").trim();if(!w)return 0;var c=w.charAt(w.length-1),ch=w.charCodeAt(w.length-1);

function sparkSVG(c,k,w,h){

  function y(v){return Math.max(0,Math.min(h,(h-2)-(v-mn)/(mx-mn)*(h-4)));}
  function x(i){return s.length===1?w/2:2+i*(w-4)/(s.length-1);}
  var band=r&&y(r[0])-y(r[1])>0.5?'<rect x="0" y="'+y(r[1]).toFixed(1)+'" width="'+w+'" height="'+(y(r[0])-y(r[1])).toFixed(1)+'" fill="var(--band)" rx="2"/>':"";
  var pts=s.map(function(p,i){return x(i).toFixed(1)+","+y(p.v).toFixed(1);}).join(" ");
  var last=s[s.length-1];
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+band+(s.length>1?'<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>':'')+
    '<circle cx="'+x(s.length-1).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="2.6" fill="var(--accent)"/></svg>';
}
function chartW(){

function domain(vs,r){
  var lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  if(r){
    if(lo>=r[0]&&hi<=r[1]){lo=r[0];hi=r[1];}
    else{
      if(hi>r[1]&&lo>=r[0])lo=Math.min(lo,r[1]);
      if(lo<r[0]&&hi<=r[1])hi=Math.max(hi,r[0]);
    }
  }
  var span=hi-lo;if(!span)span=Math.abs(hi)*.2||1;
  lo-=span*.22;hi+=span*.3;
  if(lo<0&&Math.min.apply(null,vs)>=0)lo=0;

}
function chartSVG(c,k){
  var s=series(c,k);if(!s.length)return "";
  var W=chartW(),H=W>500?220:184,L=44,R=18,T=28,B=30,r=ref(k,c);
  var vs=s.map(function(p){return p.v;}),vmn=Math.min.apply(null,vs),vmx=Math.max.apply(null,vs),d=domain(vs,r),mn=d[0],mx=d[1];
  var t0=dt(s[0].d).getTime(),t1=dt(s[s.length-1].d).getTime(),X0=L+18,X1=W-R-4;
  function x(p){return s.length===1||t1===t0?(X0+X1)/2:X0+(dt(p.d).getTime()-t0)/(t1-t0)*(X1-X0);}
  function y(v){return T+(1-(v-mn)/(mx-mn))*(H-T-B);}
  var o='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(A[k].n)+' 추이: '+s.map(function(p){return md(p.d)+" "+fmtV(k,p.v);}).join(", ")+'">';
  if(r){var yt=Math.max(6,y(r[1])),yb=Math.min(H-B,y(r[0]));
    if(yb>yt)o+='<rect x="'+L+'" y="'+yt.toFixed(1)+'" width="'+(W-L-R+6)+'" height="'+(yb-yt).toFixed(1)+'" fill="var(--band)" rx="4"/>';
    if(r[1]<=mx&&r[1]>=mn)o+='<line x1="'+L+'" x2="'+(W-R+6)+'" y1="'+y(r[1]).toFixed(1)+'" y2="'+y(r[1]).toFixed(1)+'" stroke="var(--accent-line)" stroke-dasharray="3 4"/><text x="'+(L-8)+'" y="'+(y(r[1])+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--ink-3)">'+fmtV(k,r[1])+'</text>';
    if(r[0]>0&&r[0]<=mx&&r[0]>=mn)o+='<line x1="'+L+'" x2="'+(W-R+6)+'" y1="'+y(r[0]).toFixed(1)+'" y2="'+y(r[0]).toFixed(1)+'" stroke="var(--accent-line)" stroke-dasharray="3 4"/><text x="'+(L-8)+'" y="'+(y(r[0])+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--ink-3)">'+fmtV(k,r[0])+'</text>';}
  o+='<line x1="'+L+'" x2="'+(W-R+6)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--line)"/>';
  if(s.length>1)o+='<polyline points="'+s.map(function(p){return x(p).toFixed(1)+","+y(p.v).toFixed(1);}).join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  var lastX=-99;
  s.forEach(function(p,i){var cx=x(p),cy=y(p.v),last=i===s.length-1;
    o+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(last?5:4)+'" fill="'+(last?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>';
    o+='<text x="'+cx.toFixed(1)+'" y="'+(cy-11).toFixed(1)+'" text-anchor="middle" font-size="12.5" font-weight="'+(last?600:500)+'" fill="var(--ink)" style="font-variant-numeric:tabular-nums">'+fmtV(k,p.v)+'</text>';

  });
  return o+'</svg>';
}

function latestOf(c,k){var s=series(c,k);return {last:s[s.length-1],prev:s[s.length-2]};}
function statusSentence(k,c,v){var f=flag(k,c,v),rt=refText(k,c),r=ref(k,c);
  if(!r&&!TH[k])return "";
  if(TH[k])return f==="H"?TH[k].Hs(c):f==="B"?TH[k].Bs(c):"정상 기준("+rt+") 안입니다";
  return f==="H"?"참고 범위("+rt+")보다 높습니다":f==="L"?"참고 범위("+rt+")보다 낮습니다":"참고 범위("+rt+") 안에 있습니다";}
function trendSentence(k,c){
  var o=latestOf(c,k),l=o.last,p=o.prev;if(!l||!p)return "";
  var fl=flag(k,c,l.v),fp=flag(k,c,p.v),pv=fmtV(k,p.v),when="지난 검사("+korDate(p.d)+")";
  var rel=p.v?(l.v-p.v)/Math.abs(p.v):0,up=l.v>p.v;
  var hi=function(f){return f==="H"||f==="B";};
  if(fp&&!fl)return when+" "+pv+"에서 "+rng(k)+" 안으로 돌아왔습니다.";
  if(Math.abs(rel)<0.06)return when+" "+pv+josa(pv,"과","와")+" 비슷하게 유지되고 있습니다.";
  if(fl&&((hi(fl)&&!up)||(fl==="L"&&up)))return when+" "+pv+"보다 좋아졌습니다. 아직 "+rng(k)+" 밖이라 관리를 이어 가겠습니다.";
  if(!fl&&!fp)return when+" "+pv+"에서 조금 "+(up?"올랐고":"내렸고")+" "+rng(k)+" 안에서 움직이고 있습니다.";
  return when+" "+pv+"보다 "+(up?"올랐습니다":"내려갔습니다")+". 다음 검사에서 다시 확인하겠습니다.";
}
function shortTrend(k,c){
  var o=latestOf(c,k),l=o.last,p=o.prev;if(!l)return "";var fl=flag(k,c,l.v);
  if(!p)return fl?(TH[k]?flagLabel(fl,k)+" 구간입니다":"범위보다 "+(fl==="H"?"높아":"낮아")+" 관리가 필요합니다"):rng(k)+" 안입니다";
  var fp=flag(k,c,p.v),rel=p.v?(l.v-p.v)/Math.abs(p.v):0,up=l.v>p.v;
  if(fp&&!fl)return rng(k)+" 안으로 돌아왔습니다";
  if(Math.abs(rel)<0.06)return "지난번과 비슷합니다";
  if(fl&&(((fl==="H"||fl==="B")&&!up)||(fl==="L"&&up)))return "지난번보다 좋아졌습니다";
  if(!fl)return rng(k)+" 안입니다";
  return "지난번보다 "+(up?"올랐습니다":"내려갔습니다")+". 다음에 다시 보겠습니다";
}
function nextSentence(c){

    '<h1 class="h-page">'+(isNew?'새 케이스':'케이스 고치기')+'</h1><p class="lede">저장을 눌러야 바뀝니다. 적은 내용은 안내문과 원고에 그대로 쓰입니다.</p>'+
    '<form class="form" id="fm" novalidate style="margin-top:12px">'+
    '<fieldset class="fs"><legend>환자</legend><div class="g3">'+fld("f-name","이름",c.name)+
      '<div class="f"><label for="f-species">종</label><select class="in" id="f-species">'+opt(["개","고양이"],c.species)+'</select></div>'+fld("f-breed","품종",c.breed)+
      fld("f-sex","성별",c.sex,"text","예: 중성화 암컷")+fld("f-age","나이",c.age,"text","예: 8세")+fld("f-weight","체중",c.weight,"text","예: 4.2kg")+'</div>'+
      '<div class="g2">'+fld("f-date","초진일",c.date,"date")+fld("f-owner","보호자","" +(c.owner||""),"text","","원고에는 들어가지 않습니다")+'</div></fieldset>'+
    '<fieldset class="fs"><legend>주호소 · 진단</legend>'+fld("f-complaint","주호소",c.complaint,"ta")+
      '<div class="g2">'+fld("f-dx","진단명",c.diagnosis)+'<div class="f"><label for="f-status">상태</label><select class="in" id="f-status">'+opt(["진행 중","종결"],c.status)+'</select></div></div>'+
      fld("f-explain","보호자용 설명",c.ownerExplain,"ta","보호자가 이해하기 쉬운 말로 두세 문장")+'</fieldset>'+
    '<fieldset class="fs"><legend>검사 수치</legend><p class="hint" style="margin-bottom:10px">한 줄에 항목 하나. 같은 날짜끼리 한 번의 검사로 묶입니다.</p><div id="labs">'+flat.map(labRow).join("")+'</div><button class="btn" type="button" id="addL">'+ic("plus")+'수치 추가</button></fieldset>'+
    '<fieldset class="fs"><legend>영상·기타 검사</legend><div id="finds">'+(c.finds||[]).map(findRow).join("")+'</div><button class="btn" type="button" id="addF">'+ic("plus")+'검사 추가</button></fieldset>'+
    '<fieldset class="fs"><legend>치료 경과</legend><div id="logs">'+(c.logs||[]).map(logRow).join("")+'</div><button class="btn" type="button" id="addG">'+ic("plus")+'경과 추가</button>'+
      '<div style="margin-top:16px">'+fld("f-outcome","결과 요약",c.outcome,"ta","","블로그 원고에 쓰입니다")+'</div></fieldset>'+
    '<fieldset class="fs"><legend>보호자 안내</legend>'+fld("f-home","집에서 할 일",c.homeCare,"ta","","한 줄에 하나씩")+fld("f-warn","바로 연락할 증상",c.warnSigns,"ta","","한 줄에 하나씩")+
      '<div class="g2">'+fld("f-next","다음 내원일",c.nextVisit,"date")+fld("f-nextnote","다음 내원 내용",c.nextVisitNote,"text","예: 혈액검사 재검")+'</div>'+fld("f-prep","내원 전 안내",c.prep,"text","예: 약은 평소대로 먹여 주세요")+'</fieldset>'+
    '<fieldset class="fs"><legend>콘텐츠용</legend>'+fld("f-hook","첫 문장",c.hook,"text","","블로그 제목과 영상 오프닝에 쓰입니다")+fld("f-point","원장의 한마디",c.point,"ta")+fld("f-tags","분류",(c.tags||[]).join(", "),"text","예: 신장, 블로그후보","쉼표로 나눠 적습니다")+'</fieldset>'+
    '<div class="savebar">'+(isNew?'':'<button class="btn danger" type="button" id="del" style="margin-right:auto">삭제</button>')+'<button class="btn" type="button" id="cancel">취소</button><button class="btn pri" type="submit">'+ic("check")+'저장</button></div>'+
    '</form>';
  var LB=document.getElementById("labs"),FD=document.getElementById("finds"),LG=document.getElementById("logs");
  document.getElementById("addL").onclick=function(){LB.insertAdjacentHTML("beforeend",labRow());LB.lastElementChild.querySelector("[data-k=v]").focus();};
  document.getElementById("addF").onclick=function(){FD.insertAdjacentHTML("beforeend",findRow());FD.lastElementChild.querySelector("[data-k=i]").focus();};
  document.getElementById("addG").onclick=function(){LG.insertAdjacentHTML("beforeend",logRow());LG.lastElementChild.querySelector("textarea").focus();};
  document.getElementById("fm").addEventListener("click",function(e){var d=e.target.closest("[data-del]");if(d)d.parentNode.remove();});
  document.getElementById("bk").onclick=goBack;document.getElementById("cancel").onclick=goBack;
  if(!isNew)document.getElementById("del").onclick=function(){if(!confirm("이 케이스를 삭제할까요? 되돌릴 수 없습니다."))return;db.cases=db.cases.filter(function(x){return x.id!==c.id;});save();toast("삭제했습니다");history.go(-2);};
  document.getElementById("fm").onsubmit=function(e){
    e.preventDefault();
    function v(id){return document.getElementById(id).value.trim();}
    function rows(box,keys){return Array.prototype.map.call(box.children,function(r){var o={};keys.forEach(function(k){o[k]=r.querySelector("[data-k="+k+"]").value.trim();});return o;});}
    var byD={};rows(LB,["d","k","v"]).forEach(function(r){if(r.v===""||isNaN(+r.v)||!r.d)return;(byD[r.d]=byD[r.d]||{})[r.k]=+r.v;});
    var n={id:c.id||uid(),name:v("f-name"),species:v("f-species"),breed:v("f-breed"),sex:v("f-sex"),age:v("f-age"),weight:v("f-weight"),date:v("f-date"),owner:v("f-owner"),
      complaint:v("f-complaint"),diagnosis:v("f-dx"),status:v("f-status"),ownerExplain:v("f-explain"),
      labs:Object.keys(byD).sort().map(function(d){return {d:d,v:byD[d]};}),
      finds:rows(FD,["d","c","i","r"]).filter(function(x){return x.i;}),
      logs:rows(LG,["d","t"]).filter(function(x){return x.t;}),
      outcome:v("f-outcome"),homeCare:document.getElementById("f-home").value,warnSigns:document.getElementById("f-warn").value,
      nextVisit:v("f-next"),nextVisitNote:v("f-nextnote"),prep:v("f-prep"),hook:v("f-hook"),point:v("f-point"),keys:c.keys||[],
      tags:v("f-tags").split(/[,，]/).map(function(x){return x.trim();}).filter(Boolean)};
    if(!n.name){toast("환자 이름을 적어 주세요");document.getElementById("f-name").focus();return;}
    if(isNew)db.cases.push(n);else db.cases=db.cases.map(function(x){return x.id===n.id?n:x;});
    save();toast("저장했습니다");
    if(isNew){cur={view:"case",id:n.id};history.replaceState({app:1,s:cur},"");lastBase="";render();}
    else{lastBase="";history.back();}
  };
}

render();
})();
</script>
</body>
</html>
