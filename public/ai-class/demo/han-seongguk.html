<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>케이스 노트 · 청담장튼튼내과동물병원</title>
<meta name="theme-color" content="#f3f0e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{
  --paper:#f3f0e8; --sheet:#fbfaf6; --ink:#1e2524; --ink-2:#4c5654; --ink-3:#7f8886;
  --rule:#dcd7cb; --rule-2:#e9e5db; --teal:#1f4f4b; --teal-wash:rgba(31,79,75,.08);
  --serif:"Nanum Myeongjo","AppleMyungjo",Georgia,serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --max:1080px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141817; --sheet:#1a1f1e; --ink:#e7ebe8; --ink-2:#b4bdba; --ink-3:#86908d;
  --rule:#2d3533; --rule-2:#252c2a; --teal:#86c2b9; --teal-wash:rgba(134,194,185,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141817; --sheet:#1a1f1e; --ink:#e7ebe8; --ink-2:#b4bdba; --ink-3:#86908d;
  --rule:#2d3533; --rule-2:#252c2a; --teal:#86c2b9; --teal-wash:rgba(134,194,185,.10); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:16px}
@media(min-width:720px){.wrap{padding-inline:28px}}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.35}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}

/* 머리 */
.top{border-bottom:1px solid var(--rule);background:var(--paper)}
.kicker{font-size:12px;color:var(--ink-3);padding-top:14px;letter-spacing:.01em}
.demo{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.demo b{font-weight:500;color:var(--teal)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:14px}
.brand h1{font-size:28px}
.brand span{font-size:13px;color:var(--ink-2)}
.tabs{display:flex;gap:22px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:8px 0 10px;font-size:14.5px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--teal)}

main{padding-block:22px 64px;min-height:60vh}
.foot{border-top:1px solid var(--rule);padding:18px 0 30px;font-size:12px;color:var(--ink-3)}

/* 공통 */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);padding:7px 14px;border-radius:3px;font-size:14px;line-height:1.4;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--sheet)}
.btn.ghost{background:none;border-color:transparent;padding-inline:4px;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:#9b3b2f}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.label{font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:2px}
.back{margin-bottom:14px}
.tag{display:inline-block;font-size:12px;color:var(--teal);background:var(--teal-wash);padding:1px 8px;border-radius:2px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:3px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}

/* 목록 */
.listhead{display:grid;gap:10px}
@media(min-width:720px){.listhead{grid-template-columns:1fr 220px auto;align-items:center}}
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);padding:9px 12px;border-radius:3px;font-size:15px}
.search:focus,.f input:focus,.f select:focus,.f textarea:focus,select:focus{outline:2px solid var(--teal-wash);border-color:var(--teal)}
select.sel{border:1px solid var(--rule);background:var(--sheet);padding:9px 10px;border-radius:3px;font-size:14px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--rule);background:none;border-radius:2px;padding:2px 10px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--sheet)}
.count{margin-top:18px;font-size:13px;color:var(--ink-3)}
.cases{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--rule)}
.cases li{border-bottom:1px solid var(--rule)}
.cases button{all:unset;display:grid;grid-template-columns:76px 1fr;gap:4px 16px;padding:14px 4px;width:100%;box-sizing:border-box;cursor:pointer}
.cases button:hover{background:var(--teal-wash)}
.cases button:focus-visible{outline:2px solid var(--teal)}
.cdate{font-size:12.5px;color:var(--ink-3);padding-top:3px;font-variant-numeric:tabular-nums}
.cdx{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.4}
.cmeta{font-size:13.5px;color:var(--ink-2)}
.cmeta .tag{margin-right:4px}
.cbody{grid-column:2}
@media(min-width:720px){.cases button{grid-template-columns:110px 1fr 1fr}.cbody{grid-column:3}}
.empty{padding:40px 0;color:var(--ink-3);text-align:center}

/* 상세 */
.dhead{display:grid;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.dhead h2{font-size:24px}
.pt{font-size:14px;color:var(--ink-2)}
.status{font-size:12px;color:var(--ink-3);border:1px solid var(--rule);padding:0 8px;border-radius:2px;margin-left:6px;vertical-align:2px;font-family:var(--sans);font-weight:400}
.gen{margin-top:4px}
.gen .label{display:block;margin-bottom:6px}
.dgrid{display:grid;gap:0}
@media(min-width:900px){.dgrid{grid-template-columns:1fr 1fr;column-gap:40px}}
.block{padding:20px 0;border-bottom:1px solid var(--rule-2)}
.block h3{font-size:15px;color:var(--teal);margin-bottom:8px}
.block.wide{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--rule);padding:6px 8px 6px 0}
.tbl td{border-bottom:1px solid var(--rule-2);padding:8px 8px 8px 0;vertical-align:top}
.tbl td.k{white-space:nowrap;color:var(--ink-3);font-size:12.5px}
@media(max-width:560px){
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:block;padding:10px 0;border-bottom:1px solid var(--rule-2)}
  .tbl.stack td{display:block;border:0;padding:1px 0}
  .tbl.stack td[data-h]::before{content:attr(data-h)" · ";color:var(--ink-3);font-size:12px}
}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:6px 0;border-left:0}
.tl time{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.pre{white-space:pre-line}

/* 편집 */
.f{display:grid;gap:4px;margin-bottom:12px}
.f label{font-size:12.5px;color:var(--ink-2)}
.f input,.f select,.f textarea{border:1px solid var(--rule);background:var(--sheet);padding:8px 10px;border-radius:3px;font-size:15px;width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical;line-height:1.6}
.grid2{display:grid;gap:0 14px;grid-template-columns:1fr 1fr}
.grid3{display:grid;gap:0 14px;grid-template-columns:1fr 1fr}
@media(min-width:720px){.grid3{grid-template-columns:2fr 1fr 1fr 1fr 1fr}}
fieldset{border:0;border-top:1px solid var(--rule);margin:8px 0 0;padding:18px 0 4px;min-width:0}
legend{font-family:var(--serif);font-weight:700;font-size:16px;padding-right:10px}
.hint{font-size:12.5px;color:var(--ink-3);margin:-4px 0 12px}
.erow{display:grid;gap:6px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.erow input,.erow select,.erow textarea{border:1px solid var(--rule);background:var(--sheet);padding:7px 9px;border-radius:3px;font-size:14.5px;width:100%;min-width:0}
.erow.test{grid-template-columns:1fr 1fr}
.erow.test .full{grid-column:1/-1}
@media(min-width:820px){.erow.test{grid-template-columns:110px 92px 1fr 1fr 1.4fr auto}.erow.test .full{grid-column:auto}}
.erow.log{grid-template-columns:1fr auto}
.erow.log textarea{grid-column:1/-1;min-height:56px}
@media(min-width:820px){.erow.log{grid-template-columns:150px 1fr auto}.erow.log textarea{grid-column:auto}}
.x{border:0;background:none;color:var(--ink-3);font-size:13px;padding:4px 6px;justify-self:end}
.x:hover{color:#9b3b2f}
.savebar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:12px 0;margin-top:20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* 문서 */
.doctabs{display:flex;gap:0;border:1px solid var(--rule);border-radius:3px;overflow:hidden;width:100%;max-width:520px}
.doctabs button{flex:1;border:0;background:var(--sheet);padding:8px 6px;font-size:13.5px;color:var(--ink-2);border-right:1px solid var(--rule)}
.doctabs button:last-child{border-right:0}
.doctabs button[aria-pressed="true"]{background:var(--teal);color:var(--sheet)}
.paper{background:var(--sheet);border:1px solid var(--rule);margin-top:16px;padding:28px 20px 34px;max-width:760px}
@media(min-width:720px){.paper{padding:44px 52px 52px}}
.paper h2{font-size:21px;margin-bottom:4px}
.paper h3{font-size:15px;color:var(--teal);margin:24px 0 6px}
.paper p,.paper li{font-size:15px;line-height:1.85}
.paper ul,.paper ol{margin:0;padding-left:20px}
.paper .sig{margin-top:28px;font-size:13.5px;color:var(--ink-2)}
.paper .note{margin-top:18px;padding:12px 14px;background:var(--teal-wash);font-size:13.5px;line-height:1.7}
.paper .titles li{font-family:var(--serif);font-size:16px;margin-bottom:4px}
.docbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* 검사 정리 */
.tests{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--rule)}
.tests>li{border-bottom:1px solid var(--rule)}
.tests .th{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 14px;width:100%;padding:12px 4px;cursor:pointer}
.tests .th:hover{background:var(--teal-wash)}
.tests .th:focus-visible{outline:2px solid var(--teal)}
.tname{font-weight:500}
.tcat{font-size:12px;color:var(--ink-3);margin-left:6px;font-weight:400}
.tbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3)}
.tbar svg{flex:1;max-width:260px;height:6px}
.tlast{font-size:13px;color:var(--ink-2);text-align:right}
.tdetail{padding:0 4px 14px}
.sum{display:flex;gap:28px;flex-wrap:wrap;margin-top:6px;font-size:13.5px;color:var(--ink-2)}
.sum b{display:block;font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:700}

/* 데이터 */
.dsec{padding:20px 0;border-bottom:1px solid var(--rule-2);max-width:640px}
.dsec h3{font-size:16px;margin-bottom:6px}
.dsec p{color:var(--ink-2);font-size:14.5px;margin-bottom:12px}

/* 인쇄 */
@media print{
  body{background:#fff;color:#000}
  .top,.foot,.back,.doctabs,.docbar,.noprint,.toast{display:none!important}
  main{padding:0}
  .paper{border:0;padding:0;max-width:none;background:#fff}
  .paper .note{background:#f2f2f2}
}
</style>
</head>

/* ---------- 저장 ---------- */
var db;
function load(){
  try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&Array.isArray(d.cases))return d;}}catch(e){}
  return sample();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast("이 브라우저에서는 저장이 막혀 있습니다");}}
db=load();
if(!db.contact)db.contact=CONTACT_DEFAULT;

/* ---------- 도구 ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function lines(s){return String(s||"").split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);}
function fmtDate(d){if(!d)return "";var p=d.split("-");if(p.length<3)return d;return p[0]+". "+(+p[1])+". "+(+p[2])+".";}
function korDate(d){if(!d)return "";var p=d.split("-");if(p.length<3)return d;return (+p[1])+"월 "+(+p[2])+"일";}
function byId(id){for(var i=0;i<db.cases.length;i++)if(db.cases[i].id===id)return db.cases[i];return null;}
function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function lastDate(c){var d=c.date||"";(c.logs||[]).forEach(function(l){if(l.date&&l.date>d)d=l.date;});(c.tests||[]).forEach(function(t){if(t.date&&t.date>d)d=t.date;});return d;}
var tt;function toast(m){var el=document.getElementById("toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){el.classList.remove("on");},2200);}
function copyText(t){
  function fb(){var a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(a);toast(ok?"복사했습니다":"복사가 막혀 있습니다. 직접 선택해 주세요");}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){toast("복사했습니다");},fb);}else fb();
}

/* ---------- 화면 이동 (뒤로가기로 앱이 닫히지 않게) ---------- */
var cur={view:"list"};
var ui={q:"",tag:"",dx:"",openTest:""};
function go(state){cur=state;history.pushState({app:1,s:state},"");render();}
function goBack(){history.back();}
window.addEventListener("popstate",function(e){
  var st=e.state||{};
  if(!st.app||st.base){
    var wasList=cur.view==="list";
    history.pushState({app:1,s:{view:"list"}},"");
    cur={view:"list"};render();
    if(wasList)toast("앱을 닫으려면 홈 화면으로 나가 주십시오");
    return;
  }
  cur=st.s||{view:"list"};render();
});
history.replaceState({app:1,base:1},"");
history.pushState({app:1,s:{view:"list"}},"");

document.querySelector(".tabs").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]");if(!b)return;
  var v=b.getAttribute("data-tab");if(cur.view===v)return;
  go({view:v});
});

var V=document.getElementById("view");
function render(){
  var tab=cur.view==="tests"?"tests":cur.view==="data"?"data":"list";
  document.querySelectorAll(".tabs button").forEach(function(b){if(b.getAttribute("data-tab")===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  if(cur.view==="case"&&!byId(cur.id))cur={view:"list"};
  if(cur.view==="doc"&&!byId(cur.id))cur={view:"list"};
  ({list:vList,case:vCase,edit:vEdit,doc:vDoc,tests:vTests,data:vData}[cur.view]||vList)();
  window.scrollTo(0,0);
}

/* ---------- 목록 ---------- */
function allTags(){var m={};db.cases.forEach(function(c){(c.tags||[]).forEach(function(t){m[t]=(m[t]||0)+1;});});return Object.keys(m).sort(function(a,b){return m[b]-m[a]||a.localeCompare(b,"ko");});}
function allDx(){var m={};db.cases.forEach(function(c){if(c.diagnosis)m[c.diagnosis]=1;});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,"ko");});}
function matches(c){
  if(ui.tag&&(c.tags||[]).indexOf(ui.tag)<0)return false;
  if(ui.dx&&c.diagnosis!==ui.dx)return false;
  var q=ui.q.trim().toLowerCase();if(!q)return true;
  var hay=[c.name,c.species,c.breed,c.diagnosis,c.complaint,(c.tags||[]).join(" "),(c.tests||[]).map(function(t){return t.item+" "+t.result;}).join(" ")].join(" ").toLowerCase();
  return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0;});
}
function vList(){
  var tags=allTags(),dxs=allDx();
  if(ui.dx&&dxs.indexOf(ui.dx)<0)ui.dx="";
  V.innerHTML=
    '<div class="listhead">'+
      '<input class="search" id="q" type="search" placeholder="환자 이름, 진단, 검사 항목으로 찾기" value="'+esc(ui.q)+'" aria-label="케이스 검색">'+
      '<select class="sel" id="dx" aria-label="진단명으로 거르기"><option value="">진단명 전체</option>'+dxs.map(function(d){return '<option'+(d===ui.dx?' selected':'')+'>'+esc(d)+'</option>';}).join("")+'</select>'+
      '<button class="btn pri" id="new" type="button">새 케이스</button>'+
    '</div>'+
    '<div class="chips" role="group" aria-label="태그">'+
      '<button class="chip" type="button" data-tag="" aria-pressed="'+(!ui.tag)+'">전체</button>'+
      tags.map(function(t){return '<button class="chip" type="button" data-tag="'+esc(t)+'" aria-pressed="'+(ui.tag===t)+'">'+esc(t)+'</button>';}).join("")+
    '</div>'+
    '<p class="count" id="cnt"></p><ul class="cases" id="cl"></ul>';
  var q=document.getElementById("q");
  q.addEventListener("input",function(){ui.q=q.value;drawList();});
  document.getElementById("dx").addEventListener("change",function(e){ui.dx=e.target.value;drawList();});
  V.querySelector(".chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;ui.tag=b.getAttribute("data-tag");V.querySelectorAll(".chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===b));});drawList();});
  document.getElementById("new").addEventListener("click",function(){go({view:"edit",id:null});});
  drawList();
}
function drawList(){
  var list=db.cases.filter(matches).sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});
  document.getElementById("cnt").textContent="케이스 "+list.length+"건"+(list.length!==db.cases.length?" (전체 "+db.cases.length+"건 중)":"");
  var ul=document.getElementById("cl");
  if(!list.length){ul.innerHTML='<li class="empty">조건에 맞는 케이스가 없습니다.</li>';return;}
  ul.innerHTML=list.map(function(c){
    return '<li><button type="button" data-id="'+esc(c.id)+'">'+
      '<span class="cdate">'+esc(fmtDate(c.date))+'</span>'+
      '<span><span class="cdx">'+esc(c.diagnosis||"진단 미정")+'</span><br><span class="cmeta">'+esc(c.name)+' · '+esc([c.species,c.breed,c.age].filter(Boolean).join(" · "))+'</span></span>'+
      '<span class="cbody cmeta">'+esc(c.complaint||"").slice(0,64)+(String(c.complaint||"").length>64?"…":"")+'<br>'+(c.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</span>'+
    '</button></li>';
  }).join("");
  ul.onclick=function(e){var b=e.target.closest("button[data-id]");if(b)go({view:"case",id:b.getAttribute("data-id")});};
}

// 마지막 글자의 받침: 0 없음, 8 ㄹ, 그 밖의 숫자 있음. 영문·숫자는 읽는 소리 기준(T4→사, CRP→피).
function jong(w){w=String(w||"").replace(/\([^)]*\)\s*$/,"").trim();if(!w)return 0;var c=w.charAt(w.length-1),ch=w.charCodeAt(w.length-1);
  if(ch>=0xAC00&&ch<=0xD7A3)return (ch-0xAC00)%28;var d={"0":21,"1":8,"3":16,"6":1,"7":8,"8":8};if(c in d)return d[c];if(/[0-9]/.test(c))return 0;
  var L={l:8,r:8,m:16,n:4};c=c.toLowerCase();return L[c]||0;}
function josa(w,a,b){return jong(w)?a:b;}
function ro(w){var j=jong(w);return (j===0||j===8)?"로":"으로";}
function nextSentence(c){
  var n=(c.nextVisitNote||"").trim();
  if(c.nextVisit)return korDate(c.nextVisit)+"에 "+(n?n+" 예정입니다.":"다시 뵙겠습니다.")+" 일정이 맞지 않으시면 미리 말씀해 주세요.";
  if(n)return /[.!?。]$/.test(n)?n:n+".";
  return "다음 일정은 따로 연락드리겠습니다.";
}

    '</div>'+
    '<div class="docbar"><button class="btn pri" type="button" id="cp">글 복사</button><button class="btn" type="button" id="pr">인쇄</button>'+
      (kind==="owner"?'<span class="muted small" style="align-self:center">카카오톡 채널에 붙여 넣기 좋은 줄글로 복사됩니다</span>':kind==="tests"?'<span class="muted small" style="align-self:center">엑셀에 붙여 넣으면 칸이 나뉩니다</span>':'')+'</div>'+
    '<article class="paper">'+d.html+'</article>';
  document.getElementById("bk").onclick=goBack;
  document.getElementById("cp").onclick=function(){copyText(d.text);};
  document.getElementById("pr").onclick=function(){window.print();};
  V.querySelector(".doctabs").onclick=function(e){var b=e.target.closest("button[data-k]");if(!b||b.getAttribute("data-k")===kind)return;
    cur={view:"doc",id:c.id,doc:b.getAttribute("data-k")};history.replaceState({app:1,s:cur},"");render();};
}

/* ---------- 검사 정리 ---------- */
function vTests(){
  var map={};
  db.cases.forEach(function(c){(c.tests||[]).forEach(function(t){
    var k=(t.item||"").trim();if(!k)return;var key=k.toLowerCase().replace(/\s+/g,"");
    var g=map[key]||(map[key]={item:k,cat:t.cat,rows:[],ids:{}});
    g.rows.push({c:c,t:t});g.ids[c.id]=1;
  });});
  var groups=Object.keys(map).map(function(k){var g=map[k];g.n=Object.keys(g.ids).length;g.rows.sort(function(a,b){return (b.t.date||b.c.date||"").localeCompare(a.t.date||a.c.date||"");});return g;})
    .sort(function(a,b){return b.n-a.n||a.item.localeCompare(b.item,"ko");});
  var total=db.cases.length,rowsN=groups.reduce(function(s,g){return s+g.rows.length;},0);
  var cats={혈액:0,영상:0,기타:0};groups.forEach(function(g){cats[g.cat]=(cats[g.cat]||0)+1;});
  V.innerHTML=
    '<h2 style="font-size:22px">검사 정리</h2>'+
    '<p class="muted small" style="margin-top:4px">모든 케이스의 검사를 항목별로 모았습니다. 항목을 누르면 케이스별 결과가 열립니다.</p>'+
    '<div class="sum"><span><b>'+groups.length+'</b>검사 항목</span><span><b>'+rowsN+'</b>검사 기록</span><span><b>'+total+'</b>케이스</span><span class="muted" style="align-self:flex-end">혈액 '+cats["혈액"]+' · 영상 '+cats["영상"]+' · 기타 '+cats["기타"]+' 항목</span></div>'+
    '<div class="row" style="margin-top:16px"><input class="search" id="tq" type="search" placeholder="검사 항목 찾기" value="" aria-label="검사 항목 찾기" style="max-width:360px"></div>'+
    '<ul class="tests" id="tl"></ul>';
  var ul=document.getElementById("tl");
  function draw(q){
    q=(q||"").trim().toLowerCase();
    var gs=groups.filter(function(g){return !q||g.item.toLowerCase().indexOf(q)>=0;});
    if(!gs.length){ul.innerHTML='<li class="empty">해당하는 검사 항목이 없습니다.</li>';return;}
    ul.innerHTML=gs.map(function(g){
      var last=g.rows[0],w=Math.max(4,Math.round(g.n/Math.max(1,total)*100)),open=ui.openTest===g.item;
      return '<li><button class="th" type="button" aria-expanded="'+open+'" data-i="'+esc(g.item)+'">'+
        '<span class="tname">'+esc(g.item)+'<span class="tcat">'+esc(g.cat)+'</span></span>'+
        '<span class="tlast">최근 '+esc(last.t.result)+' <span class="muted">· '+esc(fmtDate(last.t.date||last.c.date))+'</span></span>'+
        '<span class="tbar"><svg viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="6" fill="var(--rule-2)"/><rect width="'+w+'" height="6" fill="var(--teal)"/></svg>'+g.n+'케이스'+(g.rows.length>g.n?' · '+g.rows.length+'회':'')+'</span>'+
      '</button>'+
      (open?'<div class="tdetail"><table class="tbl stack"><thead><tr><th>날짜</th><th>환자 · 진단</th><th>결과</th><th>해석 메모</th></tr></thead><tbody>'+
        g.rows.map(function(r){return '<tr><td class="k" data-h="날짜">'+esc(fmtDate(r.t.date||r.c.date))+'</td><td data-h="환자"><a href="#" data-case="'+esc(r.c.id)+'">'+esc(r.c.name)+'</a> · '+esc(r.c.diagnosis)+'</td><td data-h="결과">'+esc(r.t.result)+'</td><td data-h="메모">'+esc(r.t.note)+'</td></tr>';}).join("")+
      '</tbody></table></div>':'')+'</li>';
    }).join("");
  }
  var tq=document.getElementById("tq");
  tq.addEventListener("input",function(){draw(tq.value);});
  ul.onclick=function(e){
    var a=e.target.closest("[data-case]");if(a){e.preventDefault();go({view:"case",id:a.getAttribute("data-case")});return;}
    var b=e.target.closest(".th");if(b){var i=b.getAttribute("data-i");ui.openTest=ui.openTest===i?"":i;draw(tq.value);}
  };
  draw("");
}

/* ---------- 데이터 ---------- */
function vData(){
  V.innerHTML=
    '<h2 style="font-size:22px">데이터</h2>'+
    '<div class="dsec"><h3>이 기기에만 저장됩니다</h3><p>케이스는 지금 쓰는 브라우저 안(localStorage)에만 저장됩니다. 다른 컴퓨터·휴대폰과 자동으로 공유되지 않고, 브라우저 기록을 지우면 함께 지워집니다. 직원끼리 함께 쓰는 버전은 교육 당일 병원 계정에 맞춰 연결합니다.</p>'+
      '<p class="muted small" style="margin:0">현재 케이스 '+db.cases.length+'건</p></div>'+
    '<div class="dsec"><h3>내보내기 · 가져오기</h3><p>JSON 파일로 백업해 두었다가 다른 기기에서 가져올 수 있습니다. 가져오면 지금 데이터는 파일 내용으로 바뀝니다.</p>'+
      '<div class="row"><button class="btn pri" type="button" id="ex">JSON 내보내기</button><button class="btn" type="button" id="im">JSON 가져오기</button><input type="file" id="file" accept="application/json,.json" hidden></div></div>'+
    '<div class="dsec"><h3>안내문 끝 연락 문구</h3><p>보호자 안내문 맨 아래에 들어갑니다.</p>'+
      '<div class="f"><label for="ct" class="label">연락 문구</label><textarea id="ct">'+esc(db.contact)+'</textarea></div><button class="btn" type="button" id="cts">문구 저장</button></div>'+
    '<div class="dsec"><h3>예시 데이터로 되돌리기</h3><p>지금 저장된 케이스를 지우고 처음의 예시 케이스 6건으로 돌아갑니다.</p><button class="btn danger" type="button" id="rs">예시로 되돌리기</button></div>';
  document.getElementById("ex").onclick=function(){
    var blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});var u=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=u;a.download="case-note-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);
    toast("파일로 내보냈습니다");
  };
  var f=document.getElementById("file");
  document.getElementById("im").onclick=function(){f.click();};
  f.onchange=function(){var file=f.files[0];if(!file)return;var r=new FileReader();r.onload=function(){
    try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.cases))throw 0;
      if(!confirm("케이스 "+d.cases.length+"건을 가져옵니다. 지금 데이터는 바뀝니다. 계속할까요?"))return;
      db={contact:d.contact||CONTACT_DEFAULT,cases:d.cases.map(function(c){c.id=c.id||uid();c.tests=c.tests||[];c.logs=c.logs||[];c.tags=c.tags||[];return c;})};
      save();ui={q:"",tag:"",dx:"",openTest:""};toast("가져왔습니다");vData();
    }catch(e){toast("케이스 노트 파일이 아닙니다");}
    f.value="";};r.readAsText(file);};
  document.getElementById("cts").onclick=function(){db.contact=document.getElementById("ct").value.trim()||CONTACT_DEFAULT;save();toast("저장했습니다");};
  document.getElementById("rs").onclick=function(){if(!confirm("예시 데이터로 되돌릴까요? 지금 케이스는 지워집니다."))return;db=sample();save();ui={q:"",tag:"",dx:"",openTest:""};toast("예시 데이터로 되돌렸습니다");vData();};
}

render();
})();
</script>
</body>
</html>
