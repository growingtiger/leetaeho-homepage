<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181614" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>논문 정리 · 박준석 원장님을 위한 시제품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* 서재 카드 목록. 논문 원제는 원문 그대로 세리프로, 우리말 정리는 고딕으로.
   갈색 먹은 '공유함'과 다음 저널클럽에만 쓴다. */
:root{
  --bg:#f5f2ec; --paper:#fffdf9; --wash:#ece7de;
  --ink:#1e1a16; --ink2:#48413a; --mute:#6c645a;
  --rule:#d7cfc2; --rule2:#e8e2d8;
  --acc:#7a3f22; --acc-soft:#f3e6dc;
  --warn:#962a1d;
  --serif:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;
  --latin:"Source Serif 4","Hahmlet",Georgia,serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#181614; --paper:#211e1b; --wash:#2b2723;
    --ink:#ece6dc; --ink2:#c8bfb2; --mute:#9e9588;
    --rule:#3d3832; --rule2:#2e2a26;
    --acc:#e2a27f; --acc-soft:#3a2a20;
    --warn:#ea8f7b;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.edu-note{background:var(--wash);color:var(--mute);font-size:13px;line-height:1.5;padding:8px 16px;text-align:center;border-bottom:1px solid var(--rule2)}
.top{max-width:1080px;margin:0 auto;padding:18px 16px 0}
.proto{font-size:13.5px;color:var(--mute);line-height:1.45}
.proto b{color:var(--ink2);font-weight:500}
.title{margin:8px 0 0;font-family:var(--serif);font-weight:700;font-size:27px;letter-spacing:-.02em;line-height:1.2}
.title small{display:block;font-family:var(--sans);font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:5px}
nav.tabs{display:flex;margin:14px -16px 0;padding:0 8px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:20}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:48px;padding:10px 12px;font-size:15.5px;color:var(--mute);white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
main{max-width:1080px;margin:0 auto;padding:6px 16px 56px;min-width:0}
@media (min-width:900px){.top{padding:28px 24px 0}.title{font-size:30px}nav.tabs{margin:18px 0 0;padding:0}main{padding:8px 24px 64px}}

.hd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;padding:18px 0 14px;border-bottom:2px solid var(--ink)}
.hd h1{margin:0;font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:-.015em;line-height:1.25}
.hd .per{display:block;font-family:var(--sans);font-size:14.5px;font-weight:400;color:var(--ink2);margin-top:4px;letter-spacing:0}
.hd .acts{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h2.sec{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.01em;margin:30px 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec .aside{font-family:var(--sans);font-size:13.5px;font-weight:400;color:var(--mute)}
p.cap{margin:0 0 8px;font-size:14.5px;color:var(--mute)}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 15px;border-radius:4px;border:1px solid var(--rule);background:var(--paper);font-size:15px;font-weight:500;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--wash)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.quiet{border-color:transparent;background:none;color:var(--ink2);padding-left:8px;padding-right:8px}
.btn.warn{color:var(--warn)}
.btn.sm{min-height:40px;padding:6px 11px;font-size:14px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.who select{min-height:42px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:6px 10px;font-size:15px}

/* 거르기 */
.filters{padding:16px 0 10px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.tagbar{display:flex;flex-wrap:wrap;gap:6px}
.tagbar button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;min-height:38px;padding:5px 13px;font-size:14.5px;color:var(--ink2)}
.tagbar button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.frow{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{background:var(--paper);border:0;min-height:42px;padding:8px 12px;font-size:14.5px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:500}
.frow input{flex:1;min-width:150px;min-height:42px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:8px 11px;font-size:16px}
.disc{font-size:14px;color:var(--mute);padding:10px 0 0;margin:0}

/* 논문 한 편 */
.pp{padding:18px 0;border-bottom:1px solid var(--rule2);display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.pp .tt{background:none;border:0;padding:0;text-align:left;font-family:var(--latin);font-weight:600;font-size:18px;line-height:1.38;letter-spacing:-.005em;word-break:normal;overflow-wrap:break-word}
.pp .tt:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.pp .meta{font-size:14px;color:var(--mute);line-height:1.5}
.pp .meta i{font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12.5px;line-height:20px;padding:0 7px;border:1px solid var(--rule);border-radius:3px;color:var(--ink2);background:var(--paper)}
.pp .sum{font-size:15.5px;line-height:1.65;color:var(--ink);margin:2px 0 0}
.pp .sum.none{color:var(--mute);font-size:14.5px}
.pp .memo{font-size:14.5px;color:var(--ink2);border-left:2px solid var(--rule);padding-left:10px}
.pp .memo b{font-weight:500;color:var(--mute);margin-right:6px}
.pp .bar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:4px}
.mark{min-height:40px;padding:6px 11px;border-radius:4px;font-size:14px;font-weight:500;border:1px solid var(--rule);background:var(--paper);color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.mark svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.mark[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.mark.sh[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.readers{font-size:13.5px;color:var(--mute)}
.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.links a{font-size:14px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:40px;display:inline-flex;align-items:center;padding:0 6px}
.empty{padding:22px 0;color:var(--mute);font-size:15.5px}
.next{margin:16px 0 0;padding:12px 14px;border:1px solid var(--rule);border-left:3px solid var(--acc);border-radius:4px;background:var(--paper);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:15px}
.next b{font-weight:700}
.next .s{color:var(--mute);font-size:14px}
.next button{margin-left:auto}

/* 저널클럽 */
.jc{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--rule2)}
.jc .d{font-family:var(--serif);font-weight:600;line-height:1.25}
.jc .d b{display:block;font-size:22px}
.jc .d span{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--mute)}
.jc .w{min-width:0}
.jc .w .t1{font-size:15.5px;font-weight:500}
.jc .w .pt{font-family:var(--latin);font-size:15px;line-height:1.4;color:var(--ink2);margin-top:2px;word-break:normal}
.jc .w .t2{font-size:13.5px;color:var(--mute);margin-top:2px}
.jc.past{opacity:.72}
@media (max-width:520px){.jc{grid-template-columns:64px minmax(0,1fr)}.jc .x{grid-column:2}.jc .d b{font-size:19px}}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:10px 0 4px}
.fd{min-width:0}
.fd.w2{grid-column:1/-1}
.fd label,.fd .lb{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:4px}
.fd input,.fd select,.fd textarea{width:100%;min-height:46px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:10px 11px;font-size:16px;line-height:1.4}
.fd textarea{min-height:88px;resize:vertical}
.fd input:focus,.fd select:focus,.fd textarea:focus{outline:none;border-color:var(--ink)}
.fd .hint{font-size:13px;color:var(--mute);margin-top:4px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:4px;padding:0 11px;min-height:42px;font-size:15px;background:var(--paper);cursor:pointer;margin:0;color:var(--ink)}
.checks input{width:18px;height:18px;min-height:0;margin:0;accent-color:var(--ink)}
.go{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.go .msg{font-size:14px;color:var(--warn)}
@media (min-width:760px){.form.jcf{grid-template-columns:150px 120px minmax(0,1fr) minmax(0,1fr)}.form.jcf .fd.paper{grid-column:1/-1}}

/* 상세 시트 */
.scrim{position:fixed;inset:0;background:rgba(20,17,14,.42);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--paper);border-top:2px solid var(--ink);padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0;font-family:var(--serif);font-weight:600;font-size:20px}
.sheet .sub{font-size:14px;color:var(--mute);margin-top:2px}
.sheet .bar2{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.sheet .ai{font-size:13.5px;color:var(--mute);margin:6px 0 0}
@media (min-width:760px){.sheet{left:50%;top:50%;bottom:auto;right:auto;transform:translate(-50%,-50%);width:680px;border:1px solid var(--rule);border-top:2px solid var(--ink);border-radius:4px;padding:22px 24px}}

.chipset{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
.chipset span{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:4px;padding:0 0 0 10px;min-height:42px;font-size:15px;background:var(--paper)}
.chipset span button{border:0;background:none;min-width:40px;min-height:40px;color:var(--mute);font-size:18px}
.addline{display:flex;gap:8px;flex-wrap:wrap}
.addline input{flex:1;min-width:150px;min-height:44px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:8px 11px;font-size:16px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:15px;padding:11px 16px;border-radius:4px;width:max-content;max-width:calc(100vw - 32px);text-align:center}
footer.site{max-width:1080px;margin:0 auto;padding:0 16px 32px;color:var(--mute);font-size:13.5px;line-height:1.6}
@media (min-width:900px){footer.site{padding:0 24px 32px}}
@media print{
  .edu-note,nav.tabs,.filters,.pp .bar,.hd .acts,footer.site,.toast,.scrim,.sheet,.next button{display:none!important}
  body{background:#fff;font-size:10.5pt}
  .pp{break-inside:avoid}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="edu-note">교육용 예시 화면입니다. 진료 판단에 쓰는 프로그램이 아니며, 판매하지 않습니다.</div>
<header class="top">
  <div class="proto">24시범어동물의료센터 · <b>박준석 원장님</b>을 위한 시제품 · 수의사 이름과 저널클럽 일정은 예시입니다</div>
  <div class="title">최신 논문 정리<small>읽은 논문을 한곳에 모으고 원내 저널클럽까지 잇습니다</small></div>
  <nav class="tabs" id="tabs" aria-label="화면"></nav>
</header>
<main id="main"></main>
<footer class="site">원장을 위한 AI 실전 교육 시제품입니다. 교육 당일 원장님 병원에 맞게 함께 고칩니다. 목록의 논문은 PubMed에 실린 실제 논문이며, 수의사 이름·읽음 표시·저널클럽 일정은 지어낸 것입니다. 기록은 이 기기에만 저장됩니다.</footer>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
var KEY="pjs-papers-v1";
var $=function(s,r){return (r||document).querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d);}
var WD=["일","월","화","수","목","금","토"];
function mdw(s){var d=pd(s);return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[d.getDay()]+")";}
var TODAY=ymd(new Date());
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function nextWd(from,wd,k){var d=pd(from);var diff=(wd-d.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff+7*(k||0));return ymd(d);}

/* ───────── 논문 (PubMed에서 확인한 실제 서지 정보) ─────────
   한 줄 요약은 각 논문 초록에 있는 내용과 숫자만 옮겼다. 임상 메모는 비워 둔다. */
var PAPERS=[
 {pmid:"43004816",doi:"10.1111/vec.70177",year:2026,j:"J Vet Emerg Crit Care (San Antonio)",au:"Kim D, et al.",tags:["응급·중환자"],
  t:"Retrospective Evaluation of the Quick Sequential Organ Failure Assessment (qSOFA) Score as a Prognostic Indicator in Dogs With Systemic Inflammatory Response Syndrome (2017-2023): 112 Cases.",
  s:"SIRS 기준을 충족한 개 112마리 중 65마리(60%)가 입원 중 폐사했습니다. qSOFA 2점 이상은 단변량 분석에서 사망과 연관됐으나 다변량 분석에서는 독립 예측 인자로 남지 않았습니다(OR 2.24, 95% CI 0.71–7.06). AUC는 0.73, 민감도 72%, 특이도 75%였습니다."},
 {pmid:"42836558",doi:"10.1111/vec.70168",year:2026,j:"J Vet Emerg Crit Care (San Antonio)",au:"McNally AE, Llewellyn E.",tags:["응급·중환자"],
  t:"Sodium Administration and the Contribution of Fluid Creep to the Sodium Burden of Hospitalized Dogs in the ICU.",
  s:"ICU 입원 개 29마리에게 들어간 수액과 나트륨을 출처별로 모두 기록한 전향 관찰 연구입니다. 1일째 평균 수액량은 64.6 mL/kg/day, 나트륨은 8 mEq/kg/day였고, 약물·희석액·플러시로 들어간 수액(fluid creep)은 1일째 중앙값 5.6 mL/kg/day로 작지만 일정한 나트륨 공급원이었습니다."},
 {pmid:"42878630",doi:"10.1111/vec.70173",year:2026,j:"J Vet Emerg Crit Care (San Antonio)",au:"Murphy LA, et al.",tags:["응급·중환자","내과"],
  t:"Clinical Presentation, Acute Clinical Response, Drug Tolerability, and Short-Term Outcome of Cats Treated for Acute Congestive Heart Failure With Pimobendan (2017-2022): 71 Cases.",
  s:"급성 울혈성 심부전으로 피모벤단과 푸로세미드 치료를 받은 고양이 71마리의 단일 기관 후향 연구입니다. 퇴원 생존율은 76%였고 생존 퇴원한 고양이의 75%가 3일 이내에 퇴원했습니다. 도부타민을 함께 쓴 15마리 중 7마리(47%)에서 부작용이 의심됐습니다."},
 {pmid:"43042570",doi:"10.1111/vec.70187",year:2026,j:"J Vet Emerg Crit Care (San Antonio)",au:"Parlak K, et al.",tags:["응급·중환자"],
  t:"Retrospective Evaluation of the Prognostic Value of Neutrophil-to-Lymphocyte Ratio and Platelet-to-Lymphocyte Ratio in Cats With Trauma and Their Relationship With the Animal Trauma Triage Score: 60 Cats (2024-2025).",
  s:"외상 고양이 60마리에서 비생존군의 PLR과 ATT 점수가 생존군보다 높았고, NLR과 젖산 농도는 생존 여부에 따라 차이가 없었습니다. 사망 예측 AUC는 PLR 0.701, NLR 0.435였습니다."},
 {pmid:"42979989",doi:"10.1093/jvimsj/aalag276",year:2026,j:"J Vet Intern Med",au:"Fletcher JR, et al.",tags:["내과"],
  t:"Survival time and prognostic factors in cats with suspected acute pyelonephritis.",
  s:"급성 신우신염이 의심된 고양이 54마리의 중앙 생존 기간은 390일(95% CI 153–774일)이었습니다. 입원부터 퇴원 또는 안락사까지 혈청 크레아티닌이 50% 넘게 줄지 않았거나 오히려 오른 고양이에서, IRIS AKI 등급과 내원 시 체온으로 보정한 뒤에도 사망 위험이 유의하게 높았습니다."},

function readPaper(f){
  var g=function(n){return f.elements[n];};
  var o={title:g("title").value.trim(),au:g("au").value.trim(),journal:g("journal").value.trim(),year:parseInt(g("year").value,10)||"",doi:g("doi").value.trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i,""),pmid:g("pmid").value.trim(),
    tags:Array.prototype.filter.call(f.querySelectorAll('input[name=tag]'),function(x){return x.checked;}).map(function(x){return x.value;}),sum:g("sum").value.trim(),memo:g("memo").value.trim()};
  if(!o.title)return {err:"제목을 넣어 주십시오."};
  if(o.doi&&!/^10\.\d{4,9}\/\S+$/.test(o.doi))return {err:"DOI는 10.으로 시작하는 형식으로 넣어 주십시오."};
  if(o.pmid&&!/^\d{1,9}$/.test(o.pmid))return {err:"PMID는 숫자만 넣어 주십시오."};
  return {p:o};
}

  '<h2 class="sec">진료과 태그<span class="aside">'+db.tags.length+'개</span></h2>'+
  '<div class="chipset">'+db.tags.map(function(t,i){return '<span>'+esc(t)+'<button type="button" data-deltag="'+i+'" aria-label="'+esc(t)+' 빼기">×</button></span>';}).join("")+'</div>'+
  '<div class="addline"><input id="newTag" placeholder="진료과 이름" aria-label="추가할 진료과"><button class="btn" type="button" data-act="add-tag">추가</button></div>'+
  '<h2 class="sec">수의사<span class="aside">'+db.vets.length+'명</span></h2>'+
  '<div class="chipset">'+db.vets.map(function(v,i){return '<span>'+esc(v)+'<button type="button" data-delvet="'+i+'" aria-label="'+esc(v)+' 빼기">×</button></span>';}).join("")+'</div>'+
  '<div class="addline"><input id="newVet" placeholder="이름" aria-label="추가할 수의사 이름"><button class="btn" type="button" data-act="add-vet">추가</button></div>'+
  '<h2 class="sec">예시 데이터</h2><p class="cap">기록은 이 기기의 브라우저에만 저장됩니다. 처음 상태로 돌리면 추가한 논문과 메모가 지워집니다.</p>'+
  '<button class="btn warn" type="button" data-act="reset">예시 데이터로 되돌리기</button>';
}

/* ───────── CSV ───────── */
function csvCell(v){v=String(v==null?"":v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function csv(){
  var R=[["제목","저자","저널","연도","DOI","PMID","진료과","한 줄 요약","임상 메모","읽은 사람","공유"]];
  db.papers.forEach(function(p){R.push([p.title,p.au,p.journal,p.year,p.doi,p.pmid,p.tags.join(" / "),p.sum,p.memo,p.readBy.join(" / "),p.shared?"공유함":""]);});
  var txt="﻿"+R.map(function(r){return r.map(csvCell).join(",");}).join("\r\n");
  var url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  var a=document.createElement("a");a.href=url;a.download="논문정리_"+TODAY+".csv";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},800);toast("논문정리_"+TODAY+".csv 파일을 내려받았습니다");
}

/* ───────── 이벤트 ───────── */
var tt;
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},2600);}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var v;
  if((v=b.getAttribute("data-tab"))){if(v!==cur.tab)push({tab:v});return;}
  if((v=b.getAttribute("data-tagf"))!=null){ui.tag=v;rerender();return;}
  if((v=b.getAttribute("data-st"))){ui.st=v;rerender();return;}
  if((v=b.getAttribute("data-open"))){push({tab:"list",sheet:v});return;}
  if((v=b.getAttribute("data-read"))){var p=paper(v);if(p){var i=p.readBy.indexOf(db.me);if(i>=0)p.readBy.splice(i,1);else p.readBy.push(db.me);save();rerender();toast(i>=0?"읽음 표시를 지웠습니다":db.me+" 선생님 읽음으로 표시했습니다");}return;}
  if((v=b.getAttribute("data-share"))){var s=paper(v);if(s){s.shared=!s.shared;s.sharedAt=s.shared?TODAY:"";save();rerender();toast(s.shared?"원내 공유로 표시했습니다. 시제품이라 실제로 보내지지는 않습니다":"공유 표시를 지웠습니다");}return;}
  if((v=b.getAttribute("data-delclub"))){if(confirm("이 저널클럽 일정을 지울까요?")){db.club=db.club.filter(function(c){return c.id!==v;});save();rerender();toast("일정을 지웠습니다");}return;}
  if((v=b.getAttribute("data-deltag"))!=null){db.tags.splice(+v,1);save();rerender();return;}
  if((v=b.getAttribute("data-delvet"))!=null){var nm=db.vets[+v];if(db.vets.length<2){toast("한 명은 남겨 두어야 합니다");return;}if(confirm(nm+" 선생님을 목록에서 뺄까요? 읽음 기록은 그대로 둡니다.")){db.vets.splice(+v,1);if(db.me===nm)db.me=db.vets[0];save();rerender();}return;}
  switch(b.getAttribute("data-act")){
    case "new":push({tab:"list",sheet:"new"});var f=$("#f-title");if(f)f.focus();break;
    case "close":history.back();break;
    case "save-paper":
      var form=$("#pForm"),res=readPaper(form);if(res.err){$("#pMsg").textContent=res.err;break;}
      var id=form.getAttribute("data-id");
      if(id==="new"){var np=Object.assign({id:"p"+uid(),readBy:[],shared:false,sharedAt:"",addedBy:db.me,added:TODAY},res.p);db.papers.push(np);}
      else Object.assign(paper(id),res.p);
      save();history.back();toast(id==="new"?"논문을 추가했습니다":"저장했습니다");break;
    case "del-paper":
      var did=$("#pForm").getAttribute("data-id");if(confirm("이 논문을 목록에서 지울까요? 요약과 메모도 함께 지워집니다.")){db.papers=db.papers.filter(function(p){return p.id!==did;});db.club.forEach(function(c){if(c.paper===did)c.paper="";});save();history.back();toast("지웠습니다");}break;
    case "to-club":var cid=$("#pForm").getAttribute("data-id");history.replaceState({app:1,tab:"club",club:cid},"");apply(history.state);var cp=$("#c-date");if(cp)cp.focus();toast("날짜와 발표자를 고르고 일정 추가를 눌러 주십시오");break;
    case "csv":csv();break;
    case "print":window.print();break;
    case "add-tag":var nt=$("#newTag").value.trim();if(!nt){$("#newTag").focus();break;}if(db.tags.indexOf(nt)<0)db.tags.push(nt);save();rerender();break;
    case "add-vet":var nv=$("#newVet").value.trim();if(!nv){$("#newVet").focus();break;}if(db.vets.indexOf(nv)<0)db.vets.push(nv);save();rerender();break;
    case "reset":if(confirm("이 기기에 저장된 기록을 모두 지우고 예시 데이터로 되돌릴까요?")){db=seed();save();ui={tag:"",st:"all",q:""};rerender();toast("예시 데이터로 되돌렸습니다");}break;
  }
});
$("#scrim").addEventListener("click",function(){if(cur.sheet)history.back();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur.sheet)history.back();});
document.addEventListener("change",function(e){if(e.target.id==="me"){db.me=e.target.value;save();rerender();}});
document.addEventListener("input",function(e){if(e.target.id==="q"){ui.q=e.target.value;var pos=e.target.selectionStart;rerender();var s=$("#q");s.focus();try{s.setSelectionRange(pos,pos);}catch(_){}}});
document.addEventListener("submit",function(e){
  var f=e.target;e.preventDefault();
  if(f.id==="cForm"){
    var d=f.elements.date.value,t=f.elements.time.value;
    if(!d){$("#cMsg").textContent="날짜를 넣어 주십시오.";return;}
    db.club.push({id:uid(),date:d,time:t||"08:00",who:f.elements.who.value,paper:f.elements.paper.value,place:f.elements.place.value.trim(),note:""});
    save();history.replaceState({app:1,tab:"club"},"");apply(history.state);toast(mdw(d)+" 저널클럽 일정을 추가했습니다");
  }
});

/* ───────── 시작 ───────── */
window.addEventListener("pagehide",save);
load();
history.replaceState({app:1,base:1},"");
var start=homeState();history.pushState(start,"");apply(start);
})();
</script>
