<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>치과 차트 · 박병민 원장님을 위한 시제품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 치과 차트지: 흰 종이, 짙은 남색 잉크, 붉은색은 소견에만.
   모서리 규칙: 버튼·입력칸 8px, 시트 상단 14px, 칩 999px. */
:root{
  --bg:#fbfcfd; --paper:#ffffff;
  --ink:#0f2747; --ink-2:#3a4e6d; --ink-3:#5f6f88;
  --hair:#d6dde7; --hair-2:#e9eef4; --wash:#f1f4f8; --gum:#eef1f5;
  --red:#b42318; --s1:#fdeceb; --s2:#f6c5be; --s3:#e88b7e;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --bar:58px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.oo,.legend code.oo{font-family:var(--sans);font-weight:inherit}

/* 맨 윗줄 */
.topline{display:flex;justify-content:space-between;gap:12px;max-width:1240px;margin:0 auto;padding:7px 16px 6px;font-size:13px;color:var(--ink-3);line-height:1.4}
.topline .demo{white-space:nowrap}

/* 앱 바 */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--hair);-webkit-backdrop-filter:saturate(1.4) blur(8px);backdrop-filter:saturate(1.4) blur(8px)}
.appbar .in{max-width:1240px;margin:0 auto;height:var(--bar);display:flex;align-items:center;gap:6px;padding:0 8px 0 16px}
.appbar.has-back .in{padding-left:4px}
.appbar .ttl{flex:1;min-width:0;line-height:1.25}
.appbar .ttl small{display:block;font-size:12.5px;color:var(--ink-3);letter-spacing:.01em}
.appbar .ttl b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{min-width:44px;height:44px;border:0;background:none;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font-size:15px;color:var(--ink)}
.icon-btn:hover{background:var(--wash)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.text{font-weight:500}

/* 버튼 */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:8px;border:1px solid var(--hair);background:var(--paper);color:var(--ink);font-size:15.5px;font-weight:500;line-height:1.25;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--wash)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#1b3a63}
.btn.danger{color:var(--red)}
.btn.small{min-height:44px;padding:8px 12px;font-size:15px}
.btn:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.frow:focus-visible,.prow:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

main{max-width:1240px;margin:0 auto;padding:0 16px 40px}

/* 차트 화면 */
.pt-head{padding:18px 0 4px}
.pt-head h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.pt-head h1 .sp{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:8px;vertical-align:3px;border:1px solid var(--hair);border-radius:999px;padding:1px 9px}
.pt-head .meta{margin:6px 0 0;font-size:15px;color:var(--ink-2)}
.visits{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0 6px}
.visits .lb{font-size:14px;color:var(--ink-3);margin-right:2px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--hair);background:var(--paper);font-family:var(--mono);font-size:15px;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px;color:var(--ink-2);padding:2px 0 10px}
.stats b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.stats b.r{color:var(--red)}

.diagram{position:relative;background:var(--paper);border:1px solid var(--hair);border-radius:8px;padding:6px 2px 4px;touch-action:manipulation}
.diagram svg{display:block;width:100%;height:auto;margin:0 auto;-webkit-user-select:none;user-select:none}
.diagram .hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:14px;color:var(--ink-3);pointer-events:none;line-height:1.45}
.tooth{cursor:pointer}
.tooth:focus{outline:none}
.tooth:focus-visible .shape{stroke:#0f2747;stroke-width:2.6}

.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;padding:12px 2px 4px;margin:0;list-style:none;font-size:14.5px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:8px;min-width:0;line-height:1.35}
.legend svg{flex:none;width:30px;height:22px}
.legend .wide{grid-column:1/-1;display:block;color:var(--ink-3);font-size:14px}
.legend code{font-family:var(--mono);font-size:14px;color:var(--ink)}

.side h2,.blk h2{display:flex;align-items:baseline;gap:8px;font-size:18px;font-weight:600;margin:28px 0 8px}
.side h2 .n,.blk h2 .n{font-family:var(--mono);font-size:15px;color:var(--ink-3);font-weight:500}
.side h2 .aside,.blk h2 .aside{margin-left:auto;font-size:14px;color:var(--ink-3);font-weight:400}
.cta{display:none;gap:10px;padding-top:18px}
.cta .btn{flex:1}

.flist{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.frow{display:grid;grid-template-columns:58px minmax(0,1fr) 20px;align-items:center;gap:2px 12px;width:100%;min-height:60px;padding:10px 2px;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair-2)}
.frow:hover{background:var(--wash)}
.frow .no{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.01em}
.frow .no i{display:block;font-style:normal;font-size:12.5px;font-weight:400;color:var(--ink-3);letter-spacing:.02em;margin-top:1px}
.frow .tx{min-width:0}
.frow .nm{display:block;font-size:15.5px;line-height:1.35}
.frow .cd{display:block;font-family:var(--mono);font-size:14.5px;color:var(--ink-2);margin-top:2px}
.frow .cd b{color:var(--red);font-weight:600}
.frow .note{display:block;font-size:14px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.frow .chev{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:1.8}
.sevbar{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px;border:1px solid var(--ink-3)}
.empty{padding:18px 2px;color:var(--ink-3);font-size:15.5px}

details.box{border-top:1px solid var(--hair);margin-top:26px}
details.box+details.box{margin-top:0}
details.box summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:56px;cursor:pointer;font-size:17px;font-weight:600}
details.box summary::-webkit-details-marker{display:none}
details.box summary .aside{margin-left:auto;font-size:14px;font-weight:400;color:var(--ink-3)}
details.box summary svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:1.8;transition:transform .2s}
details.box[open] summary svg{transform:rotate(180deg)}
details.box .body{padding:0 0 18px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 12px}
.fd{min-width:0}
.fd.wide{grid-column:1/-1}
.fd label,.fd .lb{display:block;font-size:14px;color:var(--ink-2);margin-bottom:4px}
.fd input,.fd select,textarea{width:100%;min-height:46px;border:1px solid var(--hair);border-radius:8px;background:var(--paper);padding:10px 12px;font-size:16px;line-height:1.4}
.fd input:focus,.fd select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,39,71,.10)}
textarea{resize:vertical;line-height:1.6}
.checks{display:flex;flex-wrap:wrap;gap:4px 18px;margin:4px 0 12px}
.checks label{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15.5px}
.checks input{width:20px;height:20px;accent-color:var(--ink)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:15px;color:var(--ink-2)}
.bulk .lb{width:100%}

.store{margin-top:30px;padding:18px 0 0;border-top:1px solid var(--hair);font-size:15px;color:var(--ink-2)}
.store p{margin:0 0 12px}
.store .row-btns{margin-top:0}

/* 아래 고정 버튼 (휴대폰) */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.97);border-top:1px solid var(--hair);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
.actionbar .btn{flex:1;min-height:50px;font-size:16px}
body.has-action main{padding-bottom:110px}

/* 데스크톱: 도식과 소견을 나란히 */
@media (min-width:960px){
  .chart-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"chart ph" "chart side";grid-template-rows:auto 1fr;gap:0 44px;align-items:start}
  .chart-layout>.ph{grid-area:ph}
  .chart-layout>.side{grid-area:side;padding-top:0}
  .chart-col{grid-area:chart;position:sticky;top:calc(var(--bar) + 12px);padding-top:16px}
  .chart-col .diagram svg{width:auto;max-width:100%;height:calc(100dvh - var(--bar) - 190px);min-height:440px}
  .chart-col .legend{grid-template-columns:repeat(3,minmax(0,1fr))}
  .side>h2:first-of-type{margin-top:22px}
  .cta{display:flex}
  .actionbar{display:none}
  body.has-action main{padding-bottom:40px}
  .pt-head{padding-top:20px}
}

/* 치아 소견 시트 */
.scrim{position:fixed;inset:0;background:rgba(15,39,71,.32);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:86dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--paper);border-radius:14px 14px 0 0;box-shadow:0 -10px 32px rgba(15,39,71,.16);padding:0 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--hair);margin:8px auto 0}
@media (min-width:760px){
  .sheet{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:0;box-shadow:-10px 0 32px rgba(15,39,71,.14);padding-bottom:24px}
  .sheet .grab{display:none}
}
.st-head{position:sticky;top:0;z-index:1;background:var(--paper);display:flex;align-items:center;gap:4px;padding:8px 0 10px;border-bottom:1px solid var(--hair)}
.st-head .id{flex:1;min-width:0;text-align:center}
.st-head .no{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.05}
.st-head .nm{font-size:14.5px;color:var(--ink-2);line-height:1.35}
.grp{padding:16px 0 2px}
.grp .gl{display:flex;align-items:baseline;gap:8px;font-size:15.5px;font-weight:600;margin-bottom:8px}
.grp .gl .src{margin-left:auto;font-size:13px;font-weight:400;color:var(--ink-3);font-family:var(--mono)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:44px;min-width:52px;padding:8px 12px;border:1px solid var(--hair);border-radius:8px;background:var(--paper);font-family:var(--mono);font-size:15px;color:var(--ink)}
.seg button.kr{font-family:var(--sans)}
.seg button.on{border-color:var(--red);background:var(--s1);color:var(--red);font-weight:600;box-shadow:inset 0 0 0 1px var(--red)}
.seg button.none.on{border-color:var(--ink);background:var(--wash);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.def{font-size:14.5px;color:var(--ink-2);margin-top:8px;line-height:1.5}
.def b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.st-foot{display:flex;gap:10px;padding-top:20px}
.st-foot .btn{flex:1}

/* 기록문 */
.out-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 40px}
@media (min-width:960px){.out-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.blk h2{margin-top:24px}
.blk .lead{margin:-2px 0 10px;font-size:15px;color:var(--ink-2)}
.blk textarea{font-size:16px;line-height:1.7;padding:14px 16px;min-height:300px}
.blk textarea.rec{font-size:15.5px;line-height:1.7;background:var(--wash);border-color:var(--hair-2)}
.blk .row-btns{margin-top:10px}
.blk .row-btns .btn{flex:1}
@media (min-width:960px){.blk .row-btns .btn{flex:0 0 auto}}
.mini-chart{display:none}
.rep-chart{display:none}
@media (min-width:960px){.rep-chart{display:block;margin-top:28px}.rep-chart svg{max-height:620px;width:auto;max-width:100%}}

/* 방문 비교 */
.cmp-head{padding:18px 0 6px}
.cmp-head h1{margin:0;font-size:22px;font-weight:600;line-height:1.3}
.cmp-head p{margin:6px 0 0;color:var(--ink-2);font-size:15.5px}
.cmp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:10px}
.cmp-grid[data-show="a"] .fb,.cmp-grid[data-show="b"] .fa{display:none}
.cmp-grid figcaption{display:none!important}
.cmp-tog{display:flex;gap:8px;margin-top:12px}
.cmp-tog .chip{flex:1;padding:8px 6px;font-size:14.5px}
@media (min-width:760px){.cmp-tog{display:none}.cmp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cmp-grid .fa,.cmp-grid .fb{display:block!important}.cmp-grid figcaption{display:flex!important}}
.cmp-grid figure{margin:0;min-width:0}
.cmp-grid figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:14.5px;padding:0 2px 6px;color:var(--ink-2)}
.cmp-grid figcaption b{font-family:var(--mono);font-weight:600;color:var(--ink);font-size:15px}
.cmp-grid .diagram{padding:4px 0 2px}
@media (min-width:960px){.cmp-grid{gap:28px}.cmp-grid .diagram svg{max-height:calc(100dvh - 260px);width:auto;max-width:100%}}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px;padding:0;list-style:none}
.tally li{border:1px solid var(--hair);border-radius:8px;padding:8px 12px;font-size:15px;background:var(--paper)}
.tally b{font-family:var(--mono);font-size:18px;margin-right:4px}
.clist{list-style:none;margin:0;padding:0}
.clist h3{font-size:16px;margin:22px 0 6px;font-weight:600}
.crow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 12px;padding:10px 2px;border-bottom:1px solid var(--hair-2)}
.crow .no{font-family:var(--mono);font-weight:600;font-size:17px}
.crow .ch{font-family:var(--mono);font-size:14.5px}
.crow .ch .arr{color:var(--ink-3);padding:0 4px}
.crow .ch b{color:var(--red);font-weight:600}
.crow .nm{font-size:14.5px;color:var(--ink-2)}
@media (min-width:960px){.cmp-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0 40px;align-items:start}}

/* 환자 목록 */
.list-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:18px 0 10px}
.list-top h1{margin:0 auto 0 0;font-size:22px;font-weight:600}
.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.prow{display:grid;grid-template-columns:64px minmax(0,1fr) 20px;gap:14px;align-items:center;width:100%;padding:14px 2px;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair-2)}
.prow:hover{background:var(--wash)}
.prow .th{width:64px;height:100px;border:1px solid var(--hair-2);border-radius:8px;background:var(--paper);padding:3px}
.prow .th svg{width:100%;height:100%;display:block}
.prow .nm{font-size:18px;font-weight:600;line-height:1.3}
.prow .nm span{font-size:14px;font-weight:500;color:var(--ink-2);border:1px solid var(--hair);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}
.prow .mt{font-size:15px;color:var(--ink-2);line-height:1.45;margin-top:2px}
.prow .sm{font-size:14.5px;color:var(--ink-2);margin-top:4px;font-family:var(--mono)}
.prow .sm b{color:var(--red);font-weight:600}
.prow .chev{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:1.8}
@media (min-width:960px){.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px;border-top:0}.prow{border-top:1px solid var(--hair-2);border-bottom:0}}

.foot{max-width:1240px;margin:0 auto;padding:18px 16px 34px;border-top:1px solid var(--hair-2);font-size:13.5px;color:var(--ink-3);line-height:1.6}
body.has-action .foot{padding-bottom:110px}
@media (min-width:960px){body.has-action .foot{padding-bottom:34px}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(15,39,71,.22)}

@media (prefers-reduced-motion:no-preference){
  .sheet:not([hidden]){animation:up .22s cubic-bezier(.16,1,.3,1)}
  @media (min-width:760px){.sheet:not([hidden]){animation:inr .22s cubic-bezier(.16,1,.3,1)}}
  .scrim:not([hidden]){animation:fade .2s ease}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes inr{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}

@page{size:A4;margin:12mm}
@media print{
  body{background:#fff;font-size:12px}
  .topline,.appbar,.actionbar,.toast,.scrim,.sheet,.foot,.noprint,.row-btns,.rep-chart{display:none!important}
  main{padding:0;max-width:none}
  .mini-chart{display:block;width:62mm;float:right;margin:0 0 4mm 6mm}
  .out-grid{display:block}
  .blk textarea{border:0;padding:0;min-height:0;height:auto!important;font-size:12px;background:none;overflow:visible}
  .blk h2{font-size:13px;margin:6mm 0 2mm;border-bottom:1px solid #0f2747;padding-bottom:1mm}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="4" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="4" stroke="#3a4e6d" stroke-width="1.3"/>
    </pattern>
  </defs>

function diffVisits(p,a,b){
  var sp=p.species,all=teethOf(sp),res={worse:[],new:[],tx:[],better:[],ci:[],same:[]};
  all.forEach(function(n){
    var x=a.teeth[n]||null,y=b.teeth[n]||null,hx=hasFinding(x),hy=hasFinding(y);
    if(!hx&&!hy) return;
    var from=codesOf(x,sp).join(" ")||"정상",to=codesOf(y,sp).join(" ")||"정상";
    var item={n:n,from:from,to:to};
    if(y&&y.tx){res.tx.push(item);return;}
    if(x&&x.tx&&y&&y.missing){res.same.push(item);return;}
    if(!hx&&hy){res.new.push(item);return;}
    if(hx&&!hy){res.better.push(item);return;}
    var up=false,down=false,ciDown=false;
    SEV_KEYS.concat(["ci"]).forEach(function(k){
      var lx=k==="fx"?sevOfField(k,x[k]):lvl(x[k]),ly=k==="fx"?sevOfField(k,y[k]):lvl(y[k]);
      if(ly>lx) up=true; if(ly<lx){ if(k==="ci") ciDown=true; else down=true; }
    });
    if(y.fx&&!x.fx) up=true;
    if(up) res.worse.push(item); else if(down) res.better.push(item); else if(ciDown) res.ci.push(item); else res.same.push(item);
  });
  return res;
}

/* 치아 시트 */
function renderSheet(p,v,n){
  var sp=p.species,f=v.teeth[n]||{},h=[];
  h.push('<div class="grab" aria-hidden="true"></div>');
  h.push('<div class="st-head"><button class="icon-btn" data-act="prevT" aria-label="이전 치아">'+ICON.prev+'</button><div class="id"><div class="no" id="stNo">'+n+'</div><div class="nm">'+esc(toothName(n))+'</div></div>'+
    '<button class="icon-btn" data-act="nextT" aria-label="다음 치아">'+ICON.next+'</button><button class="btn small primary" data-act="closeT">완료</button></div>');
  FIELDS.forEach(function(F){
    if(F.cat&&sp!=="cat") return;
    if(F.multi&&!multiRooted(sp,n)) return;
    var val=f[F.k]||"",opts=F.opts.filter(function(o){return !(F.k==="tx"&&o==="AMP"&&sp!=="cat");});
    h.push('<div class="grp"><div class="gl"><span>'+F.label+'</span>'+(F.src?'<span class="src">'+F.src+'</span>':'')+'</div><div class="seg" role="group" aria-label="'+F.label+'">');
    h.push('<button type="button" class="kr none'+(val===""?" on":"")+'" data-fk="'+F.k+'" data-fv="" aria-pressed="'+(val==="")+'">'+(F.k==="missing"?"치아 있음":"없음")+'</button>');
    opts.forEach(function(o){var on=val===o,nm=optName(F.k,o);
      h.push('<button type="button" class="'+(F.kr||/[가-힣]/.test(nm)?"kr":"")+(on?" on":"")+'" data-fk="'+F.k+'" data-fv="'+o+'" aria-pressed="'+on+'">'+esc(nm)+'</button>');});
    h.push('</div>'+(val&&F.def[val]?'<div class="def"><b>'+esc(optName(F.k,val))+'</b> '+esc(F.def[val])+'</div>':'')+'</div>');
  });
  h.push('<div class="grp"><div class="gl"><label for="toothNote">메모</label></div><textarea id="toothNote" rows="3" placeholder="예: 방사선상 근단 투과상 의심">'+esc(f.note||"")+'</textarea></div>');
  h.push('<div class="st-foot"><button class="btn" data-act="clearT">이 치아 소견 지우기</button><button class="btn primary" data-act="closeT">완료</button></div>');
  var el=$("#sheet"),keep=el.hidden?0:el.scrollTop;
  el.innerHTML=h.join("");el.hidden=false;$("#scrim").hidden=false;document.body.classList.add("lock");
  el.scrollTop=keep;
}
function closeSheetUI(){$("#sheet").hidden=true;$("#scrim").hidden=true;$("#sheet").innerHTML="";document.body.classList.remove("lock");}
function setTooth(v,n,k,val){
  var f=v.teeth[n]||{};
  if(val) f[k]=val; else delete f[k];
  if(k==="missing"&&val){["tx","fx","pd","furc","mob","ci","tr","rtype","plan"].forEach(function(x){delete f[x];});}
  else if(val&&k!=="note"){delete f.missing;}
  if(Object.keys(f).length) v.teeth[n]=f; else delete v.teeth[n];
  saveSoon();
}

/* 비교 화면 */
function renderCompare(p,v,base){
  var vs=visitsSorted(p),sp=p.species;
  base=base||prevVisit(p,v);
  setAppbar({back:true,small:"방문 비교",title:p.name+" · "+dotDate(base?base.date:"")+" → "+dotDate(v.date)});
  if(!base){main.innerHTML='<p class="empty">비교할 지난 방문이 없습니다.</p>';setActionbar(null);return;}
  var d=diffVisits(p,base,v),changed={};
  ["worse","new","tx","better"].forEach(function(g){d[g].forEach(function(x){changed[x.n]=1;});});
  var h=[];
  h.push('<div class="cmp-head"><h1>'+krDate(base.date,true)+'과<br>'+krDate(v.date,true)+' 비교</h1>');
  var parts=[];if(d.worse.length) parts.push("악화 "+d.worse.length+"개");if(d.new.length) parts.push("신규 소견 "+d.new.length+"개");if(d.tx.length) parts.push("발치·절제 "+d.tx.length+"개");if(d.better.length) parts.push("호전 "+d.better.length+"개");if(d.ci.length) parts.push("치석만 줄어든 치아 "+d.ci.length+"개");
  h.push('<p>'+(parts.length?parts.join(", ")+"입니다. 점선 원이 달라진 치아입니다.":"두 방문 사이에 달라진 치아가 없습니다.")+'</p></div>');
  if(vs.length>2){
    h.push('<div class="visits" role="group" aria-label="비교 기준 방문"><span class="lb">기준</span>'+vs.filter(function(x){return x.date<v.date;}).map(function(x){return '<button class="chip'+(x.id===base.id?' on':'')+'" data-act="cmpbase" data-vid="'+x.id+'">'+dotDate(x.date)+'</button>';}).join("")+'</div>');
  }
  h.push('<div class="cmp-body"><div>');
  h.push('<div class="cmp-tog" role="group" aria-label="도식 보기"><button class="chip" data-act="cmpshow" data-w="a" aria-pressed="false">지난 '+dotDate(base.date)+'</button><button class="chip on" data-act="cmpshow" data-w="b" aria-pressed="true">이번 '+dotDate(v.date)+'</button></div>');
  h.push('<div class="cmp-grid" data-show="b"><figure class="fa"><figcaption><span>지난 방문</span><b>'+dotDate(base.date)+'</b></figcaption><div class="diagram">'+chartSVG(sp,base,{changed:changed})+'</div></figure>'+
    '<figure class="fb"><figcaption><span>이번 방문</span><b>'+dotDate(v.date)+'</b></figcaption><div class="diagram">'+chartSVG(sp,v,{changed:changed})+'</div></figure></div>');
  h.push(legendHTML(true));
  h.push('</div><div>');
  h.push('<ul class="tally">'+[["worse","악화"],["new","신규"],["tx","발치·절제"],["better","호전"],["ci","치석 감소"],["same","그대로"]].map(function(g){return '<li><b>'+d[g[0]].length+'</b>'+g[1]+'</li>';}).join("")+'</ul>');
  [["worse","악화한 치아"],["new","새로 생긴 소견"],["tx","이번에 발치·절제한 치아"],["better","좋아진 치아"],["ci","단계는 그대로, 치석만 줄어든 치아"],["same","그대로인 치아"]].forEach(function(g){
    if(!d[g[0]].length) return;
    h.push('<div class="clist"><h3>'+g[1]+'</h3>'+d[g[0]].map(function(x){
      return '<div class="crow"><span class="no">'+x.n+'</span><span><span class="ch">'+codeHTML(x.from)+'<span class="arr">→</span>'+(g[0]==="worse"||g[0]==="tx"||g[0]==="new"?'<b>'+codeHTML(x.to)+'</b>':codeHTML(x.to))+'</span><br><span class="nm">'+esc(plainName(x.n))+'</span></span></div>';
    }).join("")+'</div>');
  });
  h.push('</div></div>');
  main.innerHTML=h.join("");
  setActionbar('<button class="btn primary" data-act="report">이번 방문 기록문 만들기</button>');
}

/* 환자 목록 */
function renderPatients(){
  setAppbar({back:true,small:"치과 차트",title:"환자 목록"});
  var ps=db.patients.slice().sort(function(a,b){var la=latest(a),lb=latest(b);return ((lb&&lb.date)||"").localeCompare((la&&la.date)||"");});
  var h=[];
  h.push('<div class="list-top"><h1>환자 '+ps.length+'명</h1><button class="btn" data-act="newpat" data-sp="dog">새 환자 · 개</button><button class="btn" data-act="newpat" data-sp="cat">새 환자 · 고양이</button></div>');
  h.push('<ul class="plist">');
  ps.forEach(function(p){
    var v=latest(p),T=v?v.teeth:{},ks=v?findingTeeth(v,p.species):[];
    var nX=ks.filter(function(k){return T[k].tx;}).length,pdMax=ks.reduce(function(m,k){return Math.max(m,lvl(T[k].pd));},0);
    var bits=['소견 '+ks.length];if(nX) bits.push('처치 <b>'+nX+'</b>');if(pdMax) bits.push('최고 <b>PD'+pdMax+'</b>');
    h.push('<li><button class="prow" data-act="openpat" data-pid="'+p.id+'"><span class="th">'+(v?chartSVG(p.species,v,{mini:true}):'')+'</span><span>'+
      '<span class="nm" style="display:block">'+esc(p.name||"이름 없음")+'<span>'+(p.species==="dog"?"개":"고양이")+'</span></span>'+
      '<span class="mt" style="display:block">'+esc([p.breed,p.age].filter(Boolean).join(" · "))+'<br>'+esc(p.owner||"")+' · 방문 '+p.visits.length+'회 · 최근 '+dotDate(v&&v.date)+'</span>'+
      '<span class="sm" style="display:block">'+bits.join(" · ")+'</span></span>'+ICON.chev+'</button></li>');
  });
  h.push('</ul>');
  h.push(storeHTML());
  main.innerHTML=h.join("");
  setActionbar(null);
}

/* ───────── 이동과 뒤로가기 ───────── */
var HOME_PID="p-bori";
function homeState(){var p=pat(cur.pid)||pat(HOME_PID)||db.patients[0];return {app:1,view:"chart",pid:p?p.id:null,vid:null};}
function apply(st){
  var view=st.view||"chart",p=st.pid?pat(st.pid):null;
  if(view!=="patients"&&!p){p=pat(HOME_PID)||db.patients[0];view=p?"chart":"patients";}
  var v=null;
  if(p){v=(st.vid&&vis(p,st.vid))||latest(p);}
  if(p&&!v){view="patients";}
  var sameChart=(cur.view==="chart"&&view==="chart"&&cur.pid===(p&&p.id)&&cur.vid===(v&&v.id)&&$("#diagram"));
  cur={view:view,pid:p?p.id:null,vid:v?v.id:null,tooth:st.tooth||null,cmp:st.cmp||null};
  document.body.setAttribute("data-view",view);
  if(view==="patients") renderPatients();
  else if(view==="chart"){ if(!sameChart) renderChart(p,v); }
  else if(view==="report") renderReport(p,v);
  else if(view==="compare") renderCompare(p,v,st.cmp?vis(p,st.cmp):null);
  if(view==="chart"&&cur.tooth){renderSheet(p,v,cur.tooth);refreshChart(p,v);}
  else if(!$("#sheet").hidden){closeSheetUI(); if(view==="chart") refreshChart(p,v);}
  if(!sameChart) window.scrollTo(0,0);
}
function push(st){st.app=1;history.pushState(st,"");apply(st);}
function go(view,extra){var st=Object.assign({view:view,pid:cur.pid,vid:cur.vid},extra||{});push(st);}
function openTooth(n){push({view:"chart",pid:cur.pid,vid:cur.vid,tooth:n});}
function switchTooth(n){var st={app:1,view:"chart",pid:cur.pid,vid:cur.vid,tooth:n};history.replaceState(st,"");apply(st);}
window.addEventListener("popstate",function(e){
  var st=e.state||{};
  if(!st.app||st.base){
    var atHome=(cur.view==="chart"&&!cur.tooth);
    var hs=homeState();
    history.pushState(hs,"");
    if(atHome) toast("앱을 닫으려면 홈 화면으로 나가 주십시오");
    else apply(hs);
    return;
  }
  apply(st);
});

/* ───────── 이벤트 ───────── */
function svgPoint(svg,cx,cy){var pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;var m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):null;}
function nearestTooth(sp,x,y){
  var best=null,bd=1e9;
  layout(sp).teeth.forEach(function(t){var d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;best=t;}});
  return bd<=32?best:null;
}
document.addEventListener("click",function(e){
  var p=cur.pid?pat(cur.pid):null,v=p?vis(p,cur.vid):null;
  var dg=e.target.closest("#diagram");
  if(dg&&p&&cur.view==="chart"){
    var svg=dg.querySelector("svg"),pt=svg&&svgPoint(svg,e.clientX,e.clientY),t=pt&&nearestTooth(p.species,pt.x,pt.y);
    if(t){ if(cur.tooth) switchTooth(t.n); else openTooth(t.n); }
    return;
  }
  var b=e.target.closest("[data-act],[data-fk]");
  if(!b) return;
  if(b.hasAttribute("data-fk")&&v&&cur.tooth){
    setTooth(v,cur.tooth,b.getAttribute("data-fk"),b.getAttribute("data-fv"));renderSheet(p,v,cur.tooth);refreshChart(p,v);return;
  }
  var act=b.getAttribute("data-act");
  switch(act){
    case "back": history.back(); break;
    case "patients": go("patients"); break;
    case "openpat":
      var pid=b.getAttribute("data-pid"),pp=pat(pid);
      history.replaceState({app:1,view:"chart",pid:pid,vid:latest(pp).id},"");apply({view:"chart",pid:pid,vid:latest(pp).id});break;
    case "visit": var st={app:1,view:"chart",pid:cur.pid,vid:b.getAttribute("data-vid")};history.replaceState(st,"");apply(st);break;
    case "report": go("report"); break;
    case "compare": go("compare"); break;
    case "cmpshow": var g=$(".cmp-grid");if(g) g.setAttribute("data-show",b.getAttribute("data-w"));$$(".cmp-tog .chip").forEach(function(c){var on=c===b;c.classList.toggle("on",on);c.setAttribute("aria-pressed",on);});break;
    case "cmpbase": var s2={app:1,view:"compare",pid:cur.pid,vid:cur.vid,cmp:b.getAttribute("data-vid")};history.replaceState(s2,"");apply(s2);break;
    case "tooth": openTooth(+b.getAttribute("data-n")); break;
    case "closeT": history.back(); break;
    case "prevT": case "nextT":
      var list=teethOf(p.species),i=list.indexOf(cur.tooth),j=(i+(act==="nextT"?1:-1)+list.length)%list.length;switchTooth(list[j]);break;
    case "clearT": delete v.teeth[cur.tooth];save();renderSheet(p,v,cur.tooth);refreshChart(p,v);toast(cur.tooth+"번 소견을 지웠습니다");break;
    case "bulkci":
      var cv=b.getAttribute("data-v");
      teethOf(p.species).forEach(function(n){var f=v.teeth[n]||{};if(f.missing||(f.tx&&f.tx!=="AMP")) return;if(cv) f.ci=cv; else delete f.ci;if(Object.keys(f).length) v.teeth[n]=f; else delete v.teeth[n];});
      save();refreshChart(p,v);toast(cv?"결손·발치 치아를 뺀 모든 치아에 "+cv+"를 넣었습니다":"치석 지수를 모두 지웠습니다");break;
    case "copyRec": copyText($("#recText").value,"요약"); break;
    case "copyHand": copyText($("#handText").value,"안내문"); break;
    case "print": window.print(); break;
    case "newpat":
      var sp=b.getAttribute("data-sp"),np={id:uid("p"),species:sp,name:sp==="dog"?"새 환자(개)":"새 환자(고양이)",breed:"",sex:"",age:"",weight:"",owner:"",chartNo:"",visits:[V({id:uid("v"),date:todayISO()})]};
      db.patients.push(np);save();
      history.replaceState({app:1,view:"chart",pid:np.id,vid:np.visits[0].id},"");apply({view:"chart",pid:np.id,vid:np.visits[0].id});
      var dt=$$("details.box")[1];if(dt) dt.open=true;toast("새 차트를 열었습니다. 환자 정보를 먼저 적어 주십시오");break;
    case "newvisit":
      var last=latest(p),nv=V({id:uid("v"),date:todayISO()});
      Object.keys(last.teeth).forEach(function(k){var f=last.teeth[k];if(f.missing||(f.tx&&f.tx!=="AMP")) nv.teeth[k]={missing:"O"};});
      p.visits.push(nv);save();
      var s3={app:1,view:"chart",pid:p.id,vid:nv.id};history.replaceState(s3,"");apply(s3);toast("새 방문을 만들었습니다. 결손·발치한 치아는 결손 O로 옮겨 두었습니다");break;
    case "delvisit":
      if(p.visits.length<2){toast("방문이 하나뿐이라 지울 수 없습니다. 환자 기록 삭제를 쓰십시오");break;}
      if(confirm(dotDate(v.date)+" 방문 기록을 지울까요? 되돌릴 수 없습니다.")){p.visits=p.visits.filter(function(x){return x.id!==v.id;});save();var s4={app:1,view:"chart",pid:p.id,vid:latest(p).id};history.replaceState(s4,"");apply(s4);}
      break;
    case "delpatient":
      if(confirm((p.name||"이 환자")+" 기록 전체를 이 기기에서 지울까요? 되돌릴 수 없습니다.")){db.patients=db.patients.filter(function(x){return x.id!==p.id;});save();
        if(!db.patients.length){db.patients=seed();save();}
        var hp=db.patients[0];var s5={app:1,view:"chart",pid:hp.id};history.replaceState(s5,"");apply(s5);}
      break;
    case "export": exportBackup(); break;
    case "import": $("#importFile").click(); break;
    case "reseed":
      if(confirm("예시 환자 4명의 기록을 처음 상태로 되돌릴까요? 직접 만든 환자는 그대로 둡니다.")){
        var sd=seed();sd.forEach(function(s){var ix=-1;db.patients.forEach(function(x,i){if(x.id===s.id) ix=i;});if(ix>=0) db.patients[ix]=s; else db.patients.push(s);});
        save();apply(Object.assign({},history.state||{view:"chart",pid:HOME_PID}));toast("예시 기록을 처음 상태로 되돌렸습니다");}
      break;
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&cur.tooth){history.back();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("tooth")){e.preventDefault();var n=+e.target.getAttribute("data-n");if(cur.tooth) switchTooth(n); else openTooth(n);}
});
$("#scrim").addEventListener("click",function(){if(cur.tooth) history.back();});
document.addEventListener("input",function(e){
  var t=e.target,p=cur.pid?pat(cur.pid):null,v=p?vis(p,cur.vid):null;
  if(t.tagName==="TEXTAREA"&&(t.id==="recText"||t.id==="handText")){autoSize(t);return;}
  if(!p||!v) return;
  if(t.id==="toothNote"&&cur.tooth){setTooth(v,cur.tooth,"note",t.value);clearTimeout(window.__nt);window.__nt=setTimeout(function(){refreshChart(p,v);},350);return;}
  var pk=t.getAttribute("data-pk"),vk=t.getAttribute("data-vk");
  if(pk){p[pk]=t.value;saveSoon();if(pk==="name") setAppbar({small:"치과 차트",title:p.name+" · "+dotDate(v.date),right:$("#appbarIn .icon-btn.text").outerHTML});}
  if(vk){v[vk]=t.value;saveSoon();}
});
document.addEventListener("change",function(e){
  var t=e.target,p=cur.pid?pat(cur.pid):null,v=p?vis(p,cur.vid):null;
  if(!v) return;
  if(t.hasAttribute("data-proc")){v.proc=v.proc||{};v.proc[t.getAttribute("data-proc")]=t.checked;saveSoon();return;}
  if(t.getAttribute("data-vk")==="date"){v.date=t.value;save();var st={app:1,view:"chart",pid:p.id,vid:v.id};cur.vid=null;history.replaceState(st,"");apply(st);return;}
  if(t.tagName==="SELECT"&&t.getAttribute("data-vk")){v[t.getAttribute("data-vk")]=t.value;saveSoon();}
});

function exportBackup(){
  var d=new Date(),name="치과차트_백업_"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+".json";
  var blob=new Blob([JSON.stringify({app:"cji-dental-chart",version:2,saved:new Date().toISOString(),patients:db.patients},null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},600);
  toast("백업 파일을 저장했습니다");
}
$("#importFile").addEventListener("change",function(){
  var file=this.files&&this.files[0];if(!file) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result),arr=o&&o.patients;
      if(!Array.isArray(arr)) throw 0;
      var ok=arr.filter(function(x){return x&&typeof x.id==="string"&&(x.species==="dog"||x.species==="cat")&&Array.isArray(x.visits)&&x.visits.length;});
      if(!ok.length) throw 0;
      if(!confirm("환자 "+ok.length+"명의 기록을 불러옵니다. 같은 환자가 있으면 불러온 내용으로 바꿉니다. 계속할까요?")) return;
      ok.forEach(function(x){var ix=-1;db.patients.forEach(function(y,i){if(y.id===x.id) ix=i;});if(ix>=0) db.patients[ix]=x; else db.patients.push(x);});
      save();apply(history.state||homeState());toast("환자 "+ok.length+"명의 기록을 불러왔습니다");
    }catch(err){toast("이 앱에서 저장한 백업 파일이 아닙니다");}
  };
  fr.readAsText(file);this.value="";
});

/* ───────── 시작 ───────── */
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",function(){if(document.hidden) save();});
load();
history.replaceState({app:1,base:1},"");
var start=homeState();
history.pushState(start,"");
apply(start);

/* 점검용 (화면에는 나타나지 않음): #shot=view:pid[:vid][:tooth], #check */
var mShot=/^#shot=(\w+):([\w-]+)(?::([\w-]*))?(?::(\d+))?$/.exec(location.hash);
if(mShot){push({view:mShot[1],pid:mShot[2],vid:mShot[3]||null});if(mShot[4]) openTooth(+mShot[4]);}
if(location.hash==="#check"){
  var rep=[],vw=document.documentElement.clientWidth;
  function chk(label){
    var sw=document.documentElement.scrollWidth,wide=[];
    $$("body *").forEach(function(el){if(el.closest("svg")||el.closest("[hidden]")) return;var r=el.getBoundingClientRect();if(r.width>0&&r.right>vw+1) wide.push(el.tagName+"."+el.className+" "+Math.round(r.right));});
    rep.push(label+": vw="+vw+" sw="+sw+(wide.length?" OVER "+wide.slice(0,4).join(" | "):" ok"));
  }
  rep.push("dog="+teethOf("dog").length+" cat="+teethOf("cat").length);
  rep.push("dogQ="+[1,2,3,4].map(function(q){return teethOf("dog").filter(function(n){return Math.floor(n/100)===q;}).length;}).join("/")+" catQ="+[1,2,3,4].map(function(q){return teethOf("cat").filter(function(n){return Math.floor(n/100)===q;}).length;}).join("/"));
  db.patients.forEach(function(p){
    push({view:"chart",pid:p.id});chk("chart "+p.id);
    var n=findingTeeth(latest(p),p.species)[0];openTooth(+n);chk("tooth "+p.id+" "+n);history.replaceState({app:1,view:"chart",pid:p.id},"");apply({view:"chart",pid:p.id});
    push({view:"report",pid:p.id});chk("report "+p.id);
    push({view:"compare",pid:p.id});chk("compare "+p.id);
  });
  push({view:"chart",pid:"p-bori"});
  var tapOK=0,tapBad=[];
  layout("dog").teeth.forEach(function(t){
    var svg=$("#diagram svg"),m=svg.getScreenCTM(),x=m.a*t.x+m.c*t.y+m.e,y=m.b*t.x+m.d*t.y+m.f;
    svg.dispatchEvent(new MouseEvent("click",{bubbles:true,clientX:x,clientY:y}));
    if(cur.tooth===t.n) tapOK++; else tapBad.push(t.n+"->"+cur.tooth);
    if(cur.tooth) history.replaceState({app:1,view:"chart",pid:"p-bori"},""),apply({view:"chart",pid:"p-bori"});
  });
  rep.push("tap dog: "+tapOK+"/42 "+tapBad.join(","));
  push({view:"patients"});chk("patients");
  var pre=document.createElement("pre");pre.id="check";pre.style.cssText="white-space:pre-wrap;font-size:11px";pre.textContent=rep.join("\n");document.body.appendChild(pre);
}
window.__dental={teethOf:teethOf,recordText:recordText,handoutText:handoutText,diffVisits:diffVisits,pat:pat,latest:latest,prevVisit:prevVisit};
})();
</script>
