<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'">
<meta name="theme-color" content="#f4f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121618" media="(prefers-color-scheme: dark)">
<title>의뢰환자 보드 · 라인동물의료센터 시제품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f4; --surface:#ffffff; --sunk:#eceeed; --line:#dfe2e1; --line2:#ebedec;
  --ink:#16202a; --ink2:#46515c; --mute:#66707a;
  --accent:#0d6b5d; --accent-ink:#ffffff; --accent-soft:#e4f0ed;
  --warn:#b23f1b; --warn-soft:#fbede7;
  --shadow:0 1px 2px rgba(22,32,42,.05),0 4px 14px rgba(22,32,42,.04);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:10px; --r-sm:8px;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121618; --surface:#1a1f22; --sunk:#15191b; --line:#2b3236; --line2:#232a2e;
    --ink:#e6eaec; --ink2:#b4bcc2; --mute:#8d969d;
    --accent:#4fb4a1; --accent-ink:#0d1a17; --accent-soft:#18312c;
    --warn:#f08b62; --warn-soft:#38211a;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top ---------- */
.proto{font-size:13px;color:var(--mute);border-bottom:1px solid var(--line2)}
.proto .in{max-width:1240px;margin:0 auto;padding:7px 16px;display:flex;justify-content:space-between;gap:12px}
.proto b{color:var(--ink2);font-weight:600}
.proto .ex{white-space:nowrap}
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
header.bar .in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;min-height:60px}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.brand .sub{font-size:13px;color:var(--mute);line-height:1.3}
.today{font-size:14px;color:var(--ink2);white-space:nowrap}
nav.top{display:none;gap:4px}
nav.top button{border:0;background:none;padding:0 14px;height:44px;border-radius:var(--r-sm);font-size:15px;color:var(--ink2);display:flex;align-items:center;gap:8px}
nav.top button:hover{background:var(--sunk)}
nav.top button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}

/* bottom tab bar (phone) */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar button{border:0;background:none;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:var(--mute);font-weight:500}
nav.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:900px){
  nav.tabbar{display:none}
  nav.top{display:flex}
  .today{order:3}
}

main{max-width:1240px;margin:0 auto;padding:20px 16px 28px}
@media (min-width:900px){main{padding:28px 24px 48px}header.bar .in,.proto .in{padding-left:24px;padding-right:24px}}

/* ---------- common ---------- */
h2.h{font-size:21px;margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.3}
p.lead{margin:4px 0 0;color:var(--mute);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:15.5px;font-weight:600;white-space:nowrap;transition:transform .12s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn.line{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.line:hover{border-color:var(--mute)}
.btn.quiet{background:none;border-color:transparent;color:var(--ink2);padding:0 10px}
.btn.wide{width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.surface{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{color:var(--mute);font-size:15px;padding:28px 12px;text-align:center}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap;line-height:1}
.tag.u2{background:var(--ink);color:var(--surface)}
.tag.u1{box-shadow:inset 0 0 0 1px var(--ink2);color:var(--ink)}
.tag.dept{background:var(--sunk);color:var(--ink2);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--ink);color:var(--surface);font-size:15px;padding:11px 18px;border-radius:var(--r-sm);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:28px}}

/* ---------- board ---------- */
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.board-head .btn{display:none}
@media (min-width:900px){.board-head .btn{display:inline-flex}}

.alert{border-radius:var(--r);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);padding:14px 16px 6px;margin-bottom:18px}
.alert-h{display:flex;align-items:center;gap:8px;color:var(--warn);font-weight:700;font-size:16px}
.alert-h span.n{font-variant-numeric:tabular-nums}
.alert p{margin:2px 0 6px;font-size:14px;color:var(--ink2)}
.alert ul{list-style:none;margin:0;padding:0}
.alert li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--warn) 18%,transparent)}
.alert li:first-child{border-top:0}
.alert .who{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.alert .who b{font-size:16px}
.alert .who span{display:block;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert .d{font-size:14px;color:var(--warn);font-weight:600;white-space:nowrap}
.alert .btn{min-height:44px;padding:0 14px;font-size:14.5px;background:var(--surface);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;overflow:hidden}
.kpi{padding:14px 16px;border-top:1px solid var(--line2)}
.kpi:nth-child(-n+2){border-top:0}
.kpi:nth-child(2n){border-left:1px solid var(--line2)}
.kpi .k{font-size:14px;color:var(--mute)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--sans);font-size:15px;font-weight:500;color:var(--mute);margin-left:2px;letter-spacing:0}
.kpi .v.w{color:var(--warn)}
@media (min-width:700px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi{border-top:0!important;border-left:1px solid var(--line2)}
  .kpi:first-child{border-left:0}
}

.tools{display:flex;gap:10px;margin-bottom:14px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:0 14px 0 42px;font-size:16px}
.search input::placeholder{color:var(--mute)}

.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:7px;min-height:56px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;color:var(--ink2)}
.seg button .n{font-family:var(--mono);font-size:19px;font-weight:600}
.seg button .l{font-size:13px;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 0 0 1px var(--line)}
.seg button[aria-selected="true"] .l{font-weight:600}
.seg button .n.w{color:var(--warn)}

.board .col{display:none}
.board .col.on{display:block}
.col-h{display:none}
.list{display:grid;gap:10px}

.case{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);transition:border-color .15s,transform .12s}
.case:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.case:active{transform:scale(.99)}
.case.late{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));box-shadow:inset 3px 0 0 var(--warn),var(--shadow)}
.case .r1{display:flex;align-items:center;gap:8px}
.case .pet{font-size:17px;font-weight:700;letter-spacing:-.01em}
.case .sig{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.case .cc{margin:6px 0 10px;font-size:15px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.case .r3{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.case .r3 .from{color:var(--ink2);font-weight:500}
.case .r3 .sp{flex:1}
.pips{display:inline-flex;gap:3px}
.pips i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.pips i.f{background:var(--accent)}
.case .late-line{margin-top:10px;padding-top:9px;border-top:1px dashed color-mix(in srgb,var(--warn) 35%,var(--line));color:var(--warn);font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.case .done-line{margin-top:8px;font-size:14px;color:var(--mute)}

@media (min-width:1024px){
  .seg{display:none}
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
  .board .col{display:block;background:var(--sunk);border:1px solid var(--line2);border-radius:12px;padding:6px 8px 8px;min-height:360px}
  .col-h{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 10px;font-weight:600;font-size:15px}
  .col-h .n{font-family:var(--mono);color:var(--mute);font-weight:500}
  .col-h .step{display:flex;align-items:center;gap:8px}
  .col-h .step em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--mute);font-weight:500}
  .list{gap:8px}
  .case{padding:12px 14px}
  .case .pet{font-size:16px}
  .case .cc{font-size:14.5px}
  .case .r3{font-size:13.5px}
}

.datafoot{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;color:var(--mute);font-size:14px}
.datafoot .note{flex:1 1 100%;margin-bottom:4px}
.datafoot .btn{font-size:14.5px;min-height:44px}
@media (min-width:900px){.datafoot .note{flex:1 1 auto;margin:0}}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--ink2);font-size:15.5px;min-height:44px;padding:0 6px 0 0;margin:-8px 0 6px}
.dgrid{display:grid;gap:16px}
@media (min-width:1024px){.dgrid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}.dgrid .stick{position:sticky;top:84px}}
.pane{padding:18px 16px}
@media (min-width:700px){.pane{padding:22px 24px}}
.pt-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.pt-head h2{font-size:26px;margin:0;letter-spacing:-.02em;line-height:1.2}
.pt-head .sig{color:var(--mute);font-size:15px;margin-top:4px}
.pt-head .id{font-family:var(--mono);font-size:13px;color:var(--mute);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

.stepper{margin:20px 0 6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stepper button{border:0;background:none;padding:0;text-align:left;min-height:52px;display:flex;flex-direction:column;gap:7px;color:var(--mute)}
.stepper button .bar{height:5px;border-radius:3px;background:var(--line);width:100%}
.stepper button .lb{font-size:13.5px;line-height:1.25;white-space:nowrap}
.stepper button.past{color:var(--ink2)}
.stepper button.past .bar{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.stepper button.cur{color:var(--ink);font-weight:700}
.stepper button.cur .bar{background:var(--accent)}
.stepper.late button.cur .bar{background:var(--warn)}
.stline{font-size:14px;color:var(--mute);margin:4px 0 0}
.stline.w{color:var(--warn);font-weight:600}
.pt-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pt-actions .btn{padding:0 10px}

dl.info{margin:20px 0 0;display:grid;grid-template-columns:88px minmax(0,1fr);gap:0;border-top:1px solid var(--line2)}
dl.info dt,dl.info dd{padding:11px 0;border-bottom:1px solid var(--line2);margin:0}
dl.info dt{color:var(--mute);font-size:14.5px}
dl.info dd{font-size:15.5px}
dl.info dd small{color:var(--mute);font-size:14px;margin-left:4px}
.sub-actions{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}

.rec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.rec-h h3{margin:0;font-size:18px}
.rec-h span{font-size:13.5px;color:var(--mute)}
.field{display:block;margin-top:16px}
.field > span{display:block;font-size:14.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field > span em{font-style:normal;font-weight:400;color:var(--mute);font-size:13.5px;margin-left:6px}
input[type=text],input[type=date],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 12px;font-size:16px;line-height:1.55}
input[type=text],input[type=date],select{height:48px;padding-top:0;padding-bottom:0}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.85}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:0;border-color:var(--accent)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,20,24,.42);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;top:5vh;z-index:41;background:var(--surface);border-radius:16px 16px 0 0;display:flex;flex-direction:column;transform:translateY(24px);opacity:0;transition:transform .25s cubic-bezier(.16,1,.3,1),opacity .2s}
.sheet.on{transform:none;opacity:1}
@media (min-width:900px){.sheet{left:50%;top:6vh;bottom:6vh;width:760px;margin-left:-380px;border-radius:14px}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 20px;border-bottom:1px solid var(--line2)}
.sheet-h h3{margin:0;font-size:18px;flex:1}
.sheet-h .x{width:44px;height:44px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.sheet-b{flex:1;overflow:auto;padding:16px 20px;-webkit-overflow-scrolling:touch}
.sheet-b .meta{font-size:14px;color:var(--mute);margin:0 0 10px}
.letter{width:100%;min-height:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:18px 16px;font-size:15.5px;line-height:1.85;background:var(--bg);resize:none}
@media (min-width:900px){.letter{padding:28px 32px;font-size:15.5px}}
.sheet-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);flex-wrap:wrap}
.sheet-f .btn{flex:1 1 auto}
.sheet-f .btn.main{flex:2 1 auto}
body.lock{overflow:hidden}

/* ---------- form ---------- */
.form-wrap{max-width:760px}
.fs{margin:22px 0 0;padding:0;border:0}
.fs legend{font-size:15px;font-weight:700;padding:0;margin-bottom:2px}
.g2{display:grid;grid-template-columns:minmax(0,1fr);gap:0 14px}
@media (min-width:640px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g2 .full{grid-column:1/-1}}
.radios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:15.5px}
.radios input:checked + span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.radios input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.form-actions{display:flex;gap:8px;margin-top:26px}
.form-actions .btn{flex:1}
@media (min-width:640px){.form-actions .btn{flex:0 0 auto;min-width:140px}}

/* ---------- stats ---------- */
.stats-grid{display:grid;gap:16px;margin-top:18px}
@media (min-width:1024px){.stats-grid{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}}
.headline-stat{font-size:16px;color:var(--ink2);margin:0 0 14px;line-height:1.6}
.headline-stat b{color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin:0 0 6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans)}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line2)}
.rank li:first-child{border-top:0}
.rank .nm{font-weight:600;font-size:15.5px}
.rank .ar{font-size:14px;color:var(--mute)}
.rank .v{text-align:right;font-family:var(--mono);font-size:15px}
.rank .dl{text-align:right;font-size:13.5px;color:var(--mute)}
.rank .dl.up{color:var(--accent);font-weight:600}
.mix{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.mix span{font-size:14.5px;padding:7px 12px;border-radius:var(--r-sm);background:var(--sunk);color:var(--ink2)}
.mix b{font-family:var(--mono);color:var(--ink);margin-left:4px}
.foot-note{font-size:13.5px;color:var(--mute);margin:14px 0 0}

/* ---------- notice ---------- */
.ngrid{display:grid;gap:16px;margin-top:18px}
@media (min-width:1024px){.ngrid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.ngrid .stick{position:sticky;top:84px}}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* ---------- 저장 ---------- */
var db;
function load(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&Array.isArray(d.cases)&&Array.isArray(d.hospitals)){db=d;return;}}}catch(e){}db=seed();}
function save(){db.savedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast("이 기기에서는 저장할 수 없습니다");}}
function hosp(id){for(var i=0;i<db.hospitals.length;i++)if(db.hospitals[i].id===id)return db.hospitals[i];return {id:id,name:id,area:""};}
function getCase(id){for(var i=0;i<db.cases.length;i++)if(db.cases[i].id===id)return db.cases[i];return null;}
function waitDays(c){return c.status===2&&c.waitAt?daysAgo(c.waitAt):0;}
function isLate(c){return c.status===2&&waitDays(c)>=LATE;}
function onBoard(c){return c.status<3||daysAgo(c.date)<=30;}

/* ---------- 공용 ---------- */
var $main=document.getElementById("main");
var tt;
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on");},2400);}
function copy(text){
  function fallback(){var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="0";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("복사했습니다. 붙여 넣기만 하시면 됩니다");}catch(e){toast("복사가 막혀 있습니다. 길게 눌러 직접 복사해 주십시오");}document.body.removeChild(ta);}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){toast("복사했습니다. 붙여 넣기만 하시면 됩니다");},fallback);}else fallback();
}
function each(sel,fn,root){Array.prototype.forEach.call((root||document).querySelectorAll(sel),fn);}
function sig(p){return [p.species,p.breed,p.age,p.sex].filter(Boolean).join(" · ");}
function ro(s){return s==="진료 중"?s+"으로":s+"로";}
function urgTag(u){return u?'<span class="tag u'+u+'">'+URG[u]+'</span>':"";}
function pips(s){var h='<span class="pips" aria-label="'+STATUS[s]+' 단계">';for(var i=0;i<4;i++)h+='<i'+(i<=s?' class="f"':'')+'></i>';return h+'</span>';}

var TABS=[{v:"board",l:"보드",i:"board"},{v:"new",l:"새 의뢰",i:"plus"},{v:"stats",l:"병원별 현황",i:"chart"},{v:"notice",l:"공지 작성",i:"notice"}];
document.getElementById("tabbar").innerHTML=TABS.map(function(t){return '<button data-v="'+t.v+'">'+ic(t.i)+'<span>'+(t.v==="stats"?"현황":t.l)+'</span></button>';}).join("");
document.getElementById("topnav").innerHTML=TABS.map(function(t){return '<button data-v="'+t.v+'">'+ic(t.i,"s")+t.l+'</button>';}).join("");
each("#tabbar button,#topnav button",function(b){b.addEventListener("click",function(){
  var v=b.getAttribute("data-v");
  if(v===cur.view&&!cur.sheet){window.scrollTo({top:0,behavior:"smooth"});return;}
  go({view:v,col:v==="board"?boardCol:0});
});});

/* ---------- 라우터: 뒤로가기로 앱이 닫히지 않게 ---------- */
var cur={view:"board",col:0};
var boardCol=0,lastKey="",forceMain=false,savedScroll=0;
function keyOf(st){return [st.view,st.id||"",st.view==="board"?st.col||0:"",st.scope||""].join("|");}
function go(st,replace){
  st.app=1;
  if(replace)history.replaceState(st,"");else history.pushState(st,"");
  render(st);
  if(!st.sheet)window.scrollTo(0,0);
}
window.addEventListener("popstate",function(e){
  var st=e.state||{};
  if(!st.app||st.base){
    var home={app:1,view:"board",col:0};
    history.pushState(home,"");
    if(cur.view!=="board"||cur.sheet||(cur.col||0)!==0){render(home);window.scrollTo(0,0);}
    else toast("앱을 닫으려면 홈 화면으로 나가 주십시오");
    return;
  }
  render(st);
});
function render(st){
  var k=keyOf(st);
  var sameMain=(k===lastKey)&&!forceMain;
  cur={view:st.view||"board",col:st.col||0,id:st.id||null,scope:st.scope||"",sheet:st.sheet||null,sid:st.sid||null,q:cur.q};
  if(cur.view==="board")boardCol=cur.col;
  var tabV=cur.view==="detail"?"board":cur.view==="edit"?"new":cur.view;
  each("#tabbar button,#topnav button",function(b){if(b.getAttribute("data-v")===tabV)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  if(!sameMain){
    forceMain=false;lastKey=k;
    if(cur.view==="board")renderBoard();
    else if(cur.view==="new")renderForm(null);
    else if(cur.view==="edit")renderForm(getCase(cur.id));
    else if(cur.view==="detail")renderDetail(getCase(cur.id));
    else if(cur.view==="stats")renderStats();
    else if(cur.view==="notice")renderNotice();
    else renderBoard();
  }
  if(cur.sheet==="letter")openLetter(getCase(cur.sid));else closeSheet();
}

  var h=hosp(c.hosp),late=isLate(c),wd=waitDays(c);
  var foot="";

function renderBoard(){

  });

    if(i<2&&y.urg!==x.urg)return y.urg-x.urg;

  var done=recent.filter(function(c){return c.status===3&&c.doneAt;});
  var avg=done.length?done.reduce(function(a,c){return a+diff(c.date,c.doneAt);},0)/done.length:null;

      late.map(function(c){var hh=hosp(c.hosp);return '<li><button class="who" data-open="'+c.id+'"><b>'+esc(c.pet.name)+'</b><span>'+esc(hh.name)+' · '+esc(c.refVet)+' 원장</span></button>'+

  }

    '<div class="kpi"><div class="k">회신 대기</div><div class="v">'+all.filter(function(c){return c.status===2;}).length+'<small>건</small></div></div>'+
    '<div class="kpi"><div class="k">회신 지연</div><div class="v'+(late.length?" w":"")+'">'+late.length+'<small>건</small></div></div>'+
    '<div class="kpi"><div class="k">평균 회신 소요</div><div class="v">'+(avg==null?"-":avg.toFixed(1))+'<small>일</small></div></div></div>';
  h+='<div class="tools"><label class="search">'+ic("search","s")+'<input id="q" type="search" placeholder="환자, 병원, 진단으로 찾기" value="'+esc(q)+'" aria-label="검색" enterkeyhint="search"></label></div>';
  h+='<div class="seg" role="tablist" aria-label="진행 단계">';
  for(var i=0;i<4;i++){var lc=i===2&&cols[2].some(isLate);h+='<button role="tab" data-col="'+i+'" aria-selected="'+(cur.col===i)+'"><span class="n'+(lc?" w":"")+'">'+cols[i].length+'</span><span class="l">'+STATUS[i]+'</span></button>';}
  h+='</div><div class="board">';
  for(i=0;i<4;i++){
    h+='<section class="col'+(cur.col===i?" on":"")+'" aria-label="'+STATUS[i]+'"><div class="col-h"><span class="step">'+STATUS[i]+'</span><span class="n">'+cols[i].length+'</span></div><div class="list">';
    h+=cols[i].length?cols[i].map(caseCard).join(""):'<div class="empty">'+(q?"찾는 환자가 이 단계에 없습니다":STATUS[i]+" 단계 환자가 없습니다")+'</div>';
    h+='</div></section>';
  }
  h+='</div>'+dataFoot();

function setStatus(c,s){
  if(s===c.status||s<0||s>3)return;
  var t=iso(today0());
  if(s>=2&&!c.waitAt)c.waitAt=t;
  if(s<2)c.waitAt="";
  c.doneAt=s===3?t:"";
  c.status=s;save();
  toast(c.pet.name+": "+ro(STATUS[s])+" 옮겼습니다");
  if(cur.view==="detail"&&!cur.sheet){forceMain=true;render({view:"detail",id:c.id});}
  else forceMain=true;
}

function letterText(c){
  var h=hosp(c.hosp),p=c.pet;
  function blk(v,ph){v=(v||"").trim();if(!v)return "  ("+ph+")";return v.split("\n").map(function(x){return "  "+x.trim();}).join("\n");}
  var L=[];
  L.push("진료 회신서");

  L.push("발신  "+CENTER+" "+c.vet);
  L.push("일자  "+fdate(iso(today0())));
  L.push("");
  L.push("원장님, 안녕하십니까. "+CENTER+" "+c.vet+"입니다.");
  L.push(kdate(c.date)+" 의뢰해 주신 환자의 진료 결과를 아래와 같이 회신드립니다.");
  L.push("");
  L.push("1. 환자 정보");
  L.push("  이름: "+p.name+" ("+[p.species,p.breed].filter(Boolean).join(", ")+")");
  L.push("  나이·성별: "+[p.age,p.sex].filter(Boolean).join(", "));
  L.push("  보호자: "+(c.owner||"-"));
  L.push("  접수일: "+fdate(c.date)+" (차트 "+c.id+")");
  L.push("");
  L.push("2. 주 호소");L.push(blk(c.cc,"주 호소를 입력해 주십시오"));L.push("");
  L.push("3. 검사 결과");L.push(blk(c.tests,"검사 결과를 입력해 주십시오"));L.push("");
  L.push("4. 진단");L.push(blk(c.dx,"진단을 입력해 주십시오"));L.push("");
  L.push("5. 치료 및 경과");L.push(blk(c.tx,"치료 및 경과를 입력해 주십시오"));L.push("");
  L.push("6. 향후 계획");L.push(blk(c.plan,"향후 계획을 입력해 주십시오"));L.push("");
  L.push("귀한 환자를 믿고 보내 주셔서 감사합니다.");
  L.push("검사 결과지와 영상 자료가 필요하시면 말씀해 주십시오. 바로 보내 드리겠습니다.");
  L.push("이후 경과에 변화가 있으면 다시 연락드리겠습니다.");
  L.push("");
  L.push(CENTER+" "+c.vet+" 드림");
  return L.join("\n");
}

    '<label class="field"><span>성별</span><select name="sex">'+opt(["","수컷","암컷","중성화 수컷","중성화 암컷"],c.pet.sex)+'</select></label>'+
    '<label class="field full"><span>주 호소<em>의뢰 사유</em></span><textarea name="cc" rows="3">'+esc(c.cc)+'</textarea></label>'+
  '</div></fieldset>'+
  '<fieldset class="fs"><legend>우리 병원 접수</legend><div class="g2">'+
    '<label class="field"><span>분과</span><select name="dept">'+opt(DEPTS,c.dept)+'</select></label>'+
    '<label class="field"><span>담당 수의사</span><select name="vet">'+opt(VETS,c.vet)+'</select></label>'+
    '<label class="field"><span>접수일</span><input type="date" name="date" value="'+esc(c.date)+'"></label>'+
    '<div class="field"><span>긴급도</span><div class="radios" role="radiogroup" aria-label="긴급도">'+
      [2,1,0].map(function(u){return '<label><input type="radio" name="urg" value="'+u+'"'+(c.urg===u?" checked":"")+'><span>'+URG[u]+'</span></label>';}).join("")+'</div></div>'+
  '</div></fieldset>'+
  '<div class="form-actions"><button class="btn" type="submit">'+(isNew?"접수 등록":"저장")+'</button><button class="btn line" type="button" id="cancel">취소</button></div>'+
  '</form></div>';
  $main.innerHTML=h;
  var f=document.getElementById("f");
  f.hosp.addEventListener("change",function(){document.getElementById("newHospWrap").hidden=f.hosp.value!=="__new";});
  document.getElementById("cancel").onclick=function(){history.back();};
  if(!isNew)document.getElementById("back").onclick=function(){history.back();};
  f.addEventListener("submit",function(e){
    e.preventDefault();
    var hid=f.hosp.value;
    if(!hid){toast("의뢰 병원을 골라 주십시오");f.hosp.focus();return;}
    if(!f.pname.value.trim()){toast("환자 이름을 적어 주십시오");f.pname.focus();return;}
    if(hid==="__new"){
      var raw=f.newHosp.value.trim();if(!raw){toast("새 병원 이름을 적어 주십시오");f.newHosp.focus();return;}
      var parts=raw.split(",");hid="H"+Date.now().toString(36);
      db.hospitals.push({id:hid,name:parts[0].trim(),area:(parts[1]||"").trim()});
    }
    var data={hosp:hid,refVet:f.refVet.value.trim(),owner:f.owner.value.trim(),
      pet:{name:f.pname.value.trim(),species:f.species.value,breed:f.breed.value.trim(),age:f.age.value.trim(),sex:f.sex.value},
      cc:f.cc.value.trim(),dept:f.dept.value,vet:f.vet.value,date:f.date.value||iso(today0()),urg:+(f.querySelector("input[name=urg]:checked")||{value:0}).value};
    if(isNew){
      db.seq=(db.seq||2600)+1;
      var nc=Object.assign({id:"R"+db.seq,status:0,waitAt:"",doneAt:"",tests:"",dx:"",tx:"",plan:""},data);
      db.cases.push(nc);save();toast(nc.pet.name+" 접수했습니다");
      go({view:"detail",id:nc.id},true);
    }else{
      Object.assign(c,data);save();toast("저장했습니다");forceMain=true;history.back();
    }
  });
}

/* ---------- 병원별 현황 ---------- */
function renderStats(){
  var A=db.cases.filter(function(c){return daysAgo(c.date)<30;});
  var B=db.cases.filter(function(c){var n=daysAgo(c.date);return n>=30&&n<60;});
  var rows=db.hospitals.map(function(h){
    var a=A.filter(function(c){return c.hosp===h.id;}),b=B.filter(function(c){return c.hosp===h.id;});
    var dn=db.cases.filter(function(c){return c.hosp===h.id&&c.status===3&&c.doneAt&&daysAgo(c.date)<60;});
    return {h:h,a:a.length,b:b.length,avg:dn.length?dn.reduce(function(s,c){return s+diff(c.date,c.doneAt);},0)/dn.length:null,
      open:db.cases.filter(function(c){return c.hosp===h.id&&c.status<3;}).length,late:db.cases.filter(function(c){return c.hosp===h.id&&isLate(c);}).length};
  }).filter(function(r){return r.a||r.b;}).sort(function(x,y){return y.a-x.a||y.b-x.b||x.h.name.localeCompare(y.h.name);});
  var top=rows[0];
  var delta=A.length-B.length;
  var mix={};A.forEach(function(c){mix[c.dept]=(mix[c.dept]||0)+1;});
  var mixArr=Object.keys(mix).map(function(k){return [k,mix[k]];}).sort(function(a,b){return b[1]-a[1];});

  var h='<h2 class="h">병원별 현황</h2><p class="lead">최근 30일과 그 전 30일의 의뢰 건수를 비교합니다.</p>'+
  '<div class="kpis" style="margin-top:18px;margin-bottom:0">'+
    '<div class="kpi"><div class="k">최근 30일</div><div class="v">'+A.length+'<small>건</small></div></div>'+
    '<div class="kpi"><div class="k">직전 30일</div><div class="v">'+B.length+'<small>건</small></div></div>'+
    '<div class="kpi"><div class="k">증감</div><div class="v">'+(delta>0?"+":"")+delta+'<small>건</small></div></div>'+
    '<div class="kpi"><div class="k">의뢰 병원</div><div class="v">'+rows.filter(function(r){return r.a;}).length+'<small>곳</small></div></div></div>'+
  '<div class="stats-grid"><section class="surface pane">'+
    (top?'<p class="headline-stat">가장 많이 보낸 곳은 <b>'+esc(top.h.name)+'</b>입니다. 최근 30일 <b class="num">'+top.a+'</b>건, 그 전 30일 <span class="num">'+top.b+'</span>건.</p>':'')+
    '<div class="legend"><span><i style="background:var(--accent)"></i>최근 30일</span><span><i style="background:var(--line)"></i>직전 30일</span></div>'+
    '<div class="chart" id="chart"></div></section>'+
  '<section class="surface pane"><div class="rec-h"><h3>병원별 상세</h3></div><ul class="rank">'+
    rows.map(function(r){var d=r.a-r.b;return '<li><div><div class="nm">'+esc(r.h.name)+'</div><div class="ar">'+esc(r.h.area)+' · 평균 회신 '+(r.avg==null?"-":r.avg.toFixed(1)+'일')+(r.late?' · <span style="color:var(--warn);font-weight:600">지연 '+r.late+'건</span>':'')+'</div></div>'+
      '<div><div class="v">'+r.a+'건</div><div class="dl'+(d>0?" up":"")+'">'+(d>0?"+"+d:d<0?String(d):"변동 없음")+'</div></div></li>';}).join("")+
  '</ul>'+
  '<div class="rec-h" style="margin-top:22px"><h3>최근 30일 분과 구성</h3></div><div class="mix">'+mixArr.map(function(m){return '<span>'+esc(m[0])+'<b>'+m[1]+'</b></span>';}).join("")+'</div>'+
  '<p class="foot-note">평균 회신은 직전 60일 안에 접수돼 회신 완료된 건만 셉니다. 지연은 회신 대기 '+LATE+'일 이상입니다.</p></section></div>';
  $main.innerHTML=h;
  var css=getComputedStyle(document.documentElement);
  function v(n){return css.getPropertyValue(n).trim();}
  function draw(){
    var el=document.getElementById("chart");if(!el||cur.view!=="stats")return;
    var W=Math.max(260,Math.floor(el.clientWidth));
    var max=Math.max(1,Math.max.apply(null,rows.map(function(r){return Math.max(r.a,r.b);})));
    var numW=34,bh=12,gap=4,rowH=62,top=6,barW=W-numW;
    var H=top+rows.length*rowH;
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="병원별 의뢰 건수, 최근 30일과 직전 30일 비교">';
    rows.forEach(function(r,i){
      var y=top+i*rowH;
      s+='<text x="0" y="'+(y+14)+'" font-size="15" font-weight="600" fill="'+v("--ink")+'">'+esc(r.h.name)+'</text>';
      s+='<text x="'+W+'" y="'+(y+14)+'" font-size="13" text-anchor="end" fill="'+v("--mute")+'">'+esc(r.h.area)+'</text>';
      var y1=y+24,y2=y1+bh+gap;
      var w1=Math.max(r.a?barW*r.a/max:0,r.a?4:0),w2=Math.max(r.b?barW*r.b/max:0,r.b?4:0);
      s+='<rect x="0" y="'+y1+'" width="'+w1+'" height="'+bh+'" rx="3" fill="'+v("--accent")+'"/>';
      s+='<text x="'+(w1+6)+'" y="'+(y1+bh-1)+'" font-size="13" font-weight="600" font-family="IBM Plex Mono, monospace" fill="'+v("--ink")+'">'+r.a+'</text>';
      s+='<rect x="0" y="'+y2+'" width="'+w2+'" height="'+bh+'" rx="3" fill="'+v("--line")+'"/>';
      s+='<text x="'+(w2+6)+'" y="'+(y2+bh-1)+'" font-size="13" font-family="IBM Plex Mono, monospace" fill="'+v("--mute")+'">'+r.b+'</text>';
    });
    el.innerHTML=s+'</svg>';
  }
  draw();window.onresize=draw;
}

/* ---------- 공지 작성 ---------- */
var NT={
  shift:{t:"근무표 변경",d:"야간·주말 근무 교대",title:"근무표 변경 안내",
    f:[["when","해당 날짜","예: 10월 24일 야간"],["what","변경 내용","예: 응급의학 정○○ → 내과 한○○로 교대"],["why","사유","예: 학회 참석"]],
    body:function(v){return [v.when&&"일시: "+v.when,v.what&&"변경: "+v.what,v.why&&"사유: "+v.why];},
    close:"변경된 근무표는 오늘 중 공용 근무표에도 반영해 두겠습니다. 교대 당사자분들은 인수인계 내용을 미리 맞춰 주시기 바랍니다."},
  or:{t:"수술방 일정",d:"수술 순서와 준비",title:"수술방 일정 공유",
    f:[["when","날짜, 수술실","예: 10월 21일 1번 수술실"],["what","수술 일정","예: 09:30 슬개골 탈구 교정(포메라니안) / 13:00 비장 적출(골든 리트리버)"],["why","준비 사항","예: 혈액형 검사 완료, 수혈 대기"]],
    body:function(v){return [v.when&&"일시: "+v.when,v.what&&"일정: "+v.what,v.why&&"준비: "+v.why];},
    close:"기구 소독과 마취 준비는 전날 마감 전까지 확인 부탁드립니다. 일정이 바뀌면 바로 다시 공지하겠습니다."},
  drug:{t:"마약류 점검",d:"재고·기록 확인",title:"마약류 관리 점검 안내",
    f:[["when","점검 일자, 담당","예: 10월 30일 마감 후, 담당 내과 김○○"],["what","점검 범위","예: 마약류 보관함 실재고와 사용 기록 대조"],["why","협조 요청","예: 이번 주 사용분 기록 누락 여부 확인"]],
    body:function(v){return [v.when&&"일시: "+v.when,v.what&&"범위: "+v.what,v.why&&"요청: "+v.why];},
    close:"사용 기록과 실재고가 맞지 않는 건이 있으면 점검 전에 담당자에게 바로 알려 주십시오. 마약류 보관함 열쇠는 지정된 담당자만 관리합니다."},
  equip:{t:"장비 점검",d:"사용 중지 시간 안내",title:"장비 점검 안내",
    f:[["when","장비와 위치","예: CT, 영상의학실"],["what","점검 일시","예: 10월 23일 14:00~16:00"],["why","점검 중 대체 방법","예: 응급 영상은 방사선·초음파로 우선 진행"]],
    body:function(v){return [v.when&&"장비: "+v.when,v.what&&"일시: "+v.what,v.why&&"점검 중: "+v.why];},
    close:"점검 시간에 잡힌 검사가 있으면 미리 일정을 조정해 주시기 바랍니다."},
  edu:{t:"교육·회의",d:"원내 교육, 케이스 회의",title:"원내 교육 안내",
    f:[["when","일시, 장소","예: 10월 28일 13:00, 3층 회의실"],["what","주제, 발표자","예: 수혈 반응 대처, 응급의학 정○○"],["why","대상, 준비물","예: 전 수의사·테크니션, 준비물 없음"]],
    body:function(v){return [v.when&&"일시: "+v.when,v.what&&"주제: "+v.what,v.why&&"대상: "+v.why];},
    close:"근무 중인 분은 교대 조율 후 참석 부탁드립니다. 참석이 어려우면 미리 말씀해 주십시오."},
  free:{t:"자유 형식",d:"직접 항목 입력",title:"공지",
    f:[["when","항목 1",""],["what","항목 2",""],["why","항목 3",""]],
    body:function(v){return [v.when,v.what,v.why];},close:""}
};
var AUD=["전체 직원","수의사","테크니션","야간 근무자","수술팀"];
var nd={type:"or",aud:"전체 직원",lead:"",when:"",what:"",why:"",who:"원장 장승훈",ack:true};
function noticeText(){
  var t=NT[nd.type],L=[];
  L.push("["+t.title+"]");
  L.push("대상: "+nd.aud);
  L.push("");
  if(nd.lead.trim())L.push(nd.lead.trim(),"");
  var b=t.body(nd).filter(function(x){return x&&String(x).trim();});
  b.forEach(function(x){L.push("- "+x);});
  if(b.length)L.push("");
  if(t.close)L.push(t.close);
  if(nd.ack)L.push("","확인하신 분은 '확인' 답장 부탁드립니다.");
  if(nd.who.trim())L.push("","- "+nd.who.trim());
  return L.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}
function renderNotice(){
  var t=NT[nd.type];
  var h='<h2 class="h">공지 작성</h2><p class="lead">종류를 고르고 칸을 채우면 직원 단톡방에 붙일 문안이 만들어집니다.</p>'+
  '<div class="ngrid"><section class="surface pane"><div class="tpls" role="group" aria-label="공지 종류">'+
    Object.keys(NT).map(function(k){return '<button data-t="'+k+'" aria-pressed="'+(k===nd.type)+'"><b>'+NT[k].t+'</b><span>'+NT[k].d+'</span></button>';}).join("")+'</div>'+
    '<form id="nf" autocomplete="off" onsubmit="return false">'+
    '<div class="field"><span>받는 사람</span><div class="aud">'+AUD.map(function(a){return '<label><input type="radio" name="aud" value="'+a+'"'+(a===nd.aud?" checked":"")+'><span>'+a+'</span></label>';}).join("")+'</div></div>'+
    '<label class="field"><span>첫 문장<em>한두 문장</em></span><textarea name="lead" rows="2" placeholder="예: 다음 주 수술방 일정을 공유드립니다.">'+esc(nd.lead)+'</textarea></label>'+
    t.f.map(function(f){return '<label class="field"><span>'+f[1]+'</span><input type="text" name="'+f[0]+'" value="'+esc(nd[f[0]])+'" placeholder="'+esc(f[2])+'"></label>';}).join("")+
    '<label class="field"><span>보내는 사람</span><input type="text" name="who" value="'+esc(nd.who)+'"></label>'+
    '<label class="check"><input type="checkbox" name="ack"'+(nd.ack?" checked":"")+'>확인 답장 요청 문구 넣기</label>'+
    '</form></section>'+
  '<section class="stick"><div class="surface pane"><div class="rec-h"><h3>공지 문안</h3><span>직접 고쳐도 됩니다</span></div>'+
    '<textarea class="out" id="nout" aria-label="공지 문안"></textarea>'+
    '<div class="out-actions"><button class="btn" id="ncp">'+ic("copy","s")+'복사</button><button class="btn line" id="nclr">비우기</button></div></div></section></div>';
  $main.innerHTML=h;
  var nf=document.getElementById("nf"),out=document.getElementById("nout");
  function build(){out.value=noticeText();}
  nf.addEventListener("input",function(e){var el=e.target;if(!el.name)return;nd[el.name]=el.type==="checkbox"?el.checked:el.value;build();});
  nf.addEventListener("change",function(e){var el=e.target;if(el.name==="aud"||el.name==="ack"){nd[el.name]=el.type==="checkbox"?el.checked:el.value;build();}});
  each(".tpls button",function(b){b.onclick=function(){var k=b.getAttribute("data-t");if(k===nd.type)return;nd.type=k;nd.when=nd.what=nd.why="";forceMain=true;render(cur);};},$main);
  document.getElementById("ncp").onclick=function(){copy(out.value);};
  document.getElementById("nclr").onclick=function(){nd.lead=nd.when=nd.what=nd.why="";forceMain=true;render(cur);};
  build();
}

/* ---------- 시작 ---------- */
load();
if(!db.savedAt)save();
history.replaceState({app:1,base:1},"");
history.pushState({app:1,view:"board",col:0},"");
render({view:"board",col:0});
})();
</script>
