<body>
<div class="edu">교육용 예시 화면입니다. 진료 판단에 쓰는 프로그램이 아니며, 판매하지 않습니다. 환자·보호자 이름과 병원 연락처는 모두 지어낸 것이며, 입력하신 내용은 이 기기에만 저장됩니다.</div>

<div class="wrap idline"><span><b>윤대영 원장님을 위한 시제품</b> · 솔동물의료센터</span><span>가상 데이터입니다</span></div>

<footer class="foot"><div class="wrap">원장을 위한 AI 실전 교육 1기 · 틀의 문구는 교육 당일 병원에서 쓰시는 안내문에 맞게 함께 고칩니다. 서버로 보내는 내용은 없습니다.</div></footer>

function pad(n){return (n<10?"0":"")+n}
function isoOf(t){return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}
function addD(s,k){var p=s.split("-");return isoOf(new Date(+p[0],+p[1]-1,+p[2]+k))}
var WD=["일","월","화","수","목","금","토"];
function dl(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return "";var p=s.split("-"),t=new Date(+p[0],+p[1]-1,+p[2]);return p[0]+"년 "+(+p[1])+"월 "+(+p[2])+"일("+WD[t.getDay()]+")"}
function stamp(ts){var t=new Date(ts);return (t.getMonth()+1)+"월 "+t.getDate()+"일 "+pad(t.getHours())+":"+pad(t.getMinutes())}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

  h+=hf("name","병원 이름",H.name)+hf("addr","주소",H.addr)+'<div class="grid2">'+hf("tel","대표 전화",H.tel)+hf("hours","진료 시간",H.hours)+'</div>';
  h+='<div class="fld" style="margin-top:10px"><label for="h-foot">맨 아래 작은 글씨</label><textarea id="h-foot" data-h="foot" rows="2">'+esc(H.foot)+'</textarea></div></fieldset>';
  h+='<fieldset class="fset"><legend>이 기기의 자료</legend><p class="lead" style="margin-bottom:12px">안내문은 이 기기의 브라우저에만 저장됩니다. 처음 예시로 되돌리면 만든 안내문이 모두 지워집니다.</p><div class="btns"><button class="btn warn sm" data-act="reset">처음 예시로 되돌리기</button></div></fieldset></div>';
  return h;
}
function hf(k,l,v){return '<div class="fld"><label for="h-'+k+'">'+l+'</label><input id="h-'+k+'" data-h="'+k+'" value="'+esc(v)+'" autocomplete="off"></div>'}

function renderPrint(){
  var el=document.getElementById("print"),d=view.tab==="edit"?doc(view.id):null;
  el.innerHTML=d?pageHTML(d):"";
}

/* ---------- 동작 ---------- */
var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},2800)}
function arm(b,msg){
  if(b.dataset.armed==="1")return true;
  var old=b.textContent;b.dataset.armed="1";b.textContent=msg;
  setTimeout(function(){if(b.isConnected){b.dataset.armed="";b.textContent=old}},4000);
  return false;
}
var st;function saveSoon(){clearTimeout(st);st=setTimeout(save,300)}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.dataset.act,d;
  if(a==="tab"){
    var t=b.dataset.t;
    if(t==="edit"){var id=ui.last&&doc(ui.last)?ui.last:(S.docs[0]&&S.docs[0].id);go({tab:"edit",id:id||null})}
    else go({tab:t});
  }
  else if(a==="pick"){var fr=ui.dupFrom?doc(ui.dupFrom):null;ui.dupFrom=null;d=newDoc(b.dataset.k,fr);save();ui.pane="form";go({tab:"edit",id:d.id});toast(fr?(fr.f.pet||"같은 환자")+" 정보를 넣어 "+TPL[d.tpl].name+" 틀을 열었습니다":TPL[d.tpl].name+" 틀을 열었습니다. 빈칸을 채워 주십시오")}
  else if(a==="open"){ui.pane="form";go({tab:"edit",id:b.dataset.id})}
  else if(a==="pane"){ui.pane=b.dataset.p;render();window.scrollTo(0,0)}
  else if(a==="print"){renderPrint();window.print()}
  else if(a==="dup"||a==="dupid"){
    var src=doc(a==="dup"?view.id:b.dataset.id);if(!src)return;ui.dupFrom=src.id;go({tab:"new"});render();
  }
  else if(a==="nodup"){ui.dupFrom=null;render()}
  else if(a==="del"){if(arm(b,"한 번 더 누르시면 지웁니다")){S.docs=S.docs.filter(function(z){return z.id!==b.dataset.id});if(ui.last===b.dataset.id)ui.last=null;save();render();toast("안내문을 지웠습니다")}}
  else if(a==="cadd"){d=doc(view.id);d.f.costs.push(["",""]);d.at=Date.now();save();render();var ins=document.querySelectorAll('[data-cost][data-c="0"]');if(ins.length)ins[ins.length-1].focus()}
  else if(a==="crm"){d=doc(view.id);d.f.costs.splice(+b.dataset.i,1);if(!d.f.costs.length)d.f.costs.push(["",""]);d.at=Date.now();save();render()}
  else if(a==="reset"){if(arm(b,"한 번 더 누르시면 모두 지웁니다")){seed();save();ui.last=null;render();toast("처음 예시 자료로 되돌렸습니다")}}
});
document.addEventListener("input",function(e){
  var t=e.target,d;
  if(t.dataset.f){d=doc(view.id);if(!d)return;d.f[t.dataset.f]=t.value;d.at=Date.now();saveSoon();refreshPreview()}
  else if(t.dataset.cost!=null){d=doc(view.id);if(!d)return;d.f.costs[+t.dataset.cost][+t.dataset.c]=t.value;d.at=Date.now();saveSoon();refreshPreview()}
  else if(t.dataset.h){S.hosp[t.dataset.h]=t.value;saveSoon()}
  else if(t.id==="q"){ui.q=t.value;var pos=t.selectionStart;render();var q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}
});
document.addEventListener("change",function(e){if(e.target.dataset.h)toast("병원 정보를 바꿨습니다. 모든 안내문에 반영됩니다")});
window.addEventListener("resize",function(){if(view.tab==="edit")fit()});
window.addEventListener("beforeprint",renderPrint);
window.addEventListener("pagehide",save);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(view.tab==="edit")fit()});

render();
})();
</script>
</body>
</html>
