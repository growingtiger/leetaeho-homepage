<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<title>진료과별 근무표 · 권정현 원장님을 위한 시제품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&family=Gothic+A1:wght@400;500;700&display=swap">
<style>
/* 유튜브 보드와 같은 계열(종이색·먹색·함렛+고딕A1·4px 모서리).
   근무표는 표가 주인공이라 주홍은 '모자람'과 주 버튼에만 쓰고, 근무 구분은 글자로 한다. */
:root{
  --bg:#f5f2ec; --paper:#fffdf9; --sunk:#ede8df;
  --ink:#1d1a16; --ink-2:#48423a; --ink-3:#6a6357;
  --rule:#d9d1c3; --rule-2:#e9e3d8;
  --acc:#b23d1c; --acc-ink:#fff8f4; --acc-wash:#f5e2d9;
  --ok:#2d6a4c; --hatch:#d3cab9;
  --scrim:rgb(29 26 22 / .42);
  --serif:"Hahmlet","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:4px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16140f; --paper:#1e1b16; --sunk:#25211b;
  --ink:#ede7dc; --ink-2:#c6beb0; --ink-3:#9d9587;
  --rule:#3a342a; --rule-2:#2b2720;
  --acc:#ea8a66; --acc-ink:#1d120c; --acc-wash:#3b241a; --ok:#7cc29e; --hatch:#3d372d;
  --scrim:rgb(0 0 0 / .6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16140f; --paper:#1e1b16; --sunk:#25211b;
  --ink:#ede7dc; --ink-2:#c6beb0; --ink-3:#9d9587;
  --rule:#3a342a; --rule-2:#2b2720;
  --acc:#ea8a66; --acc-ink:#1d120c; --acc-wash:#3b241a; --ok:#7cc29e; --hatch:#3d372d;
  --scrim:rgb(0 0 0 / .6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;overflow-x:hidden}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}
@media(min-width:768px){.wrap{padding-inline:32px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* 머리 */
.note{font-size:13px;color:var(--ink-3);line-height:1.5;padding-top:10px;display:flex;flex-wrap:wrap;gap:0 14px}
.note b{font-weight:500;color:var(--ink-2)}
.mast{padding-top:18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px}
.mast h1{font-family:var(--serif);font-weight:600;font-size:25px;letter-spacing:-.02em;line-height:1.2}
.mast h1 span{display:block;font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.08em;color:var(--acc);margin-bottom:4px}
@media(min-width:768px){.mast h1{font-size:34px}}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-3)}
.who select{width:auto;min-width:0;max-width:220px;min-height:42px;padding:6px 10px;font-size:15px}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);margin-top:14px}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1 1 0;min-width:0;border:0;background:none;min-height:50px;padding:6px 2px 4px;font-size:15px;font-weight:500;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button .c{font-size:12px;margin-left:3px;font-weight:700;color:var(--acc)}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:700}
@media(max-width:380px){nav.tabs button{font-size:14px}}
@media(min-width:768px){nav.tabs button{flex:0 0 auto;padding:6px 18px 4px;font-size:16px}nav.tabs button:first-child{padding-left:0}}

main{padding-top:22px;padding-bottom:64px}
.lede{margin-bottom:16px}
.lede h2{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:-.01em}
.lede p{font-size:15px;color:var(--ink-2);max-width:46em;margin-top:6px}
.sub{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);margin:30px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:baseline}
.sub .r{margin-left:auto;font-weight:400;letter-spacing:0}

/* 버튼·입력 */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--rule);background:var(--paper);font-size:15px;font-weight:500;line-height:1.25;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{min-height:40px;padding:6px 11px;font-size:14px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.link{border:0;background:none;padding:0;color:var(--acc);text-decoration:underline;text-underline-offset:3px;font-weight:500;min-height:44px}
label.f{display:block;font-size:14px;color:var(--ink-2);font-weight:500;margin-bottom:5px}
input[type=text],input[type=date],select,textarea{width:100%;min-height:46px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);padding:10px 12px;font-size:16px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-wash)}
.grid{display:grid;gap:12px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr 1fr 1fr}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.add{background:var(--paper);border-top:3px solid var(--ink);padding:16px;margin-bottom:8px}
.add h3{font-size:16px;font-weight:700;margin-bottom:10px}
.prev{margin-top:12px;font-size:14.5px;color:var(--ink-2);border-left:3px solid var(--rule);padding:4px 0 4px 12px;line-height:1.6}
.prev.bad{border-left-color:var(--acc)}
.prev b{color:var(--ink)}
.prev .w{color:var(--acc);font-weight:700}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);font-size:15px;cursor:pointer}
.radios input{width:18px;height:18px;accent-color:var(--acc);margin:0}
.radios label:has(input:checked){border-color:var(--ink);font-weight:700}

/* 주간 표 */
.weekbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:12px}
.weekbar .lbl{font-family:var(--serif);font-size:19px;font-weight:600;min-width:9.5em;text-align:center}
.weekbar .sp{flex:1 1 auto}
@media(max-width:520px){.weekbar .lbl{flex:1 1 auto;min-width:0;font-size:17px}.weekbar .sp{display:none}.weekbar .out{width:100%;display:flex;gap:8px}.weekbar .out .btn{flex:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);min-height:38px;padding:4px 11px;font-size:14px;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.chips .gap{width:10px}
.mine{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:10px 0 12px;margin-bottom:14px;font-size:15px}
.mine b{font-weight:700}
.mine .ln{color:var(--ink-2)}

table.wk{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}
table.wk col.cn{width:62px}
table.wk th,table.wk td{padding:0;text-align:center;border-bottom:1px solid var(--rule-2)}
table.wk thead th{font-weight:500;color:var(--ink-3);font-size:12.5px;line-height:1.25;padding:6px 0;border-bottom:2px solid var(--ink)}
table.wk thead th b{display:block;font-family:var(--serif);font-weight:600;font-size:16px;color:var(--ink)}
table.wk thead th.td b,table.wk thead th.td{color:var(--acc)}
table.wk thead th:first-child{text-align:left}
table.wk th[scope=row]{text-align:left;font-weight:500;padding:0 4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.wk tr.v th[scope=row]{font-weight:700}
table.wk tr.me th[scope=row]{box-shadow:inset 3px 0 0 var(--acc);padding-left:7px}
table.wk tr.me td{background:var(--sunk)}
table.wk tr.dh th,table.wk tr.dh td{padding-top:16px;border-bottom:1px solid var(--rule)}
table.wk tr.dh th{font-family:var(--serif);font-weight:600;font-size:15px;text-align:left;white-space:nowrap;overflow:visible}
table.wk tr.dh td{font-size:12.5px;color:var(--ink-3);padding-bottom:4px;vertical-align:bottom}
table.wk tr.dh td .s{display:inline-block;color:var(--acc);font-weight:700;text-decoration:underline wavy;text-underline-offset:3px;padding:0 2px}
table.wk tr.rl td{text-align:left;font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);padding:6px 0 1px;border-bottom:0}
.cell{display:block;width:100%;min-height:38px;border:0;background:none;padding:0;font-size:13px;line-height:38px;white-space:nowrap;position:relative}
.cell:hover{background:var(--sunk)}
.cell.k-off{color:var(--ink-3)}
.cell.k-night{font-weight:700;color:var(--bg);background:var(--ink-2)}
.cell.k-night:hover{background:var(--ink)}
.cell.k-sx{font-weight:700}
.cell.k-lv{color:var(--ink-2);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--hatch) 5px 6px)}
.cell.chg::after{content:"";position:absolute;right:3px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.cell.k-night.chg::after{background:var(--acc-ink)}
@media(min-width:768px){table.wk{font-size:14px}table.wk col.cn{width:120px}.cell{font-size:14.5px;min-height:40px;line-height:40px}table.wk tr.dh td{font-size:13.5px}}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink-3);margin-top:12px;line-height:1.5}
.legend i{display:inline-block;width:22px;height:13px;vertical-align:-2px;margin-right:4px;border-radius:2px}
.legend i.n{background:var(--ink-2)}
.legend i.l{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--hatch) 4px 5px);border:1px solid var(--rule)}
.legend i.c{width:6px;height:6px;border-radius:50%;background:var(--acc);vertical-align:1px}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:9px 0;border-bottom:1px solid var(--rule-2);font-size:15px;line-height:1.55}
ul.plain li .d{font-weight:700;margin-right:8px}
ul.plain li .m{color:var(--ink-3);font-size:14px}
.short-ok{font-size:15px;color:var(--ok);padding:8px 0}
.callwk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--rule)}
.callwk div{padding:8px 4px 8px 0;border-bottom:1px solid var(--rule-2);font-size:13px;line-height:1.4;min-width:0}
.callwk div b{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.callwk div span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:639px){.callwk{grid-template-columns:1fr}.callwk div{display:flex;gap:12px;padding:8px 0}.callwk div b{width:56px;flex:none;font-size:14px;color:var(--ink)}.callwk div span{flex:1;white-space:normal}}

/* 신청 목록 */
ol.req{list-style:none;margin:0;padding:0}
ol.req li{padding:14px 0;border-bottom:1px solid var(--rule-2)}
ol.req .h{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
ol.req .nm{font-size:17px;font-weight:700}
ol.req .dp{font-size:14px;color:var(--ink-3)}
ol.req .when{font-size:15.5px;margin-top:3px}
ol.req .memo{font-size:14.5px;color:var(--ink-2);margin-top:2px}
ol.req .imp{font-size:14px;margin-top:6px;color:var(--ink-2)}
ol.req .imp .w{color:var(--acc);font-weight:700}
ol.req .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-block;font-size:13px;font-weight:500;padding:1px 8px;border-radius:var(--r);background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.wait{background:var(--acc-wash);color:var(--acc)}
.tag.ok{color:var(--ok);background:transparent;border:1px solid currentColor}
.tag.no{background:transparent;border:1px solid var(--rule);color:var(--ink-3)}
.empty{padding:12px 0;font-size:15px;color:var(--ink-3)}
.chg-list{font-size:14.5px;margin-top:6px}
.chg-list div{padding:2px 0}

/* 당직 */
.calllay{display:grid;gap:8px 40px}
@media(min-width:960px){.calllay{grid-template-columns:repeat(3,minmax(0,1fr))}}
table.on{width:100%;border-collapse:collapse;font-size:15px}
table.on td{padding:9px 6px 9px 0;border-bottom:1px solid var(--rule-2);vertical-align:middle}
table.on td.dt{white-space:nowrap;width:1%;padding-right:12px;color:var(--ink-2)}
table.on td.dt.td{color:var(--acc);font-weight:700}
table.on td .nm{font-weight:700}
table.on td .x{display:block;font-size:13px;color:var(--ink-3)}
table.on td .x.w{color:var(--acc);font-weight:700}
table.on td.ac{text-align:right;width:1%;white-space:nowrap}
details.ord{margin-top:10px;border-top:1px solid var(--rule)}
details.ord summary{min-height:44px;display:flex;align-items:center;font-size:14.5px;color:var(--ink-2);cursor:pointer;list-style:none}
details.ord summary::-webkit-details-marker{display:none}
details.ord summary::before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin-right:10px;transition:transform .15s}
details.ord[open] summary::before{transform:rotate(45deg)}
ol.ordl{margin:0;padding:0;list-style:none;counter-reset:o}
ol.ordl li{counter-increment:o;display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--rule-2);font-size:15px}
ol.ordl li::before{content:counter(o);font-family:var(--serif);font-weight:600;color:var(--ink-3);width:1.6em;text-align:right}
ol.ordl li .nm{flex:1;min-width:0}
ol.ordl li .nm small{color:var(--ink-3);font-size:13px;margin-left:6px}
.ib{border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.ib:disabled{opacity:.35;cursor:default}

/* 집계 */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);margin:0 0 18px}
.sum div{padding:12px 10px 12px 0;min-width:0}
.sum div+div{padding-left:12px;border-left:1px solid var(--rule)}
.sum dt{font-size:13px;color:var(--ink-3)}
.sum dd{margin:2px 0 0;font-size:15px;font-weight:700;line-height:1.4}
.sum dd .big{font-family:var(--serif);font-size:24px;font-weight:600;margin-right:2px}
@media(max-width:520px){.sum{grid-template-columns:1fr}.sum div+div{padding-left:0;border-left:0;border-top:1px solid var(--rule-2)}}
table.st{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14.5px}
table.st col.cn{width:30%}
table.st th{font-size:12.5px;font-weight:700;color:var(--ink-3);padding:8px 2px;border-bottom:1px solid var(--rule);text-align:right;line-height:1.3}
table.st th:first-child{text-align:left}
table.st td{padding:8px 2px;border-bottom:1px solid var(--rule-2);text-align:right}
table.st td:first-child{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.st td:first-child small{color:var(--ink-3);font-size:12.5px;margin-left:4px}
table.st tr.g td{font-family:var(--serif);font-weight:600;font-size:15px;padding-top:16px;border-bottom:1px solid var(--rule);text-align:left}
table.st td .hi{font-weight:700;text-decoration:underline;text-underline-offset:3px}
@media(min-width:768px){table.st col.cn{width:28%}table.st{font-size:15px}table.st th{font-size:13px}}

/* 시트(작은 창) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:var(--r) var(--r) 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:3px solid var(--ink)}
@media(min-width:640px){.scrim{align-items:center}.sheet{border-radius:var(--r)}}
.sheet h3{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.35}
.sheet .sm2{font-size:14px;color:var(--ink-3);margin-top:2px}
.sheet .now{margin:14px 0 10px;font-size:15px}
.sheet .now b{font-size:18px}
.sheet .foot2{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:flex-end}

.foot{border-top:1px solid var(--rule);margin-top:40px;padding-top:14px;font-size:13.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:var(--r);font-size:15px;max-width:calc(100vw - 32px);width:max-content;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000;font-size:11pt}
  .note,.who,nav.tabs,.foot,.toast,.noprint,.chips,.scrim{display:none!important}
  .mast{padding-top:0}.mast h1{font-size:18pt}
  main{padding:0}
  .cell{line-height:22px;min-height:22px;color:#000!important;background:none!important}
  .cell.k-night{font-weight:700;text-decoration:underline}
  .cell.k-lv{font-style:italic}
  table.wk tr.me td{background:none}
  table.wk th,table.wk td{border:1px solid #999}
  table.wk tr.rl td{border:0}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap note"><b>모모동물의료센터 · 권정현 원장님을 위한 시제품</b><span>교육용 예시입니다. 직원 이름과 근무는 모두 가상입니다. 입력한 내용은 이 기기의 브라우저에만 저장됩니다.</span></div>
<header class="wrap mast">
  <h1><span>MOMO STAFF ROSTER</span>진료과별 근무표</h1>
  <label class="who noprint">보는 사람 <select id="who" aria-label="보는 사람"></select></label>
</header>
<nav class="tabs" aria-label="화면"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"></main>
<footer class="wrap foot noprint">
  <span>시제품입니다. 실제로 쓰실 때는 직원 모두가 각자 휴대폰에서 보도록 서버 저장소를 붙입니다.</span>

</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var KEY="momo-roster-v1";

/* ---------- 날짜 ---------- */
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12);}
function add(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
var TODAY=iso(new Date());
function dow(s){return (pd(s).getDay()+6)%7;} /* 월=0 … 일=6 */
function monOf(s){return add(s,-dow(s));}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5);}
var WD=["월","화","수","목","금","토","일"];
function kd(s){var d=pd(s);return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[dow(s)]+")";}
function sd(s){var d=pd(s);return (d.getMonth()+1)+"."+d.getDate()+" "+WD[dow(s)];}
function range(a,b){var o=[],d=a;while(d<=b){o.push(d);d=add(d,1);}return o;}
function mod(a,n){return ((a%n)+n)%n;}

/* ---------- 기준 ---------- */
var DEPTS=[
  {id:"im",name:"내과",min:{vet:[1,1,1,1,1,1,0],tech:[1,1,1,1,1,1,0]}},
  {id:"sx",name:"외과",min:{vet:[1,1,1,1,1,1,0],tech:[2,2,2,2,2,1,0]}},
  {id:"dx",name:"영상의학과",short:"영상",min:{vet:[1,1,1,1,1,1,0],tech:[1,1,1,1,1,0,0]}},
  {id:"an",name:"마취과",short:"마취",min:{vet:[1,1,1,1,1,1,0],tech:[1,1,1,1,1,1,0]}},
  {id:"er",name:"응급중환자",min:{vet:[1,1,1,1,1,1,1],tech:[2,2,2,2,2,2,2]}}];
var DN={};DEPTS.forEach(function(d){DN[d.id]=d;});
var CODES={vet:["외래","수술","검사","병동","야간","휴무"],tech:["주간","오후","야간","휴무"]};
var OFF={"휴무":1,"휴가":1,"학회":1};
var KINDS=["연차","학회·교육","병가","경조사"];
var ROLE={vet:"수의사",tech:"테크니션"},RS={vet:"수의사가",tech:"테크니션이"};
var CALLS=[
  {id:"night",name:"평일 야간 호출",who:"수의사",hint:"월–금 21시부터 다음 날 9시까지 응급 수술·중환자 호출을 받습니다."},
  {id:"wkv",name:"주말 호출 · 수의사",who:"수의사",hint:"토·일 낮 진료 시간 밖의 호출을 한 분이 이틀 맡습니다."},
  {id:"wkt",name:"주말 호출 · 수술실",who:"테크니션",hint:"주말 응급 수술이 잡히면 들어오는 외과·마취 테크니션입니다."}];
var CN={};CALLS.forEach(function(c){CN[c.id]=c;});
var ANCHOR="2026-01-05";

/* ---------- 예시 데이터 (모두 가상) ---------- */
function uid(p){return p+Math.random().toString(36).slice(2,9);}
function seed(){
  function S(id,name,dept,role,pat){return {id:id,name:name,dept:dept,role:role,pat:pat.split(" ")};}
  var staff=[
    S("a1","한서윤","im","vet","외래 외래 검사 외래 휴무 외래 휴무"),
    S("a2","남궁민재","im","vet","검사 휴무 외래 외래 외래 병동 휴무"),
    S("a3","양지후","im","vet","병동 외래 휴무 병동 외래 외래 휴무"),
    S("b1","진우석","sx","vet","외래 수술 수술 외래 수술 휴무 휴무"),
    S("b2","표은채","sx","vet","수술 외래 휴무 수술 외래 외래 휴무"),
    S("b3","길도현","sx","vet","병동 휴무 외래 수술 수술 수술 휴무"),
    S("c1","소하람","dx","vet","검사 검사 검사 휴무 검사 검사 휴무"),
    S("c2","임재윤","dx","vet","검사 검사 휴무 검사 검사 검사 휴무"),
    S("d1","주예린","an","vet","수술 수술 수술 휴무 수술 수술 휴무"),
    S("d2","탁시우","an","vet","수술 휴무 수술 수술 수술 수술 휴무"),
    S("e1","변가온","er","vet","병동 병동 병동 휴무 야간 휴무 병동"),
    S("e2","함지율","er","vet","휴무 야간 병동 병동 병동 병동 휴무"),
    S("t1","염다은","im","tech","주간 주간 주간 휴무 주간 주간 휴무"),
    S("t2","공태윤","im","tech","오후 오후 휴무 주간 주간 주간 휴무"),
    S("t3","도서진","sx","tech","주간 주간 주간 주간 휴무 주간 휴무"),
    S("t4","석민호","sx","tech","주간 주간 휴무 주간 주간 주간 휴무"),
    S("t5","국유나","sx","tech","휴무 주간 주간 주간 주간 오후 휴무"),
    S("t6","여은호","dx","tech","주간 주간 주간 주간 주간 휴무 휴무"),
    S("t7","피하윤","an","tech","주간 주간 주간 휴무 주간 주간 휴무"),
    S("t8","채라온","an","tech","주간 휴무 주간 주간 주간 휴무 휴무"),
    S("t9","맹수아","er","tech","주간 주간 야간 야간 휴무 휴무 주간"),
    S("t10","엄도경","er","tech","야간 야간 휴무 휴무 주간 주간 야간"),
    S("t11","감나래","er","tech","휴무 주간 주간 주간 야간 야간 휴무"),
    S("t12","류시온","er","tech","주간 휴무 주간 주간 주간 주간 휴무")];
  var M=monOf(TODAY),N=add(M,7);
  var o={v:1,me:"admin",staff:staff,ov:{},onOv:{},log:[],
    order:{night:["b1","d1","a1","e1","b2","c1","a2","d2","e2","b3","a3","c2"],
      wkv:["a2","b3","e2","c2","d1","a1","b1","e1","d2","a3","b2","c1"],
      wkt:["t3","t7","t4","t8","t5"]},
    leaves:[
      {id:"l1",sid:"c2",kind:"연차",from:add(N,3),to:add(N,3),memo:"가족 행사",status:"wait",at:add(TODAY,-1)},
      {id:"l2",sid:"t11",kind:"학회·교육",from:add(N,1),to:add(N,2),memo:"외부 중환자 간호 교육",status:"wait",at:add(TODAY,-2)},
      {id:"l3",sid:"c1",kind:"연차",from:add(M,4),to:add(M,4),memo:"",status:"ok",at:add(M,-6)},
      {id:"l4",sid:"b1",kind:"학회·교육",from:add(N,11),to:add(N,12),memo:"외부 학회 발표",status:"ok",at:add(M,-3)},
      {id:"l5",sid:"a2",kind:"연차",from:add(M,-7),to:add(M,-6),memo:"",status:"ok",at:add(M,-20)},
      {id:"l6",sid:"t4",kind:"연차",from:add(N,4),to:add(N,4),memo:"",status:"no",reply:"같은 날 외과 테크니션 휴가가 먼저 잡혀 있습니다. 다른 날로 다시 신청해 주십시오.",at:add(TODAY,-4)}],
    swaps:[]};
  /* 승인된 근무 바꾸기 1건: 이번 주 수요일 염다은 ↔ 공태윤 */
  var w=add(M,2);o.ov["t1|"+w]="휴무";o.ov["t2|"+w]="주간";
  o.swaps.push({id:"s1",type:"shift",a:"t1",b:"t2",d1:w,d2:"",memo:"병원 방문 일정",status:"ok",at:add(M,-2)});
  o.log.push({at:add(M,-2),txt:"근무 바꾸기 승인 · 염다은 ↔ 공태윤 · "+kd(w)});
  o.log.push({at:add(M,-6),txt:"휴가 승인 · 소하람 연차 · "+kd(add(M,4))});
  o.swaps.push({id:"s2",type:"shift",a:"b2",b:"b3",d1:add(N,2),d2:"",memo:"수술 환자 경과 확인 때문에 수요일에 나오고 싶습니다",status:"wait",at:add(TODAY,-1)});
  return o;
}
var db;
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.v===1&&Array.isArray(o.staff)){db=o;return;}}}catch(e){}db=seed();seedCallSwap();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
/* 승인된 당직 바꾸기 1건은 순번 계산이 필요해 따로 넣는다 */
function seedCallSwap(){
  var d=add(monOf(TODAY),8),a=callBase("night",d),i=db.order.night.indexOf(a),b=db.order.night[mod(i+3,db.order.night.length)];
  db.onOv["night|"+d]=b;
  db.swaps.push({id:"s3",type:"call",a:a,b:b,d1:d,d2:"",memo:"",status:"ok",at:add(TODAY,-3)});
  db.log.unshift({at:add(TODAY,-3),txt:"당직 바꾸기 승인 · "+nm(a)+" → "+nm(b)+" · "+kd(d)+" 야간 호출"});
}

/* ---------- 계산 ---------- */
function person(id){for(var i=0;i<db.staff.length;i++)if(db.staff[i].id===id)return db.staff[i];return null;}
function nm(id){var p=person(id);return p?p.name:"";}
function dname(id,short){var d=DN[id];return short&&d.short?d.short:d.name;}
function leaveOn(sid,d){for(var i=0;i<db.leaves.length;i++){var l=db.leaves[i];if(l.status==="ok"&&l.sid===sid&&l.from<=d&&l.to>=d)return l;}return null;}
function base(sid,d){var o=db.ov[sid+"|"+d];return o||person(sid).pat[dow(d)];}
function code(sid,d){var l=leaveOn(sid,d);if(l)return l.kind==="학회·교육"?"학회":"휴가";return base(sid,d);}
function works(c){return !OFF[c];}
function members(dept,role){return db.staff.filter(function(p){return p.dept===dept&&(!role||p.role===role);});}
function count(dept,role,d,skip){var n=0;members(dept,role).forEach(function(p){if(p.id!==skip&&works(code(p.id,d)))n++;});return n;}
function minOf(dept,role,d){return DN[dept].min[role][dow(d)];}
/* 한 사람이 그날 빠지면 과 인원이 모자라는지 */
function lackIf(sid,d){var p=person(sid);if(!works(code(sid,d)))return null;var n=count(p.dept,p.role,d,sid),m=minOf(p.dept,p.role,d);return n<m?{n:n,m:m}:null;}
function shortList(days){var out=[];days.forEach(function(d){DEPTS.forEach(function(dp){["vet","tech"].forEach(function(r){var n=count(dp.id,r,d),m=minOf(dp.id,r,d);if(n<m)out.push({d:d,dept:dp.id,role:r,n:n,m:m});});});});return out;}
/* 당직 순번 */
function callDay(id,d){var w=dow(d);return id==="night"?w<5:w>=5;}
function callBase(id,d){var ord=db.order[id];if(!ord.length)return "";var k=diff(ANCHOR,d),wk=Math.floor(k/7);return ord[mod(id==="night"?wk*5+dow(d):wk,ord.length)];}
function callWho(id,d){if(!callDay(id,d))return "";return db.onOv[id+"|"+d]||callBase(id,d);}
function callsOf(sid,d){var o=[];CALLS.forEach(function(c){if(callWho(c.id,d)===sid)o.push(c.id);});return o;}
function nextCall(sid){for(var i=0;i<60;i++){var d=add(TODAY,i),c=callsOf(sid,d);if(c.length)return {d:d,c:c[0]};}return null;}
function isAdmin(){return db.me==="admin";}

/* ---------- 도우미 ---------- */
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
var tt;function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on");},2800);}
function span(a,b){if(a===b)return kd(a)+" 하루";var n=diff(a,b)+1;var pa=pd(a),pb=pd(b);return kd(a)+" – "+(pa.getMonth()===pb.getMonth()?pb.getDate()+"일 ("+WD[dow(b)]+")":kd(b))+" · "+n+"일";}
function staffOpts(sel,role,skip){return DEPTS.map(function(dp){var ps=members(dp.id,role).filter(function(p){return p.id!==skip;});if(!ps.length)return "";return '<optgroup label="'+dp.name+'">'+ps.map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?" selected":"")+'>'+esc(p.name)+' · '+ROLE[p.role]+'</option>';}).join("")+'</optgroup>';}).join("");}
function logit(t){db.log.unshift({at:TODAY,txt:t});if(db.log.length>40)db.log.length=40;}
var ICON={l:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',r:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  u:'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',dn:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'};
function csv(name,rows){
  var t="﻿"+rows.map(function(r){return r.map(function(c){c=String(c==null?"":c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",");}).join("\r\n");
  var u=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},800);toast(name+" 파일을 내려받았습니다");}

/* ---------- 화면 이동 (뒤로가기로 앱이 닫히지 않게) ---------- */
var TABS=[["week","주간 표"],["call","당직"],["leave","휴가"],["swap","바꾸기"],["stat","집계"]];
var cur={view:"week"};
var ui={wk:monOf(TODAY),dept:"all",role:"all",month:TODAY.slice(0,7),swapType:"shift",pre:null};
function go(s){cur=s;history.pushState({app:1,s:s},"");render(true);}
function openSheet(m){cur={view:cur.view,modal:m};history.pushState({app:1,s:cur},"");render();}
function closeSheet(){if(cur.modal)history.back();}
/* 시트에서 다른 화면으로 갈 때는 시트 기록을 새 화면으로 바꿔 끼운다 → 뒤로가기는 주간 표로 */
function swapTo(s){cur=s;history.replaceState({app:1,s:s},"");render(true);}
window.addEventListener("popstate",function(e){
  var st=e.state||{};
  if(!st.app||st.base){
    var atFirst=cur.view==="week"&&!cur.modal;
    history.pushState({app:1,s:{view:"week"}},"");
    if(atFirst)toast("앱을 닫으려면 홈 화면으로 나가 주십시오");
    else{cur={view:"week"};render(true);}
    return;
  }
  var was=cur.view;cur=st.s||{view:"week"};render(cur.view!==was);
});
history.replaceState({app:1,base:1},"");
history.pushState({app:1,s:cur},"");

/* ---------- 그리기 ---------- */
function renderWho(){
  $("#who").innerHTML='<option value="admin"'+(isAdmin()?" selected":"")+'>원장·팀장 (승인)</option>'+staffOpts(db.me);
}
function renderTabs(){
  var cnt={leave:db.leaves.filter(function(l){return l.status==="wait";}).length,swap:db.swaps.filter(function(s){return s.status==="wait";}).length};
  $("#tabs").innerHTML=TABS.map(function(t){return '<button type="button" data-tab="'+t[0]+'"'+(t[0]===cur.view?' aria-current="page"':'')+'>'+t[1]+(cnt[t[0]]?'<span class="c num" aria-label="대기 '+cnt[t[0]]+'건">'+cnt[t[0]]+'</span>':'')+'</button>';}).join("");
}
function render(scroll){
  renderTabs();
  var m=$("#main");
  m.innerHTML=cur.view==="call"?vCall():cur.view==="leave"?vLeave():cur.view==="swap"?vSwap():cur.view==="stat"?vStat():vWeek();
  if(cur.view==="leave")leavePrev();
  if(cur.view==="swap")swapPrev();
  $("#sheetRoot").innerHTML=cur.modal?vSheet(cur.modal):"";
  document.body.classList.toggle("lock",!!cur.modal);
  if(cur.modal){var f=document.querySelector(".sheet");if(f)f.focus();}
  if(scroll)window.scrollTo(0,0);
}

/* 주간 표 */
function vWeek(){
  var days=range(ui.wk,add(ui.wk,6)),me=isAdmin()?null:person(db.me);
  var last=days[6],lbl=pd(ui.wk).getMonth()===pd(last).getMonth()?(pd(ui.wk).getMonth()+1)+"월 "+pd(ui.wk).getDate()+"일 – "+pd(last).getDate()+"일":sd(ui.wk).split(" ")[0].replace(".","월 ")+"일 – "+sd(last).split(" ")[0].replace(".","월 ")+"일";
  var h='<div class="lede"><h2>주간 근무표</h2><p>'+(isAdmin()?"칸을 누르시면 그날 근무를 고치실 수 있습니다. 과 이름 줄의 숫자는 그날 나오는 수의사·테크니션 인원입니다.":"내 이름 줄의 칸을 누르시면 그날 근무 바꾸기나 휴가를 바로 신청하실 수 있습니다.")+'</p></div>';
  h+='<div class="weekbar"><button class="btn sm noprint" data-wk="-7" aria-label="이전 주">'+ICON.l+'</button><span class="lbl num">'+lbl+'</span><button class="btn sm noprint" data-wk="7" aria-label="다음 주">'+ICON.r+'</button>'+
    (ui.wk!==monOf(TODAY)?'<button class="btn sm ghost noprint" data-wk="0">이번 주</button>':'')+'<span class="sp"></span><span class="out noprint"><button class="btn sm" data-print>인쇄</button><button class="btn sm" data-csv="week">CSV 내려받기</button></span></div>';
  if(me){
    var nc=nextCall(me.id);
    h+='<div class="mine"><b>'+esc(me.name)+'</b> 님 '+(ui.wk===monOf(TODAY)?"이번 주":"이 주")+' · <span class="ln">'+days.map(function(d){return WD[dow(d)]+" "+code(me.id,d);}).join(" · ")+'</span>'+
      (nc?'<div class="ln">다음 당직: <b>'+kd(nc.d)+'</b> '+CN[nc.c].name+'</div>':'')+'</div>';
  }
  h+='<div class="chips noprint" role="group" aria-label="진료과 고르기"><button data-dept="all" aria-pressed="'+(ui.dept==="all")+'">모든 과</button>'+DEPTS.map(function(d){return '<button data-dept="'+d.id+'" aria-pressed="'+(ui.dept===d.id)+'">'+dname(d.id,1)+'</button>';}).join("")+
    '<span class="gap"></span><button data-role="all" aria-pressed="'+(ui.role==="all")+'">모두</button><button data-role="vet" aria-pressed="'+(ui.role==="vet")+'">수의사</button><button data-role="tech" aria-pressed="'+(ui.role==="tech")+'">테크니션</button></div>';

/* 바꾸기 */
function swapCalc(s){
  var A=person(s.a),B=person(s.b);
  if(!A||!B)return {err:"두 분을 골라 주십시오."};
  if(s.a===s.b)return {err:"서로 다른 두 분을 골라 주십시오."};
  if(!s.d1)return {err:"날짜를 골라 주십시오."};
  if(s.type==="shift"){
    if(A.role!==B.role)return {err:"근무는 같은 직종끼리만 바꾸실 수 있습니다."};
    var ch=[],ds=[s.d1].concat(s.d2&&s.d2!==s.d1?[s.d2]:[]);
    for(var i=0;i<ds.length;i++){var d=ds[i];if(leaveOn(s.a,d)||leaveOn(s.b,d))return {err:kd(d)+"에 휴가가 잡혀 있어 바꾸실 수 없습니다."};
      var ca=code(s.a,d),cb=code(s.b,d);if(ca!==cb)ch.push({d:d,a:ca,b:cb});}
    if(!ch.length)return {err:"두 분의 근무가 같아 바꿀 것이 없습니다."};
    var warn=[];
    /* 과가 다르면 바뀐 뒤 인원 확인 */
    ch.forEach(function(c){if(A.dept!==B.dept){[[A,c.a,c.b],[B,c.b,c.a]].forEach(function(x){if(works(x[1])&&!works(x[2])){var n=count(x[0].dept,x[0].role,c.d)-1,m=minOf(x[0].dept,x[0].role,c.d);if(n<m)warn.push(kd(c.d)+" "+DN[x[0].dept].name+" "+RS[x[0].role]+" "+n+"명이 됩니다");}});}});
    return {ch:ch,warn:warn};
  }
  var c=null;CALLS.forEach(function(x){if(!c&&callWho(x.id,s.d1)===s.a)c=x.id;});
  if(!c)return {err:kd(s.d1)+"에는 "+A.name+" 님의 당직이 없습니다. 당직 화면에서 날짜를 확인해 주십시오."};
  if(s.d2&&callWho(c,s.d2)!==s.b)return {err:kd(s.d2)+"에는 "+B.name+" 님의 "+CN[c].name+" 당직이 없습니다."};
  if(leaveOn(s.b,s.d1))return {err:B.name+" 님이 "+kd(s.d1)+"에 휴가 중입니다."};
  var pool=db.order[c];if(pool.indexOf(s.b)<0)return {err:B.name+" 님은 "+CN[c].name+" 순번에 없습니다."};
  return {call:c};
}

  var A=nm(s.a),B=nm(s.b);
  if(r.err)return '<span class="w">'+esc(r.err)+'</span>';
  if(r.call)return kd(s.d1)+' '+CN[r.call].name+': <b>'+esc(A)+' → '+esc(B)+'</b>'+(s.d2?'<br>'+kd(s.d2)+' '+CN[r.call].name+': <b>'+esc(B)+' → '+esc(A)+'</b>':' (돌려받는 날 없이 넘깁니다)');

    '<div class="grid g2"><div><label class="f" for="sa">신청하는 분</label><select id="sa"'+(me?" disabled":"")+'>'+staffOpts(a)+'</select></div><div><label class="f" for="sb">바꿔 주실 분</label><select id="sb">'+staffOpts(pre&&pre.b?pre.b:peer(pa),t==="shift"?pa.role:null,a)+'</select></div>'+
    '<div><label class="f" for="sd1">'+(t==="shift"?"바꿀 날":"내 당직 날")+'</label><input type="date" id="sd1" value="'+d1+'"></div><div><label class="f" for="sd2">'+(t==="shift"?"하루 더 맞바꿀 날 (선택)":"상대 당직 날 (맞바꿀 때만)")+'</label><input type="date" id="sd2"></div></div>'+
    '<div style="margin-top:12px"><label class="f" for="smemo">사유 (적지 않으셔도 됩니다)</label><input type="text" id="smemo" maxlength="80"></div><div class="prev" id="sprev" aria-live="polite"></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn pri" type="submit">신청하기</button></div></form>';
  var w=db.swaps.filter(function(s){return s.status==="wait";}),done=db.swaps.filter(function(s){return s.status!=="wait";}).slice(-6).reverse();
  function item(s){var r=s.status==="wait"?swapCalc(s):null,A=person(s.a);
    return '<li><div class="h"><span class="nm">'+esc(A.name)+' ↔ '+esc(nm(s.b))+'</span><span class="dp">'+(s.type==="shift"?"근무":"당직")+' · '+DN[A.dept].name+'</span><span class="tag '+s.status+'">'+(s.status==="wait"?"승인 대기":s.status==="ok"?"승인":"반려")+'</span></div>'+
      '<div class="when">'+kd(s.d1)+(s.d2?' · '+kd(s.d2):'')+'</div>'+(s.memo?'<div class="memo">'+esc(s.memo)+'</div>':'')+
      (r?'<div class="chg-list">'+swapText(s,r)+'</div>':'')+
      (s.status==="wait"&&isAdmin()?'<div class="acts"><button class="btn sm pri" data-sok="'+s.id+'"'+(r.err?" disabled":"")+'>승인</button><button class="btn sm" data-sno="'+s.id+'">반려</button></div>':'')+
      (s.status==="wait"&&!isAdmin()&&db.me===s.a?'<div class="acts"><button class="btn sm" data-sdel="'+s.id+'">신청 거두기</button></div>':'')+'</li>';}
  h+='<h3 class="sub">승인 대기 <span class="r num">'+w.length+'건</span></h3>'+(w.length?'<ol class="req">'+w.map(item).join("")+'</ol>':'<p class="empty">기다리는 신청이 없습니다.</p>');
  h+='<h3 class="sub">처리한 신청</h3>'+(done.length?'<ol class="req">'+done.map(item).join("")+'</ol>':'<p class="empty">기록이 없습니다.</p>');
  h+='<h3 class="sub">최근 변경 기록</h3>'+(db.log.length?'<ul class="plain">'+db.log.slice(0,12).map(function(x){return '<li><span class="d num">'+sd(x.at)+'</span>'+esc(x.txt)+'</li>';}).join("")+'</ul>':'<p class="empty">기록이 없습니다.</p>');
  return h;
}
function peer(p){var c=db.staff.filter(function(x){return x.id!==p.id&&x.dept===p.dept&&x.role===p.role;});return c.length?c[0].id:"";}
function swapForm(){return {type:ui.swapType,a:$("#sa").value,b:$("#sb").value,d1:$("#sd1").value,d2:$("#sd2").value,memo:$("#smemo").value.trim()};}
function swapPrev(){var el=$("#sprev");if(!el)return;var s=swapForm(),r=swapCalc(s);el.innerHTML=swapText(s,r);el.className="prev"+(r.err||(r.warn&&r.warn.length)?" bad":"");}

/* 집계 */
function monthStats(ym){
  var y=+ym.slice(0,4),m=+ym.slice(5,7),first=ym+"-01",last=iso(new Date(y,m,0,12)),days=range(first,last);
  var rows={};db.staff.forEach(function(p){var r={work:0,night:0,sx:0,lv:0,cn:0,cw:0};
    days.forEach(function(d){var c=code(p.id,d);if(works(c))r.work++;if(c==="야간")r.night++;if(c==="수술")r.sx++;if(c==="휴가"||c==="학회")r.lv++;});rows[p.id]=r;});
  days.forEach(function(d){CALLS.forEach(function(c){var w=callWho(c.id,d);if(w&&rows[w]){if(c.id==="night")rows[w].cn++;else rows[w].cw++;}});});
  return {rows:rows,days:days};
}
function vStat(){
  var ym=ui.month,S=monthStats(ym),y=+ym.slice(0,4),m=+ym.slice(5,7);
  function top(k,role){var b=null;db.staff.forEach(function(p){if(role&&p.role!==role)return;if(!b||S.rows[p.id][k]>S.rows[b.id][k])b=p;});return b;}
  var tn=top("cn","vet"),tw=top("cw","vet"),lvs=0;db.staff.forEach(function(p){lvs+=S.rows[p.id].lv;});
  var mx={};["cn","cw","night"].forEach(function(k){mx[k]=0;db.staff.forEach(function(p){mx[k]=Math.max(mx[k],S.rows[p.id][k]);});});
  var h='<div class="lede"><h2>월간 집계</h2><p>근무일·야간 근무·휴가·당직 횟수를 사람별로 셉니다. 밑줄은 그 달 가장 많이 맡은 분입니다. 당직이 한 분께 몰리지 않았는지 보실 때 쓰십시오.</p></div>';
  h+='<div class="weekbar"><button class="btn sm noprint" data-mon="-1" aria-label="이전 달">'+ICON.l+'</button><span class="lbl num">'+y+'년 '+m+'월</span><button class="btn sm noprint" data-mon="1" aria-label="다음 달">'+ICON.r+'</button><span class="sp"></span><span class="out noprint"><button class="btn sm" data-print>인쇄</button><button class="btn sm" data-csv="month">CSV 내려받기</button></span></div>';
  h+='<dl class="sum"><div><dt>평일 야간 호출 최다</dt><dd><span class="big num">'+S.rows[tn.id].cn+'</span>회 · '+esc(tn.name)+'</dd></div><div><dt>주말 호출 최다 (수의사)</dt><dd><span class="big num">'+S.rows[tw.id].cw+'</span>일 · '+esc(tw.name)+'</dd></div><div><dt>휴가·학회 사용</dt><dd><span class="big num">'+lvs+'</span>일 · 전 직원 합계</dd></div></dl>';
  h+='<table class="st"><colgroup><col class="cn"><col><col><col><col><col></colgroup><thead><tr><th scope="col">이름</th><th scope="col">근무일</th><th scope="col">야간 근무</th><th scope="col">휴가</th><th scope="col">평일 호출</th><th scope="col">주말 호출</th></tr></thead><tbody>';
  DEPTS.forEach(function(dp){h+='<tr class="g"><td colspan="6">'+dp.name+'</td></tr>';
    ["vet","tech"].forEach(function(r){members(dp.id,r).forEach(function(p){var x=S.rows[p.id];function v(k){return x[k]&&x[k]===mx[k]?'<span class="hi">'+x[k]+'</span>':(x[k]||"·");}
      h+='<tr><td>'+esc(p.name)+'<small>'+(r==="vet"?"수":"테")+'</small></td><td class="num">'+x.work+'</td><td class="num">'+v("night")+'</td><td class="num">'+(x.lv||"·")+'</td><td class="num">'+v("cn")+'</td><td class="num">'+v("cw")+'</td></tr>';});});});
  h+='</tbody></table><p class="legend">수 = 수의사, 테 = 테크니션. 점(·)은 0입니다. 주말 호출은 맡은 날 수로 셉니다.</p>';
  return h;
}

/* ---------- 동작 ---------- */
function approveLeave(l){
  var imp=leaveImpact(l),p=person(l.sid);
  if(imp.lack.length&&!confirm("승인하시면 "+imp.lack.map(function(x){return kd(x.d)+" "+DN[p.dept].name+" "+ROLE[p.role]+" "+x.n+"명";}).join(", ")+"이 됩니다(최소 "+imp.lack[0].m+"명). 그래도 승인할까요?"))return;
  l.status="ok";
  imp.calls.forEach(function(x){handOff(x.c,x.d,true);});
  logit("휴가 승인 · "+p.name+" "+l.kind+" · "+span(l.from,l.to)+(imp.calls.length?" · 당직 "+imp.calls.length+"건 넘김":""));
  save();render();toast(p.name+" 님 휴가를 승인했습니다"+(imp.calls.length?". 겹친 당직은 다음 순번에게 넘겼습니다":""));
}
function handOff(cid,d,quiet){
  var ord=db.order[cid],w=callWho(cid,d),i=ord.indexOf(w);
  for(var k=1;k<=ord.length;k++){var c=ord[mod(i+k,ord.length)];if(c!==w&&!leaveOn(c,d)){db.onOv[cid+"|"+d]=c;if(!quiet){logit("당직 넘김 · "+nm(w)+" → "+nm(c)+" · "+kd(d)+" "+CN[cid].name);save();render();toast(kd(d)+" "+CN[cid].name+"을 "+nm(c)+" 님께 넘겼습니다");}return c;}}
  if(!quiet)toast("넘길 수 있는 분이 없습니다");return null;
}
function applySwap(s){
  var r=swapCalc(s);if(r.err){toast(r.err);return;}
  if(r.call){db.onOv[r.call+"|"+s.d1]=s.b;if(s.d2)db.onOv[r.call+"|"+s.d2]=s.a;}
  else r.ch.forEach(function(c){db.ov[s.a+"|"+c.d]=c.b;db.ov[s.b+"|"+c.d]=c.a;});
  /* 원래 근무와 같아진 칸은 표시를 지운다 */
  [s.a,s.b].forEach(function(id){[s.d1,s.d2].forEach(function(d){if(d&&db.ov[id+"|"+d]===person(id).pat[dow(d)])delete db.ov[id+"|"+d];});});
  s.status="ok";logit((r.call?"당직":"근무")+" 바꾸기 승인 · "+nm(s.a)+" ↔ "+nm(s.b)+" · "+kd(s.d1)+(s.d2?", "+kd(s.d2):""));
  save();render();toast("승인했습니다. 근무표에 반영했습니다");
}
document.addEventListener("click",function(e){
  if(e.target.hasAttribute&&e.target.hasAttribute("data-scrim")){closeSheet();return;}
  var b=e.target.closest("button");if(!b)return;var a;
  if((a=b.getAttribute("data-tab"))){if(a!==cur.view||cur.modal){ui.pre=null;go({view:a});}return;}
  if((a=b.getAttribute("data-wk"))){ui.wk=a==="0"?monOf(TODAY):add(ui.wk,+a);render();return;}
  if((a=b.getAttribute("data-dept"))){ui.dept=a;render();return;}
  if((a=b.getAttribute("data-role"))){ui.role=a;render();return;}
  if((a=b.getAttribute("data-mon"))){var y=+ui.month.slice(0,4),m=+ui.month.slice(5,7)-1+(+a);var dd=new Date(y,m,1,12);ui.month=iso(dd).slice(0,7);render();return;}
  if((a=b.getAttribute("data-cell"))){var q=a.split("|");openSheet({sid:q[0],d:q[1]});return;}
  if(b.hasAttribute("data-close")){closeSheet();return;}
  if(b.hasAttribute("data-setcell")){var sel=document.querySelector('input[name=sc]:checked');if(!sel)return;var M=cur.modal,p=person(M.sid),k=M.sid+"|"+M.d,old=code(M.sid,M.d);
    if(sel.value===p.pat[dow(M.d)])delete db.ov[k];else db.ov[k]=sel.value;
    if(old!==sel.value)logit("근무 고침 · "+p.name+" · "+kd(M.d)+" "+old+" → "+sel.value);
    save();var n=count(p.dept,p.role,M.d),mn=minOf(p.dept,p.role,M.d);history.back();toast(n<mn?"저장했습니다. 이날 "+DN[p.dept].name+" "+RS[p.role]+" "+n+"명으로 최소 인원보다 적습니다":"저장했습니다");return;}
  if(b.hasAttribute("data-undo")){var M2=cur.modal;delete db.ov[M2.sid+"|"+M2.d];logit("근무 되돌림 · "+nm(M2.sid)+" · "+kd(M2.d));save();history.back();toast("원래 근무로 되돌렸습니다");return;}
  if((a=b.getAttribute("data-pre"))){ui.pre={v:a,sid:cur.modal.sid,d:cur.modal.d};if(a==="swap")ui.swapType="shift";swapTo({view:a});return;}
  if(b.hasAttribute("data-print")){window.print();return;}
  if((a=b.getAttribute("data-csv"))){
    if(a==="week"){var days=range(ui.wk,add(ui.wk,6)),rows=[["진료과","직종","이름"].concat(days.map(sd))];
      DEPTS.forEach(function(dp){["vet","tech"].forEach(function(r){rows.push([dp.name,ROLE[r]+" 인원",""].concat(days.map(function(d){return count(dp.id,r,d);})));members(dp.id,r).forEach(function(p){rows.push([dp.name,ROLE[r],p.name].concat(days.map(function(d){return code(p.id,d);})));});});});
      CALLS.forEach(function(c){rows.push(["당직",c.name,""].concat(days.map(function(d){return nm(callWho(c.id,d));})));});
      csv("근무표_"+ui.wk+".csv",rows);}
    else{var S=monthStats(ui.month),r2=[["진료과","직종","이름","근무일","야간 근무","수술일","휴가·학회","평일 야간 호출","주말 호출(일)"]];
      DEPTS.forEach(function(dp){["vet","tech"].forEach(function(r){members(dp.id,r).forEach(function(p){var x=S.rows[p.id];r2.push([dp.name,ROLE[r],p.name,x.work,x.night,x.sx,x.lv,x.cn,x.cw]);});});});
      csv("근무집계_"+ui.month+".csv",r2);}
    return;}
  if((a=b.getAttribute("data-hand"))){var h=a.split("|");handOff(h[0],h[1]);return;}
  if((a=b.getAttribute("data-ord"))){var o=a.split("|"),ord=db.order[o[0]],i=+o[1],j=i+(+o[2]);if(j<0||j>=ord.length)return;var tmp=ord[i];ord[i]=ord[j];ord[j]=tmp;save();
    var det=b.closest("details"),idx=Array.prototype.indexOf.call(document.querySelectorAll("details.ord"),det);render();var nd=document.querySelectorAll("details.ord")[idx];if(nd)nd.open=true;toast("순번을 바꿨습니다. 오늘부터 순서가 새로 돕니다");return;}
  if((a=b.getAttribute("data-lok"))){approveLeave(db.leaves.filter(function(l){return l.id===a;})[0]);return;}
  if((a=b.getAttribute("data-lno"))){var l=db.leaves.filter(function(x){return x.id===a;})[0],why=prompt("반려 사유를 적어 주십시오 (신청하신 분께 보입니다)","");if(why===null)return;l.status="no";l.reply=why.trim();logit("휴가 반려 · "+nm(l.sid)+" · "+span(l.from,l.to));save();render();toast("반려했습니다");return;}
  if((a=b.getAttribute("data-lcancel"))){var lc=db.leaves.filter(function(x){return x.id===a;})[0];if(!confirm(nm(lc.sid)+" 님 휴가 승인을 취소할까요? 근무표가 원래 근무로 돌아갑니다."))return;lc.status="no";lc.reply="승인 취소";logit("휴가 승인 취소 · "+nm(lc.sid)+" · "+span(lc.from,lc.to));save();render();toast("승인을 취소했습니다");return;}
  if((a=b.getAttribute("data-ldel"))){if(!confirm("이 신청을 거둘까요?"))return;db.leaves=db.leaves.filter(function(x){return x.id!==a;});save();render();toast("신청을 거뒀습니다");return;}
  if((a=b.getAttribute("data-sok"))){applySwap(db.swaps.filter(function(s){return s.id===a;})[0]);return;}
  if((a=b.getAttribute("data-sno"))){var s=db.swaps.filter(function(x){return x.id===a;})[0];if(!confirm("이 바꾸기 신청을 반려할까요?"))return;s.status="no";logit("바꾸기 반려 · "+nm(s.a)+" ↔ "+nm(s.b));save();render();toast("반려했습니다");return;}
  if((a=b.getAttribute("data-sdel"))){if(!confirm("이 신청을 거둘까요?"))return;db.swaps=db.swaps.filter(function(x){return x.id!==a;});save();render();toast("신청을 거뒀습니다");return;}
  if(b.id==="reset"){if(confirm("입력한 내용을 모두 지우고 예시 데이터로 되돌릴까요?")){db=seed();seedCallSwap();save();ui.wk=monOf(TODAY);ui.pre=null;cur={view:"week"};history.replaceState({app:1,s:cur},"");renderWho();render(true);toast("예시 데이터로 되돌렸습니다");}return;}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur.modal)closeSheet();});
document.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target;
  if(f.id==="lform"){var l=leaveForm();if(!l.from||!l.to||l.to<l.from||diff(l.from,l.to)>30){toast("날짜를 다시 확인해 주십시오");return;}
    if(db.leaves.some(function(x){return x.sid===l.sid&&x.status!=="no"&&x.from<=l.to&&x.to>=l.from;})){toast("이미 같은 기간에 신청하신 휴가가 있습니다");return;}
    l.id=uid("l");l.status="wait";l.at=TODAY;db.leaves.push(l);ui.pre=null;save();render();toast("신청했습니다. 승인되면 근무표에 반영됩니다");return;}
  if(f.id==="sform"){var s=swapForm(),r=swapCalc(s);if(r.err){toast(r.err);return;}s.id=uid("s");s.status="wait";s.at=TODAY;db.swaps.push(s);ui.pre=null;save();render();toast("신청했습니다. 승인되면 근무표에 반영됩니다");return;}
});
document.addEventListener("input",function(e){if(e.target.closest("#lform"))leavePrev();if(e.target.closest("#sform"))swapPrev();});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="who"){db.me=t.value;save();ui.pre=null;render();toast(isAdmin()?"원장·팀장 화면입니다. 승인과 근무 고치기를 하실 수 있습니다":nm(db.me)+" 님 화면입니다");return;}
  if(t.name==="stype"){ui.swapType=t.value;var keep={sid:$("#sa").value,d:$("#sd1").value,v:"swap"};if(t.value==="call"){var nc=nextCall(keep.sid);if(nc)keep.d=nc.d;}ui.pre=keep;render();return;}
  if(t.id==="sa"){ui.pre={v:"swap",sid:t.value,d:$("#sd1").value};render();return;}
  if(t.closest&&t.closest("#lform"))leavePrev();
  if(t.closest&&t.closest("#sform"))swapPrev();
});

load();save();renderWho();render();
})();
</script>
