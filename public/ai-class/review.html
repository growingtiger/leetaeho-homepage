<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>수강 후기 · 원장을 위한 AI 실전 교육</title>
<meta name="theme-color" content="#26355c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--paper:#fdfaf3;--paper-2:#f6efe1;--card:#fff;--ink:#2a251f;--ink-2:#5b5245;--ink-3:#8b8070;--line:#e6dcc8;--gold:#a8802f;--navy:#26355c;--sage:#5f7a43;
--serif:"Noto Serif KR","AppleMyungjo",serif;--sans:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);word-break:keep-all;-webkit-text-size-adjust:100%;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 72px}
.lab{font-size:.78rem;letter-spacing:.14em;color:var(--gold);font-weight:600;margin:0}
h1{font-family:var(--serif);font-size:1.75rem;line-height:1.35;margin:8px 0 10px;letter-spacing:-.01em}
.lead{color:var(--ink-2);margin:0;font-size:.98rem}
.dates{margin:22px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}
.dates div{padding:12px 10px 12px 0}.dates div+div{padding-left:14px;border-left:1px solid var(--line)}
.dates b{display:block;font-size:.8rem;color:var(--ink-3);font-weight:500}
.dates span{font-family:var(--serif);font-weight:700;font-size:1.02rem}
.dates small{display:block;font-size:.78rem;color:var(--gold);font-weight:600}
.prog{display:flex;align-items:center;gap:12px;margin:26px 0 6px;font-size:.85rem;color:var(--ink-2)}
.bar{flex:1;height:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);margin-top:14px;padding:20px 20px 18px;position:relative}
.shot{margin:14px 0 2px;border:1px solid var(--line);background:#fff}.shot img{display:block;width:100%;height:auto}.shot figcaption{font-size:.78rem;color:var(--ink-3);padding:6px 10px;border-top:1px solid var(--line)}
.flow{margin-top:26px;background:var(--card);border:1px solid var(--line);padding:18px 20px}.flow h2{font-family:var(--serif);font-size:1.1rem;margin:0 0 6px}.flow>p{margin:0 0 10px;font-size:.92rem;color:var(--ink-2)}.flow ol{margin:0;padding:0;list-style:none;display:grid;gap:0}.flow li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}.flow li b{font-weight:600}.flow li span{color:var(--ink-2)}
.step.done{border-color:#cdd8bf;background:#fbfcf8}
.hd{display:flex;align-items:baseline;gap:12px}
.no{font-family:var(--mono);font-size:.82rem;color:var(--gold)}
.step h2{font-family:var(--serif);font-size:1.18rem;margin:0;flex:1}
.tag{font-size:.72rem;color:var(--ink-3);border:1px solid var(--line);padding:1px 8px;white-space:nowrap}
.why{color:var(--ink-2);font-size:.9rem;margin:6px 0 12px}
.step ul{margin:0;padding:0 0 0 1.1em;display:grid;gap:6px;font-size:.95rem}
.step li::marker{color:var(--gold)}
a{color:var(--navy);font-weight:600;text-underline-offset:3px;overflow-wrap:anywhere}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:3px 10px;font-size:.88rem;margin:0 2px}
kbd{font-family:var(--sans);font-size:.86rem;background:var(--paper-2);border:1px solid var(--line);padding:0 6px;white-space:nowrap}
.note{font-size:.86rem;color:var(--ink-2);background:var(--paper-2);padding:10px 12px;margin-top:12px}
.ok{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:.92rem;cursor:pointer}
.ok input{width:20px;height:20px;margin-top:2px;accent-color:var(--sage);flex:none}
.ok b{color:var(--sage)}
.sub{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sub h3{font-size:.95rem;margin:0 0 6px}
.end{margin-top:28px;font-size:.95rem;color:var(--ink-2)}
.end strong{color:var(--ink)}
footer{margin-top:34px;font-size:.82rem;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:520px){h1{font-size:1.45rem}.dates{grid-template-columns:1fr}.dates div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}.step{padding:18px 16px 16px}}
</style>
<style>
form.rv{margin-top:22px}
.q{background:var(--card);border:1px solid var(--line);padding:18px 20px;margin-top:12px}
.q label.t{display:block;font-family:var(--serif);font-weight:700;font-size:1.05rem;margin-bottom:4px}
.q small{display:block;color:var(--ink-3);font-size:.84rem;margin-bottom:10px}
.q input[type=text],.q textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);background:#fff}
.q textarea{min-height:110px;resize:vertical}
.score{display:flex;gap:6px;flex-wrap:wrap}
.score label,.pub label{border:1px solid var(--line);padding:8px 14px;cursor:pointer;background:#fff;font-size:.95rem}
.score input,.pub input{position:absolute;opacity:0;pointer-events:none}
.score label:has(input:checked),.pub label:has(input:checked){background:var(--navy);color:#fff;border-color:var(--navy)}
.pub{display:grid;gap:6px}
.send{margin-top:18px;width:100%;font:inherit;font-size:1.02rem;background:var(--navy);color:#fff;border:0;padding:14px;cursor:pointer}
.done{background:var(--card);border:1px solid var(--line);padding:26px 20px;margin-top:22px;text-align:center}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
  <p class="lab">원장을 위한 AI 실전 교육 · 수강 후기</p>
  <h1>오늘 하루 어떠셨습니까</h1>
  <p class="lead">다음 기수를 준비하는 데 그대로 반영하겠습니다. 3분이면 됩니다.</p>
  <form class="rv" id="rv">
    <div class="q"><label class="t" for="name">성함</label><small>비워 두셔도 됩니다.</small><input type="text" id="name" maxlength="40"></div>
    <div class="q"><label class="t">기수</label><div class="score" id="cohort">
      <label><input type="radio" name="cohort" value="1">1기</label><label><input type="radio" name="cohort" value="2">2기</label><label><input type="radio" name="cohort" value="3">3기</label><label><input type="radio" name="cohort" value="4">4기</label><label><input type="radio" name="cohort" value="기타">그 밖</label></div></div>
    <div class="q"><label class="t">동료 원장님께 이 교육을 권하시겠습니까?</label><small>0 = 전혀 아니다 · 10 = 꼭 권하겠다</small><div class="score" id="score"></div></div>
    <div class="q"><label class="t" for="best">가장 도움이 된 것</label><textarea id="best" maxlength="1500"></textarea></div>
    <div class="q"><label class="t" for="worse">아쉬웠던 것, 바꿨으면 하는 것</label><small>시간 배분, 설명 속도, 실습 난이도 무엇이든 좋습니다.</small><textarea id="worse" maxlength="1500"></textarea></div>
    <div class="q"><label class="t" for="made">오늘 만드신 프로그램</label><small>이름과 한 줄 설명</small><input type="text" id="made" maxlength="600"></div>
    <div class="q"><label class="t" for="next">다음에 만들어 보고 싶은 것</label><textarea id="next" maxlength="1500" style="min-height:80px"></textarea></div>
    <div class="q"><label class="t" for="quote">다른 원장님께 한마디</label><small>후기로 소개해도 되는 문장을 남겨 주시면 감사하겠습니다.</small><textarea id="quote" maxlength="600" style="min-height:80px"></textarea></div>
    <div class="q"><label class="t">위 한마디를 교육 소개에 써도 될까요?</label><div class="pub">
      <label><input type="radio" name="publish" value="실명">네, 이름과 함께</label>
      <label><input type="radio" name="publish" value="익명">네, 이름 없이 (예: 서울 ○○동물병원 원장)</label>
      <label><input type="radio" name="publish" value="비공개" checked>아니요, 강사만 봐 주십시오</label></div></div>
    <input class="hp" id="website" tabindex="-1" autocomplete="off">
    <button class="send" type="submit">보내기</button>
    <p id="msg" class="why" style="text-align:center"></p>
  </form>
  <div class="done" id="done" hidden><h2 style="font-family:var(--serif);margin:0 0 6px">고맙습니다</h2><p class="why" style="margin:0">남겨 주신 말씀은 다음 기수에 반영하겠습니다.</p></div>
  <footer>원장을 위한 AI 실전 교육 · 이태호</footer>
</main>
<script>
(function(){
  var sc=document.getElementById("score");
  for(var i=0;i<=10;i++){var l=document.createElement("label");l.innerHTML='<input type="radio" name="score" value="'+i+'">'+i;sc.appendChild(l)}
  var f=document.getElementById("rv"),m=document.getElementById("msg");
  function v(id){return document.getElementById(id).value.trim()}
  function r(n){var x=f.querySelector('input[name="'+n+'"]:checked');return x?x.value:""}
  f.addEventListener("submit",function(e){e.preventDefault();
    var d={name:v("name"),cohort:r("cohort"),score:r("score"),best:v("best"),worse:v("worse"),made:v("made"),next:v("next"),quote:v("quote"),publish:r("publish"),website:v("website")};
    if(!d.score&&!d.best&&!d.worse){m.textContent="점수나 의견을 하나 이상 남겨 주십시오.";return}
    m.textContent="보내는 중…";
    fetch("/api/ai-review",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(d)}).then(function(x){return x.json()}).then(function(j){
      if(j.ok){f.hidden=true;document.getElementById("done").hidden=false;window.scrollTo(0,0)}else m.textContent="보내지 못했습니다. 잠시 뒤 다시 눌러 주십시오."
    }).catch(function(){m.textContent="연결이 안 됩니다. 잠시 뒤 다시 눌러 주십시오."})});
})();
</script>
</body>
</html>
