<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>AI 교육 신청 명단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 진료 기록지처럼 왼쪽 시각 열 + 오른쪽 내용 열. 이태호 수의사 홈페이지의 종이·먹·금색 톤을 잇는다. */
:root{
  --paper:#fdfaf3; --paper-2:#f6efe1; --ink:#2a251f; --ink-2:#5b5245; --ink-3:#8b8070;
  --line:#e6dcc8; --sage:#6f8550; --plum:#8e5f80; --gold:#a8802f; --gold-wash:rgba(184,143,62,.12); --navy:#26355c;
  --serif:"Noto Serif KR","AppleMyungjo",Georgia,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --max:1040px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15120e; --paper-2:#1d1913; --ink:#f0e8da; --ink-2:#c3b7a2; --ink-3:#948976;
  --line:#352d22; --sage:#a3b886; --plum:#c79bbb; --gold:#d6ae67; --gold-wash:rgba(214,174,103,.12); --navy:#9db0e0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15120e; --paper-2:#1d1913; --ink:#f0e8da; --ink-2:#c3b7a2; --ink-3:#948976;
  --line:#352d22; --sage:#a3b886; --plum:#c79bbb; --gold:#d6ae67; --gold-wash:rgba(214,174,103,.12); --navy:#9db0e0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:20px}
section{padding-block:72px;border-top:1px solid var(--line)}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(1.55rem,3.2vw,2.1rem);line-height:1.35}
h3{font-size:1.2rem;line-height:1.4}
p{margin:0}
.label{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.lead{color:var(--ink-2);font-size:1.05rem;max-width:62ch}
.sec-head{display:grid;gap:14px;margin-bottom:40px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* hero */
.hero{padding-block:88px 64px;border-top:0}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;align-items:end}
.hero h1{font-size:clamp(2rem,5.4vw,3.5rem);line-height:1.22}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lead{margin-top:24px}
.who{border-left:2px solid var(--gold);padding-left:20px;display:grid;gap:6px;font-size:.95rem;color:var(--ink-2)}
.who strong{font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:12px 40px;margin-top:44px}
.fact{display:grid}
.fact b{font-family:var(--serif);font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.fact span{font-size:.85rem;color:var(--ink-3)}

/* day log */
.log{display:grid;gap:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1.3fr);gap:24px;padding-block:18px;border-bottom:1px solid var(--line);align-items:baseline}
.row time{font-family:var(--mono);font-size:.95rem;color:var(--gold);font-variant-numeric:tabular-nums}
.row h3{font-size:1.05rem}
.row p{color:var(--ink-2);font-size:.95rem}

/* build chart */
.chart-box{overflow-x:auto;padding-bottom:4px}
.chart{min-width:640px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-size:.85rem;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
.tools{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.tools li{font-family:var(--mono);font-size:.82rem;border:1px solid var(--line);padding:6px 12px;color:var(--ink-2)}
.prog-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:44px}
.prog-list h3{font-family:var(--sans);font-size:.8rem;font-weight:600;letter-spacing:.08em;color:var(--ink-3);margin-bottom:10px}
.prog-list ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.93rem}
.prog-list li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding-bottom:5px}
.prog-list li span{font-family:var(--mono);font-size:.75rem;color:var(--ink-3);white-space:nowrap}

/* courses */
.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.course{border:1px solid var(--line);background:var(--paper-2);padding:32px;display:grid;gap:18px;align-content:start}
.course.alt{background:transparent}
.price{font-family:var(--serif);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-family:var(--sans);font-size:.85rem;font-weight:400;color:var(--ink-3);margin-left:6px}
.course dl{margin:0;display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px 14px;font-size:.93rem}
.course dt{color:var(--ink-3)}
.course dd{margin:0}
.fit{font-size:.93rem;color:var(--ink-2);border-top:1px solid var(--line);padding-top:16px}
.fit b{color:var(--ink)}

/* schedule */
.sched{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}
.sched ol{list-style:none;margin:0;padding:0;display:grid}
.sched li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding-block:11px;border-bottom:1px solid var(--line);font-size:.95rem}
.sched li time{font-family:var(--mono);font-size:.85rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sched li.break{color:var(--ink-3)}
.takeaway{display:grid;gap:16px;align-content:start}
.takeaway ul{margin:0;padding-left:1.1em;display:grid;gap:8px;color:var(--ink-2)}

/* faq */
.faq{display:grid;gap:0;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line);padding-block:18px}
.faq summary{cursor:pointer;font-family:var(--serif);font-weight:600;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--mono);color:var(--gold)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin-top:10px;color:var(--ink-2);max-width:66ch}

/* apply */
.apply{background:var(--ink);color:var(--paper);border-top:0}
.apply .label{color:var(--gold)}
.apply h2{color:var(--paper)}
.apply p{color:color-mix(in srgb,var(--paper) 78%,transparent);max-width:60ch}
.apply-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:48px;align-items:start}
.contact{border:1px dashed color-mix(in srgb,var(--paper) 40%,transparent);padding:24px;display:grid;gap:10px;font-size:.95rem}
.contact b{font-family:var(--serif);font-size:1.1rem}
.apply ol{margin:0;padding-left:1.2em;display:grid;gap:6px;color:color-mix(in srgb,var(--paper) 85%,transparent)}
footer{padding-block:32px;font-size:.82rem;color:var(--ink-3)}

@media (max-width:820px){
  .hero-grid,.courses,.sched,.apply-grid{grid-template-columns:minmax(0,1fr)}
  .hero-grid{gap:36px}
  .row{grid-template-columns:72px minmax(0,1fr)}
  .row p{grid-column:2}
  .prog-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  section{padding-block:56px}
}
@media (max-width:480px){
  .prog-list{grid-template-columns:minmax(0,1fr)}
  .course{padding:24px}
  .sched li{grid-template-columns:92px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<style>
.form-wrap{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:56px 80px}
.form-wrap h1{font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.3;margin-top:14px}
.form-wrap .lead{margin-top:16px}
form{display:grid;gap:36px;margin-top:40px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:18px}
legend{font-family:var(--serif);font-weight:700;font-size:1.15rem;margin-bottom:6px;padding:0}
.f{display:grid;gap:6px}
.f > span{font-size:.92rem;font-weight:500}
.f small{color:var(--ink-3);font-size:.82rem}
input[type=text],input[type=tel],select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px 12px;width:100%;border-radius:0}
textarea{min-height:110px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:9px 14px;cursor:pointer;font-size:.93rem}
.choice input{accent-color:var(--gold);margin:0}
.choice label:has(input:checked){border-color:var(--gold);background:var(--gold-wash)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--ink-2)}
.agree input{margin-top:5px;accent-color:var(--gold)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button{font:inherit;font-weight:600;background:var(--ink);color:var(--paper);border:0;padding:14px 28px;cursor:pointer;justify-self:start}
button:disabled{opacity:.5;cursor:default}
.err{color:#b3261e;font-size:.9rem}
.done{border:1px solid var(--gold);background:var(--gold-wash);padding:28px;display:grid;gap:12px;margin-top:40px}
.done h2{font-size:1.4rem}
.copybox{white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;background:var(--paper);border:1px solid var(--line);padding:14px;max-height:260px;overflow:auto}
.c1only[hidden]{display:none}
@media (max-width:560px){.two{grid-template-columns:minmax(0,1fr)}}
</style>
<style>
.adm{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:40px 80px}
.login{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.login input{max-width:280px}
.coh{margin-top:40px}
.coh h2{font-size:1.25rem;display:flex;gap:12px;align-items:baseline}
.coh h2 small{font-family:var(--mono);font-size:.8rem;color:var(--ink-3);font-weight:400}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:.88rem;table-layout:auto}
td:nth-child(3),td:nth-child(5){white-space:nowrap}
td:nth-child(4){min-width:150px}
td:nth-child(6){min-width:110px}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--ink-3);font-size:.78rem;letter-spacing:.04em}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.long{min-width:200px;max-width:280px;white-space:pre-wrap}
.pill{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:2px 8px;border:1px solid var(--gold);color:var(--gold)}
.kt{font:inherit;font-size:.72rem;margin-top:6px;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:3px 8px;cursor:pointer;white-space:nowrap}
.pill.full{background:var(--gold);color:var(--paper)}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<main class="adm">
  <p class="label">원장 확인용 · 외부 공유 금지</p>
  <h1 style="font-size:1.8rem;margin-top:10px">AI 교육 신청 명단</h1>
  <form class="login" id="lf"><input type="password" id="key" placeholder="관리 비밀번호" autocomplete="current-password"><button type="submit">불러오기</button></form>
  <p class="err" id="err" hidden></p>
  <div id="out"></div>
</main>
<script>
(function(){
  var out=document.getElementById("out"),err=document.getElementById("err");

  function msg(a){
    var hi=(a.name||"")+" 원장님, 안녕하세요. 시그니처 동물의료센터 이태호입니다.\n\n";
    var t;
    if(a.course==="1"){
      if(a.seat<5){
        t="'원장을 위한 AI 실전 교육' 신청이 잘 접수되었습니다.\n\n선착순으로 5명이 모이면 한 기수가 열립니다. 기수가 다 차면 몇 기로 진행되는지 알려 드리고, 단톡방을 만들어 모두 가능한 날짜를 함께 정하겠습니다. 진료를 계속 보고 있어 하루 실습은 한 달에 한 번만 진행하는 점 양해 부탁드립니다.\n\n적어 주신 사전 질문은 잘 읽어 보겠습니다. 날짜가 정해지면 노트북 준비 안내문도 함께 보내 드리겠습니다. 조금만 기다려 주십시오.\n\n감사합니다.";
      }else{
        t="'원장을 위한 AI 실전 교육' 신청이 잘 접수되었고, 원장님 신청으로 "+a.cohort+"기 다섯 분이 모두 모였습니다.\n\n곧 단톡방에 초대해 다섯 분이 모두 가능한 날짜를 함께 정하겠습니다. 날짜가 정해지면 노트북 준비 안내문도 보내 드리겠습니다.\n\n적어 주신 사전 질문은 잘 읽어 보겠습니다. 조금만 기다려 주십시오.\n\n감사합니다.";
      }
    }else{
      t="병원 방문 세팅 신청이 잘 접수되었습니다.\n\n진료를 계속 보고 있어 방문 세팅은 한 달에 한 병원씩, 신청 순서대로 찾아뵙고 있습니다. 차례가 되면 먼저 연락드려 날짜를 맞추겠습니다.\n\n적어 주신 업무와 요청사항을 보고 병원에 맞는 세팅을 미리 준비해 두겠습니다. 방문하는 날에는 원하시는 프로그램을 병원에서 직접 만들어 쓰실 수 있도록 환경을 세팅하고, 함께 하나씩 만들어 보겠습니다. 조금만 기다려 주십시오.\n\n감사합니다.";
    }
    return hi+t;
  }
  var MSG={};
  out.addEventListener("click",function(e){var b=e.target.closest(".kt");if(!b)return;var t=MSG[b.dataset.no];
    function done(){b.textContent="복사했습니다";setTimeout(function(){b.textContent="카톡 문안 복사"},1600);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){prompt("복사해 주십시오",t);});}else{prompt("복사해 주십시오",t);}});

  function payMsg(a){
    var hi=(a.name||"")+" 원장님, 안녕하세요. 이태호입니다.\n\n";
    if(a.course==="1") return hi+"'원장을 위한 AI 실전 교육' "+a.cohort+"기 날짜가 [날짜]로 확정되었습니다.\n\n교육비 1,100,000원(부가세 포함)을 [입금 기한]까지 아래 계좌로 보내 주시면 자리가 확정됩니다.\n[은행] [계좌번호] 예금주 주식회사 더벳로드\n\n세금계산서를 받으실 사업자등록번호와 이메일을 함께 알려 주십시오. 노트북 준비 안내문은 따로 보내 드리겠습니다.\n\n감사합니다.";
    return hi+"병원 방문 세팅 날짜가 [날짜]로, 세팅 항목이 확정되었습니다.\n\n대금 5,500,000원(부가세 포함) 가운데 50%인 2,750,000원을 [입금 기한]까지 아래 계좌로 보내 주십시오. 나머지 50%는 방문을 마친 날 받습니다.\n[은행] [계좌번호] 예금주 주식회사 더벳로드\n\n세금계산서를 받으실 사업자등록번호와 이메일을 함께 알려 주십시오.\n\n감사합니다.";
  }
  var PAY={};
  out.addEventListener("click",function(e){var b=e.target.closest(".kp");if(!b)return;var t=PAY[b.dataset.no];
    function done(){b.textContent="복사했습니다";setTimeout(function(){b.textContent="입금 안내 복사"},1600);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){prompt("복사해 주십시오",t);});}else{prompt("복사해 주십시오",t);}});
  function esc(t){var d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML;}
  function row(a,c1){MSG[a.no]=msg(a);PAY[a.no]=payMsg(a);return "<tr><td class=num>"+(c1?a.seat+"/5":a.order)+"<br><button type=button class=kt data-no='"+a.no+"'>카톡 문안 복사</button><br><button type=button class='kt kp' data-no='"+a.no+"'>입금 안내 복사</button></td><td class=num>"+esc(a.at.slice(5,16).replace("T"," "))+"</td><td>"+esc(a.name)+"</td><td>"+esc(a.hospital)+"<br><small>"+esc(a.region)+" "+esc(a.type)+"</small></td><td class=num>"+esc(a.phone)+"</td><td>"+esc(a.laptop||"")+"<br><small>"+esc(a.ai)+"</small></td><td class=long>"+esc(a.want)+"</td><td class=long>"+esc(a.pain)+"</td><td class=long>"+esc(a.ask)+"</td></tr>";}
  var TH="<tr><th>순번</th><th>접수</th><th>성함</th><th>병원</th><th>연락처</th><th>노트북·AI</th><th>만들고 싶은 것</th><th>시간 뺏는 일</th><th>요청사항</th></tr>";
  function load(k){
    fetch("/api/ai-apply?list=1",{headers:{"x-admin-key":k}}).then(function(r){return r.json().then(function(j){return{s:r.status,j:j}})}).then(function(x){
      if(x.s===401){err.textContent="비밀번호가 맞지 않습니다.";err.hidden=false;return;}
      if(x.s===503){err.textContent="저장소가 아직 연결되지 않았습니다. 지금은 카톡으로 받은 신청만 있습니다.";err.hidden=false;return;}
      if(!x.j.ok){err.textContent="불러오지 못했습니다. 잠시 뒤 다시 눌러 주십시오.";err.hidden=false;return;}
      err.hidden=true;try{sessionStorage.setItem("aik",k)}catch(e){}
      var items=x.j.items,h="",groups={};
      items.filter(function(a){return a.course==="1"}).forEach(function(a){(groups[a.cohort]=groups[a.cohort]||[]).push(a)});
      Object.keys(groups).sort(function(a,b){return a-b}).forEach(function(c){var g=groups[c],full=g.length>=5;
        h+="<section class=coh><h2>과정 1 · "+c+"기 <span class='pill"+(full?" full":"")+"'>"+(full?"마감 5/5":"모집 중 "+g.length+"/5")+"</span></h2><div class=tbl><table>"+TH+g.map(function(a){return row(a,true)}).join("")+"</table></div></section>";});
      var c2=items.filter(function(a){return a.course==="2"});
      h+="<section class=coh><h2>과정 2 · 방문 세팅 <small>"+c2.length+"건</small></h2>"+(c2.length?"<div class=tbl><table>"+TH+c2.map(function(a){return row(a,false)}).join("")+"</table></div>":"<p class=lead>아직 신청이 없습니다.</p>")+"</section>";
      if(!items.length)h="<section class=coh><p class=lead>아직 신청이 없습니다.</p></section>";
      out.innerHTML=h;
    }).catch(function(){err.textContent="불러오지 못했습니다.";err.hidden=false;});
  }
  document.getElementById("lf").addEventListener("submit",function(e){e.preventDefault();load(document.getElementById("key").value.trim());});
  try{var k=sessionStorage.getItem("aik");if(k){document.getElementById("key").value=k;load(k);}}catch(e){}
})();
</script>
